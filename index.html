      if (pass < 2){
        if (pts3d > bestN){ bestN = pts3d; bestSg = sg; }
        for (let v = 0; v < vCnt; v++) if (TN[v] === 2) TN[v] = 1;
      }
    }
    if (pts3d >= 8) scaleFixed = true;
    else { for (let v = 0; v < vCnt; v++) if (TN[v] === 2) TN[v] = 1; pts3d = 0; }
    return;
  }

  /* --- РОБОЧИЙ РЕЖИМ: резекція, потім накопичення --- */
  if (!resection()){ poseLost = true; return; }
  const pi = pushPose();
  if (!sealed){
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || !EnoughObs(v)) continue;
      addObs(v, PX[v], PY[v], pi, curC[0], curC[1], curC[2]);
    }
    triangulate();
  } else {
    let n = 0;
    for (let v = 0; v < vCnt; v++) if (VAlive[v] && TN[v] === 2) n++;
    pts3d = n;
  }
}
function EnoughObs(v){
  return VPin[v] >= 2 && VConf[v] >= 6 &&
         PX[v] > 2 && PY[v] > 2 && PX[v] < pw - 2 && PY[v] < ph - 2;
}

/* ---------- проєкція 3D → екран ---------- */
function project3(v, o){
  const k = v*3;
  const dx = TX[k]-curC[0], dy = TX[k+1]-curC[1], dz = TX[k+2]-curC[2];
  qConj(curQ, _q);
  _d[0]=dx; _d[1]=dy; _d[2]=dz;
  qRot(_q, _d, _r);
  if (_r[2] <= 0.02) return false;
  o[0] = CAM.cx + CAM.fx * _r[0] / _r[2];
  o[1] = CAM.cy + CAM.fy * _r[1] / _r[2];
  o[2] = _r[2];
  return true;
}

/* ============================================================
   ШАР E — СКАН: ЗАПИС, ОФЛАЙН-УТОЧНЕННЯ, ВЬЮПОРТ, ЕКСПОРТ
   ============================================================
   Між СТОП і показом немає обмеження реального часу. Тому тут
   повороти вже НЕ вважаються точними: кожна поза підганяється
   по 6 параметрах за похибкою перепроєкції. Гіроскоп лишається
   початковим наближенням, а не істиною — саме це рятує від
   його 0.5°, які в живому режимі руйнували реконструкцію.
   ============================================================ */

const OBSMAX = 240000, KFMAX = 400;
let recOn = false, scanReady = false, refining = false;
let kfQ, kfC, kfN = 0;
let obsK, obsId, obsU, obsV, obsN = 0;
let edgeSeen = null;
let lastKfC = null;
let refineLog = '';

/* модель після уточнення */
const SM = { X:null, id:null, n:0, E:null, m:0, cx:0, cy:0, cz:0, rad:1 };

function allocScan(){
  kfQ = new Float32Array(KFMAX * 4); kfC = new Float32Array(KFMAX * 3);
  obsK = new Int32Array(OBSMAX); obsId = new Int32Array(OBSMAX);
  obsU = new Float32Array(OBSMAX); obsV = new Float32Array(OBSMAX);
}
function resetScan(){
  if (!kfQ) allocScan();
  kfN = 0; obsN = 0; recOn = false; scanReady = false; refining = false;
  edgeSeen = new Map(); lastKfC = null; refineLog = ''; shotTick = 0;
  resetDense();
  SM.n = 0; SM.m = 0;
}

function startRec(){
  resetScan();
  recOn = true;
}

/* Кадр пишемо, лише коли камера відчутно зсунулась — інакше однакові
   спостереження лише роздують систему без нової інформації. */
function recFrame(){
  if (!recOn || !scaleFixed || kfN >= KFMAX) return;
  if (lastKfC){
    const d = Math.hypot(curC[0]-lastKfC[0], curC[1]-lastKfC[1], curC[2]-lastKfC[2]);
    if (d < 0.015) return;
  }
  const k = kfN++;
  kfQ[k*4]=curQ[0]; kfQ[k*4+1]=curQ[1]; kfQ[k*4+2]=curQ[2]; kfQ[k*4+3]=curQ[3];
  kfC[k*3]=curC[0]; kfC[k*3+1]=curC[1]; kfC[k*3+2]=curC[2];
  lastKfC = [curC[0], curC[1], curC[2]];
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v] || !EnoughObs(v) || obsN >= OBSMAX) continue;
    obsK[obsN]=k; obsId[obsN]=VUid[v]; obsU[obsN]=PX[v]; obsV[obsN]=PY[v]; obsN++;
  }
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EConf[e] < 6) continue;
    const a = VUid[EA[e]], b = VUid[EB[e]];
    if (a === b) continue;
    const key = a < b ? a + ',' + b : b + ',' + a;
    edgeSeen.set(key, (edgeSeen.get(key) || 0) + 1);
  }
}

/* ---------- 6×6 Холецький ---------- */
function chol6(A, b, x){
  const L = new Float64Array(36);
  for (let i = 0; i < 6; i++){
    for (let j = 0; j <= i; j++){
      let s = A[i*6+j];
      for (let k = 0; k < j; k++) s -= L[i*6+k]*L[j*6+k];
      if (i === j){ if (s < 1e-12) return false; L[i*6+i] = Math.sqrt(s); }
      else L[i*6+j] = s / L[j*6+j];
    }
  }
  const y = new Float64Array(6);
  for (let i = 0; i < 6; i++){
    let s = b[i];
    for (let k = 0; k < i; k++) s -= L[i*6+k]*y[k];
    y[i] = s / L[i*6+i];
  }
  for (let i = 5; i >= 0; i--){
    let s = y[i];
    for (let k = i+1; k < 6; k++) s -= L[k*6+i]*x[k];
    x[i] = s / L[i*6+i];
  }
  return true;
}

/* ---------- офлайн-уточнення ---------- */
const _qi=[0,0,0,1], _pc=[0,0,0], _wr=[0,0,0];

function refineScan(iters){
  if (obsN < 60 || kfN < 4) return false;
  refining = true;
  updCam();

  /* стабільні id → щільні індекси */
  const idMap = new Map();
  for (let i = 0; i < obsN; i++)
    if (!idMap.has(obsId[i])) idMap.set(obsId[i], idMap.size);
  const nP = idMap.size;
  const PX3 = new Float64Array(nP * 3);
  const has = new Uint8Array(nP);
  const idx = new Int32Array(obsN);
  for (let i = 0; i < obsN; i++) idx[i] = idMap.get(obsId[i]);

  /* нормальні рівняння тріангуляції — по всіх спостереженнях одразу */
  const pA = new Float64Array(nP * 6), pB = new Float64Array(nP * 3);
  const cnt = new Int32Array(nP);
  const pD0 = new Float64Array(nP * 3), pPar = new Float64Array(nP);
  /* Офлайн бачить лише вікно запису (база коротша), зате має десятки
     спостережень на точку замість двох — тому поріг нижчий за живий. */
  const needPar = Math.max(1.0, P.parallax * 0.4) * Math.PI / 180;
  function retriangulate(){
    pA.fill(0); pB.fill(0); cnt.fill(0); pPar.fill(0);
    const r=[0,0,0], rw=[0,0,0];
    for (let i = 0; i < obsN; i++){
      const k = obsK[i], p = idx[i];
      pixRay(obsU[i], obsV[i], r);
      _qi[0]=kfQ[k*4]; _qi[1]=kfQ[k*4+1]; _qi[2]=kfQ[k*4+2]; _qi[3]=kfQ[k*4+3];
      qRot(_qi, r, rw);
      const dx=rw[0], dy=rw[1], dz=rw[2];
      /* кут розкриву пучка: без нього в модель лізуть вироджені точки,
         тріангульовані з майже паралельних променів */
      if (cnt[p] === 0){ pD0[p*3]=dx; pD0[p*3+1]=dy; pD0[p*3+2]=dz; }
      else {
        const dt = pD0[p*3]*dx + pD0[p*3+1]*dy + pD0[p*3+2]*dz;
        const ang = Math.acos(Math.max(-1, Math.min(1, dt)));
        if (ang > pPar[p]) pPar[p] = ang;
      }
      const m00=1-dx*dx, m01=-dx*dy, m02=-dx*dz;
      const m11=1-dy*dy, m12=-dy*dz, m22=1-dz*dz;
      const cx=kfC[k*3], cy=kfC[k*3+1], cz=kfC[k*3+2];
      const a=p*6, b=p*3;
      pA[a]+=m00; pA[a+1]+=m01; pA[a+2]+=m02;
      pA[a+3]+=m11; pA[a+4]+=m12; pA[a+5]+=m22;
      pB[b]  += m00*cx + m01*cy + m02*cz;
      pB[b+1]+= m01*cx + m11*cy + m12*cz;
      pB[b+2]+= m02*cx + m12*cy + m22*cz;
      cnt[p]++;
    }
    const o=[0,0,0];
    let good = 0;
    for (let p = 0; p < nP; p++){
      has[p] = 0;
      if (cnt[p] < 3 || pPar[p] < needPar) continue;
      const a=p*6, b=p*3;
      if (!solve3(pA[a],pA[a+1],pA[a+2],pA[a+3],pA[a+4],pA[a+5],
                  pB[b],pB[b+1],pB[b+2], o)) continue;
      PX3[b]=o[0]; PX3[b+1]=o[1]; PX3[b+2]=o[2];
      has[p]=1; good++;
    }
    return good;
  }

  /* середня похибка перепроєкції */
  function reproj(){
    let acc = 0, n = 0;
    for (let i = 0; i < obsN; i++){
      const p = idx[i]; if (!has[p]) continue;
      const k = obsK[i];
      _qi[0]=-kfQ[k*4]; _qi[1]=-kfQ[k*4+1]; _qi[2]=-kfQ[k*4+2]; _qi[3]=kfQ[k*4+3];
      _wr[0]=PX3[p*3]-kfC[k*3]; _wr[1]=PX3[p*3+1]-kfC[k*3+1]; _wr[2]=PX3[p*3+2]-kfC[k*3+2];
      qRot(_qi, _wr, _pc);
      if (_pc[2] <= 0.02) continue;
      const du = CAM.cx + CAM.fx*_pc[0]/_pc[2] - obsU[i];
      const dv = CAM.cy + CAM.fy*_pc[1]/_pc[2] - obsV[i];
      acc += Math.sqrt(du*du + dv*dv); n++;
    }
    return n ? acc/n : -1;
  }

  /* 6-параметрична підгонка однієї пози: поворот ТЕЖ вільний */
  const H = new Float64Array(36), g = new Float64Array(6), dx6 = new Float64Array(6);
  function refinePose(k, lambda){
    if (k === 0) return;            // перший кадр закріплений — інакше вільна калібровка
    H.fill(0); g.fill(0);
    let n = 0;
    _qi[0]=-kfQ[k*4]; _qi[1]=-kfQ[k*4+1]; _qi[2]=-kfQ[k*4+2]; _qi[3]=kfQ[k*4+3];
    /* R^T як 3 рядки: обертаємо базисні вектори */
    const RT = new Float64Array(9);
    for (let c = 0; c < 3; c++){
      _wr[0]=c===0?1:0; _wr[1]=c===1?1:0; _wr[2]=c===2?1:0;
      qRot(_qi, _wr, _pc);
      RT[0*3+c]=_pc[0]; RT[1*3+c]=_pc[1]; RT[2*3+c]=_pc[2];
    }
    for (let i = 0; i < obsN; i++){
      if (obsK[i] !== k) continue;
      const p = idx[i]; if (!has[p]) continue;
      _wr[0]=PX3[p*3]-kfC[k*3]; _wr[1]=PX3[p*3+1]-kfC[k*3+1]; _wr[2]=PX3[p*3+2]-kfC[k*3+2];
      qRot(_qi, _wr, _pc);
      const X=_pc[0], Y=_pc[1], Z=_pc[2];
      if (Z <= 0.02) continue;
      const iz=1/Z, iz2=iz*iz;
      const ru = CAM.cx + CAM.fx*X*iz - obsU[i];
      const rv = CAM.cy + CAM.fy*Y*iz - obsV[i];
      /* ∂(u,v)/∂Xc */
      const du=[CAM.fx*iz, 0, -CAM.fx*X*iz2];
      const dv=[0, CAM.fy*iz, -CAM.fy*Y*iz2];
      /* ∂Xc/∂δω = [Xc]×  — кососиметрична матриця вектора (X,Y,Z).
         Знак тут критичний: з протилежним крок повороту йде назад
         і оптимізація розлітається тим сильніше, чим більше шуму гіро. */
      const Jw = [[0,-Z,Y],[Z,0,-X],[-Y,X,0]];
      const Ju = new Float64Array(6), Jv = new Float64Array(6);
      for (let c = 0; c < 3; c++){
        Ju[c] = du[0]*Jw[0][c] + du[1]*Jw[1][c] + du[2]*Jw[2][c];
        Jv[c] = dv[0]*Jw[0][c] + dv[1]*Jw[1][c] + dv[2]*Jw[2][c];
        Ju[3+c] = -(du[0]*RT[0*3+c] + du[1]*RT[1*3+c] + du[2]*RT[2*3+c]);
        Jv[3+c] = -(dv[0]*RT[0*3+c] + dv[1]*RT[1*3+c] + dv[2]*RT[2*3+c]);
      }
      /* Хубер: один поганий трек не має тягнути позу */
      const r2 = ru*ru + rv*rv, dlt = 3.0;
      const w = r2 > dlt*dlt ? dlt/Math.sqrt(r2) : 1;
      for (let a = 0; a < 6; a++){
        g[a] -= w*(Ju[a]*ru + Jv[a]*rv);
        for (let b = 0; b <= a; b++) H[a*6+b] += w*(Ju[a]*Ju[b] + Jv[a]*Jv[b]);
      }
      n++;
    }
    if (n < 8) return;
    for (let a = 0; a < 6; a++){
      H[a*6+a] *= (1 + lambda);
      for (let b = a+1; b < 6; b++) H[a*6+b] = H[b*6+a];
    }
    if (!chol6(H, g, dx6)) return;
    let mag = 0; for (let a = 0; a < 6; a++) mag += dx6[a]*dx6[a];
    if (!isFinite(mag) || mag > 1) return;
    /* поворот: мале приростання кватерніона */
    const hw=dx6[0]*0.5, hx=dx6[1]*0.5, hy=dx6[2]*0.5;
    const dq=[hw, hx, hy, 1];
    const nq=Math.hypot(dq[0],dq[1],dq[2],dq[3]);
    dq[0]/=nq; dq[1]/=nq; dq[2]/=nq; dq[3]/=nq;
    const cur=[kfQ[k*4],kfQ[k*4+1],kfQ[k*4+2],kfQ[k*4+3]], out=[0,0,0,1];
    qMul(cur, dq, out);
    const on=Math.hypot(out[0],out[1],out[2],out[3]);
    kfQ[k*4]=out[0]/on; kfQ[k*4+1]=out[1]/on; kfQ[k*4+2]=out[2]/on; kfQ[k*4+3]=out[3]/on;
    kfC[k*3]+=dx6[3]; kfC[k*3+1]+=dx6[4]; kfC[k*3+2]+=dx6[5];
  }

  let good = retriangulate();
  const e0 = reproj();
  let best = e0, lambda = 1e-3;
  const snapQ = new Float32Array(kfN*4), snapC = new Float32Array(kfN*3);
  for (let it = 0; it < iters; it++){
    snapQ.set(kfQ.subarray(0, kfN*4)); snapC.set(kfC.subarray(0, kfN*3));
    for (let k = 0; k < kfN; k++) refinePose(k, lambda);
    retriangulate();
    const e = reproj();
    if (e >= 0 && e < best){
      best = e; lambda = Math.max(1e-6, lambda*0.6);      // крок прийнято
    } else {
      kfQ.set(snapQ, 0); kfC.set(snapC, 0);               // відкат
      lambda = Math.min(1e2, lambda*4);
      if (lambda >= 1e2) break;
    }
  }
  good = retriangulate();
  const e1 = reproj();
  refineLog = `перепроєкція ${e0.toFixed(2)} → ${e1.toFixed(2)} px, точок ${good}, кадрів ${kfN}`;

  /* збірка моделі: викидаємо явні викиди по медіанній відстані */
  const keep = [], rmap = new Map();
  for (const [sid, p] of idMap){ if (has[p]) keep.push([sid, p]); }
  SM.n = keep.length;
  SM.X = new Float32Array(SM.n * 3); SM.id = new Int32Array(SM.n);
  let cx=0, cy=0, cz=0;
  for (let i = 0; i < SM.n; i++){
    const [sid, p] = keep[i];
    SM.X[i*3]=PX3[p*3]; SM.X[i*3+1]=PX3[p*3+1]; SM.X[i*3+2]=PX3[p*3+2];
    SM.id[i]=sid; rmap.set(sid, i);
    cx+=SM.X[i*3]; cy+=SM.X[i*3+1]; cz+=SM.X[i*3+2];
  }
  if (SM.n){ cx/=SM.n; cy/=SM.n; cz/=SM.n; }
  /* радіус по 90-му перцентилю — один викид не має ламати кадрування */
  const rr = [];
  for (let i = 0; i < SM.n; i++)
    rr.push(Math.hypot(SM.X[i*3]-cx, SM.X[i*3+1]-cy, SM.X[i*3+2]-cz));
  rr.sort((a,b)=>a-b);
  SM.cx=cx; SM.cy=cy; SM.cz=cz;
  SM.rad = rr.length ? Math.max(1e-3, rr[Math.min(rr.length-1, (rr.length*0.9)|0)]) : 1;

  const el = [];
  edgeSeen.forEach((c, key) => {
    if (c < 3) return;
    const parts = key.split(',');
    const a = rmap.get(+parts[0]), b = rmap.get(+parts[1]);
    if (a === undefined || b === undefined || a === b) return;
    el.push(a, b);
  });
  SM.E = new Int32Array(el); SM.m = el.length >> 1;
  refining = false;
  scanReady = SM.n >= 8;
  return scanReady;
}

/* ---------- вьюпорт: орбітальна камера від пальця ---------- */
const VP = { az:0.6, el:0.35, dist:3.2, on:false };
const _vp=[0,0,0];
function vpProject(i, o){
  const ca=Math.cos(VP.az), sa=Math.sin(VP.az);
  const ce=Math.cos(VP.el), se=Math.sin(VP.el);
  let x=SM.X[i*3]-SM.cx, y=SM.X[i*3+1]-SM.cy, z=SM.X[i*3+2]-SM.cz;
  const s=1/SM.rad; x*=s; y*=s; z*=s;
  const x1 = ca*x + sa*z, z1 = -sa*x + ca*z;
  const y2 = ce*y - se*z1, z2 = se*y + ce*z1;
  const zc = z2 + VP.dist;
  if (zc < 0.05) return false;
  const f = Math.min(ovc.width, ovc.height) * 0.42;
  o[0] = ovc.width*0.5 + f*x1/zc;
  o[1] = ovc.height*0.5 + f*y2/zc;
  o[2] = zc;
  return true;
}
const _va=[0,0,0], _vb=[0,0,0];
function drawViewport(){
  const W = ovc.width, H = ovc.height;
  octx.setTransform(1,0,0,1,0,0);
  octx.clearRect(0,0,W,H);
  octx.fillStyle = 'rgba(3,9,6,.97)';
  octx.fillRect(0,0,W,H);
  let zmin=1e9, zmax=-1e9;
  for (let i = 0; i < SM.n; i++)
    if (vpProject(i,_va)){ if(_va[2]<zmin)zmin=_va[2]; if(_va[2]>zmax)zmax=_va[2]; }
  const span = Math.max(1e-3, zmax-zmin);
  octx.lineCap='round'; octx.lineJoin='round';
  for (let e = 0; e < SM.m; e++){
    const a = SM.E[e*2], b = SM.E[e*2+1];
    if (!vpProject(a,_va) || !vpProject(b,_vb)) continue;
    const t = 1 - (((_va[2]+_vb[2])*0.5)-zmin)/span;
    octx.lineWidth = 1.0 + 2.0*t;
    octx.strokeStyle = 'rgba(' + lerpCol(t) + ',' + (0.35+0.6*t).toFixed(3) + ')';
    octx.beginPath(); octx.moveTo(_va[0],_va[1]); octx.lineTo(_vb[0],_vb[1]); octx.stroke();
  }
  for (let i = 0; i < SM.n; i++){
    if (!vpProject(i,_va)) continue;
    const t = 1 - (_va[2]-zmin)/span;
    octx.fillStyle = 'rgba(218,255,199,' + (0.3+0.5*t).toFixed(3) + ')';
    octx.beginPath(); octx.arc(_va[0],_va[1], 1.6+1.6*t, 0, 6.2832); octx.fill();
  }
  octx.font='700 11px ui-monospace,monospace';
  octx.fillStyle='rgba(106,213,130,.85)';
  octx.fillText(SM.n + ' ТОЧОК · ' + SM.m + ' РЕБЕР', 18, 34);
  octx.fillStyle='rgba(143,169,154,.75)';
  octx.font='500 10px ui-monospace,monospace';
  octx.fillText(refineLog, 18, 52);
  octx.fillText('масштаб умовний — монокулярно він не спостережуваний', 18, 68);
}

/* ---------- експорт OBJ ---------- */
function exportOBJ(){
  const L = ['# DICH //EDGE scan', '# масштаб умовний (монокулярна реконструкція)'];
  for (let i = 0; i < SM.n; i++)
    L.push('v ' + SM.X[i*3].toFixed(5) + ' ' + (-SM.X[i*3+1]).toFixed(5) + ' ' + SM.X[i*3+2].toFixed(5));
  for (let e = 0; e < SM.m; e++)
    L.push('l ' + (SM.E[e*2]+1) + ' ' + (SM.E[e*2+1]+1));
  const blob = new Blob([L.join('\n')], { type:'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dich-scan-' + Date.now() + '.obj';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ============================================================
   ШАР F — ЩІЛЬНА ГЛИБИНА: ЗЛИТТЯ МЕРЕЖІ З SfM
   ============================================================
   Мережа віддає диспаритет з ДОВІЛЬНИМИ масштабом і зсувом:
   d ≈ a·(1/Z) + b, де a,b невідомі й свої на кожен кадр.
   Розріджені точки SfM знають істинні Z — з них ці два параметри
   дістаються МНК, і відносна карта стає метричною. Це і є місце,
   де дві гілки зшиваються.
   ============================================================ */

const SHOTMAX = 24;                 // скільки кадрів лишаємо під глибину
let shots = [];                     // { kf, url, w, h }
let lastShotC = null;
let dense = null;                   // { pos, col, n, frames:[{pos,col,tri,gw,gh}] }
let depthPipe = null, depthDev = '—';
let fuseLog = '';

function resetDense(){
  shots = []; lastShotC = null; dense = null; fuseLog = '';
}

/* ---------- запис кадрів ---------- */
/* Кадри беремо рідше за ключові: глибина рахується після СТОП і коштує
   сотні мілісекунд на штуку, тому 24 добре рознесених вистачає. */
let shotTick = 0;
function shotFrame(){
  if (!recOn || shots.length >= SHOTMAX) return;
  try { shotFrameInner(); } catch (e){ /* кадр не критичний — запис не зупиняємо */ }
}
function shotFrameInner(){
  /* Глибині з мережі ні гіроскоп, ні SfM не потрібні. Тому кадри пишемо
     завжди: якщо поза є — рознесено по руху, якщо нема — по часу. */
  shotTick++;
  if (scaleFixed && lastShotC){
    const d = Math.hypot(curC[0]-lastShotC[0], curC[1]-lastShotC[1], curC[2]-lastShotC[2]);
    if (d < 0.08) return;
  } else if (!scaleFixed){
    if (shotTick % 12 !== 0) return;
  }
  const k = scaleFixed ? kfN - 1 : -1;
  const TW = 384, TH = Math.round(TW * ph / pw);
  const c = document.createElement('canvas');
  c.width = TW; c.height = TH;
  const g = c.getContext('2d');
  if (facing === 'user'){ g.translate(TW, 0); g.scale(-1, 1); }
  const cv = cover(vid.videoWidth || 2, vid.videoHeight || 2, TW, TH);
  g.drawImage(vid, cv.sx, cv.sy, cv.sw, cv.sh, 0, 0, TW, TH);
  shots.push({ kf:k, url:c.toDataURL('image/jpeg', 0.86), w:TW, h:TH });
  if (scaleFixed) lastShotC = [curC[0], curC[1], curC[2]];
}

/* Проба з карти глибини. Округлення до пікселя тут не годиться:
   `|0` завжди відкидає вниз, тому при градієнті глибини проба
   систематично зміщена, і зсув переходить прямо в параметри прив'язки. */
function sampleBilinear(a, w, h, x, y){
  if (x < 0) x = 0; else if (x > w - 1.001) x = w - 1.001;
  if (y < 0) y = 0; else if (y > h - 1.001) y = h - 1.001;
  const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
  const k = y0 * w + x0;
  const a0 = a[k], a1 = a[k+1], a2 = a[k+w], a3 = a[k+w+1];
  return a0 + (a1-a0)*fx + (a2-a0)*fy + (a0-a1-a2+a3)*fx*fy;
}

/* ---------- прив'язка масштабу до розріджених точок ---------- */
/* Модель d = a/Z + b. Повертає {a,b,n,rms} або null. */
function fitScaleShift(depth, dw, dh, poseIdx){
  const q = [kfQ[poseIdx*4], kfQ[poseIdx*4+1], kfQ[poseIdx*4+2], kfQ[poseIdx*4+3]];
  const C = [kfC[poseIdx*3], kfC[poseIdx*3+1], kfC[poseIdx*3+2]];
  const iq = [-q[0], -q[1], -q[2], q[3]];
  const sx = dw / pw, sy = dh / ph;
  const X = [], Y = [];
  const w = [0,0,0], r = [0,0,0];
  for (let i = 0; i < SM.n; i++){
    w[0] = SM.X[i*3] - C[0]; w[1] = SM.X[i*3+1] - C[1]; w[2] = SM.X[i*3+2] - C[2];
    qRot(iq, w, r);
    if (r[2] <= 1e-4) continue;
    const u = (CAM.cx + CAM.fx * r[0] / r[2]) * sx;
    const v = (CAM.cy + CAM.fy * r[1] / r[2]) * sy;
    if (u < 1 || v < 1 || u >= dw - 1 || v >= dh - 1) continue;
    X.push(sampleBilinear(depth, dw, dh, u, v));
    Y.push(1 / r[2]);
  }
  const n0 = X.length;
  if (n0 < 8) return null;

  /* Стики ліній лежать на поверхнях предмета, тому по глибині вони
     збираються у ТІСНІ ЗГУСТКИ — ребра куба окремо, стіна окремо.
     Рівнозважений МНК іде за численнішим згустком і промахує повз
     другий: виміряно стале 0.96 на стіні проти 0.65 на кубі.
     Тому вагу дає не точка, а КОШИК діапазону — тоді пряма мусить
     пройти через обидва згустки. */
  const NB = 8;
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n0; i++){ const v = X[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  const span = hi - lo;
  const cnt = new Int32Array(NB), bin = new Int32Array(n0);
  for (let i = 0; i < n0; i++){
    let b = span > 1e-9 ? ((X[i]-lo)/span*NB)|0 : 0;
    if (b < 0) b = 0; else if (b >= NB) b = NB-1;
    bin[i] = b; cnt[b]++;
  }
  let filled = 0;
  for (let b = 0; b < NB; b++) if (cnt[b]) filled++;
  const wt = new Float64Array(n0);
  for (let i = 0; i < n0; i++) wt[i] = 1 / cnt[bin[i]];

  const solve = (keep) => {
    let sxx=0, sx1=0, s1=0, sxy=0, sy1=0, n=0;
    for (let i = 0; i < n0; i++){
      if (keep && !keep[i]) continue;
      const g = wt[i];
      sxx += g*X[i]*X[i]; sx1 += g*X[i]; s1 += g;
      sxy += g*X[i]*Y[i]; sy1 += g*Y[i]; n++;
    }
    const det = sxx*s1 - sx1*sx1;
    if (n < 6 || Math.abs(det) < 1e-14) return null;
    return { a:(sxy*s1 - sx1*sy1)/det, b:(sxx*sy1 - sx1*sxy)/det, n };
  };
  let f = solve(null);
  if (!f) return null;
  /* відсів: один промах серед розріджених точок перекошує обидва параметри */
  const res = X.map((x,i) => Math.abs(f.a*x + f.b - Y[i]));
  const srt = [...res].sort((p,q2) => p-q2);
  const cut = srt[Math.max(0, Math.min(srt.length-1, (srt.length*0.75)|0))];
  const keep = res.map(v => v <= cut);
  const f2 = solve(keep);
  if (f2) f = f2;
  if (!(f.a > 1e-9)) return null;
  /* Одна вузька смуга глибин не визначає прямої: нахил тримається
     лише на шумі. Краще відмовитись, ніж видати впевнене сміття. */
  if (filled < 2 || span < 1e-6) return null;
  let acc = 0, m = 0, wsum = 0;
  for (let i = 0; i < n0; i++){
    if (!keep[i]) continue;
    const e = f.a*X[i] + f.b - Y[i];
    acc += wt[i]*e*e; wsum += wt[i]; m++;
  }
  f.rms = wsum > 0 ? Math.sqrt(acc/wsum) : -1;
  f.bins = filled; f.span = span;
  return f;
}

/* ---------- один кадр: щільні точки у світі ---------- */
function densifyFrame(depth, dw, dh, rgb, poseIdx, fit, step, cut){
  const q = [kfQ[poseIdx*4], kfQ[poseIdx*4+1], kfQ[poseIdx*4+2], kfQ[poseIdx*4+3]];
  const C = [kfC[poseIdx*3], kfC[poseIdx*3+1], kfC[poseIdx*3+2]];
  const fx = CAM.fx * (dw / pw), fy = CAM.fy * (dh / ph);
  const cx = dw * 0.5, cy = dh * 0.5;
  const gw = Math.floor((dw - 1) / step) + 1;
  const gh = Math.floor((dh - 1) / step) + 1;
  const n = gw * gh;
  const pos = new Float32Array(n*3), col = new Float32Array(n*3), zs = new Float32Array(n);
  const cvec = [0,0,0], wvec = [0,0,0];
  let i = 0, good = 0;
  for (let gy = 0; gy < gh; gy++){
    const v = Math.min(dh-1, gy*step);
    for (let gx = 0; gx < gw; gx++, i++){
      const u = Math.min(dw-1, gx*step);
      const inv = fit.a * depth[v*dw + u] + fit.b;
      const Z = inv > 1e-6 ? 1/inv : -1;
      zs[i] = Z;
      if (Z <= 0){ pos[i*3+2] = NaN; continue; }
      cvec[0] = (u - cx) * Z / fx; cvec[1] = (v - cy) * Z / fy; cvec[2] = Z;
      qRot(q, cvec, wvec);
      pos[i*3] = wvec[0] + C[0]; pos[i*3+1] = wvec[1] + C[1]; pos[i*3+2] = wvec[2] + C[2];
      if (rgb){
        const o = (v*dw + u) * 4;
        col[i*3] = rgb[o]/255; col[i*3+1] = rgb[o+1]/255; col[i*3+2] = rgb[o+2]/255;
      } else { col[i*3]=0.42; col[i*3+1]=0.84; col[i*3+2]=0.51; }
      good++;
    }
  }
  /* грані: квад пропускаємо на розриві глибини, інакше на межах
     предметів тягнеться плівка від переднього плану до фону */
  const tri = [];
  for (let gy = 0; gy < gh-1; gy++)
    for (let gx = 0; gx < gw-1; gx++){
      const a = gy*gw+gx, b = a+1, c2 = a+gw, d = c2+1;
      const za=zs[a], zb=zs[b], zc=zs[c2], zd=zs[d];
      if (za<=0||zb<=0||zc<=0||zd<=0) continue;
      const mx = Math.max(za,zb,zc,zd), mn = Math.min(za,zb,zc,zd);
      if ((mx-mn)/mn > cut) continue;
      tri.push(a, c2, b, b, c2, d);
    }
  return { pos, col, tri:new Uint32Array(tri), gw, gh, count:n, good };
}

/* ---------- злиття у воксельну сітку ---------- */
function fuseFrames(frames, voxel){
  const map = new Map();
  for (const f of frames){
    for (let i = 0; i < f.count; i++){
      const x = f.pos[i*3], y = f.pos[i*3+1], z = f.pos[i*3+2];
      if (!isFinite(x) || !isFinite(z)) continue;
      const k = ((x/voxel)|0) + ',' + ((y/voxel)|0) + ',' + ((z/voxel)|0);
      let o = map.get(k);
      if (!o){ o = [0,0,0,0,0,0,0]; map.set(k, o); }
      o[0]+=x; o[1]+=y; o[2]+=z;
      o[3]+=f.col[i*3]; o[4]+=f.col[i*3+1]; o[5]+=f.col[i*3+2]; o[6]++;
    }
  }
  const n = map.size;
  const pos = new Float32Array(n*3), col = new Float32Array(n*3);
  let i = 0;
  map.forEach(o => {
    const c = o[6];
    pos[i*3]=o[0]/c; pos[i*3+1]=o[1]/c; pos[i*3+2]=o[2]/c;
    col[i*3]=o[3]/c; col[i*3+1]=o[4]/c; col[i*3+2]=o[5]/c;
    i++;
  });
  return { pos, col, n };
}

globalThis.__DENSE = { fitScaleShift, densifyFrame, fuseFrames };

/* Прив'язка без розріджених точок: масштаб невідомий, беремо умовний
   діапазон. Z = 1/(a·d + b) з нормалізацією d у 0..1 — та сама формула,
   тому далі все працює однаково. */
function fitFromRange(depth, range){
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < depth.length; i++){
    const v = depth[i];
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }
  const span = Math.max(1e-6, hi - lo);
  const k = 1 / Math.max(1.2, range);
  const a = (1 - k) / span;
  return { a, b: k - lo * a, n:0, rms:-1 };
}

/* ---------- модель глибини ---------- */
async function loadDepth(){
  if (depthPipe) return depthPipe;
  hint('Тягну модель глибини, перший раз ~50 МБ', true);
  const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
  env.allowLocalModels = false;
  let gpu = false;
  try { gpu = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch(e){}
  depthDev = gpu ? 'WebGPU' : 'WASM';
  const opts = { device: gpu ? 'webgpu' : 'wasm', dtype: gpu ? 'fp16' : 'q8' };
  try {
    depthPipe = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', opts);
  } catch (e){
    depthPipe = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-base', opts);
  }
  return depthPipe;
}

function depthOf(out){
  const pd = out.predicted_depth;
  if (pd && pd.data && pd.dims){
    const dm = pd.dims;
    return { d:Float32Array.from(pd.data), w:dm[dm.length-1], h:dm[dm.length-2] };
  }
  const r = out.depth;
  const ch = r.data.length / (r.width * r.height);
  const d = new Float32Array(r.width * r.height);
  for (let i = 0; i < d.length; i++) d[i] = r.data[i*ch];
  return { d, w:r.width, h:r.height };
}

/* Кожна стадія друкується на екран. Мовчазних відмов більше нема:
   якщо ланцюг рветься, видно де саме і з якими числами. */
const STG = [];
function stage(txt, cls, pct){
  STG.push('<span class="' + (cls||'') + '">' + txt + '</span>');
  const el = document.getElementById('plist');
  if (el) el.innerHTML = STG.join('<br>');
  document.getElementById('procp').classList.add('show');
  if (pct != null) document.getElementById('pfill').style.width = pct + '%';
  return new Promise(r => setTimeout(r, 16));
}
function stageReset(){ STG.length = 0;
  const el = document.getElementById('plist'); if (el) el.innerHTML = '';
  document.getElementById('pfill').style.width = '0';
}

/* ---------- головний прохід після СТОП ---------- */
async function densifyScan(haveSfM){
  if (!shots.length){ fuseLog = 'нема кадрів'; return false; }
  const solo = !haveSfM || !SM.n;
  await loadDepth();
  const maps = [], fits = [], idxs = [], rgbs = [];
  let rmsSum = 0;
  const tmp = document.createElement('canvas');
  const tctx = tmp.getContext('2d', { willReadFrequently:true });
  for (let s = 0; s < shots.length; s++){
    await stage('глибина ' + (s+1) + '/' + shots.length + '…', '', 34 + 50*(s+1)/shots.length);
    const sh = shots[s];
    let out;
    try { out = await depthPipe(sh.url); } catch (e){ continue; }
    const D = depthOf(out);
    let fit = null;
    if (!solo && sh.kf >= 0) fit = fitScaleShift(D.d, D.w, D.h, sh.kf);
    if (!fit) fit = fitFromRange(D.d, 6);        // без поз — умовний діапазон
    if (solo){                                   // один кадр: камера в початку
      kfQ[0]=0; kfQ[1]=0; kfQ[2]=0; kfQ[3]=1;
      kfC[0]=0; kfC[1]=0; kfC[2]=0;
      sh.kf = 0;
    }
    rmsSum += fit.rms;
    const img = new Image();
    await new Promise(r => { img.onload = r; img.onerror = r; img.src = sh.url; });
    tmp.width = D.w; tmp.height = D.h;
    tctx.drawImage(img, 0, 0, D.w, D.h);
    maps.push(D); fits.push(fit); idxs.push(sh.kf);
    rgbs.push(tctx.getImageData(0, 0, D.w, D.h).data);
  }
  if (!maps.length){ fuseLog = 'жоден кадр не дав глибини'; return false; }
  if (solo){                                     /* без поз злиття неможливе */
    const best = Math.min(maps.length - 1, maps.length >> 1);
    const f = densifyFrame(maps[best].d, maps[best].w, maps[best].h, rgbs[best],
                           0, fits[best], Math.round(P.dstep), P.dcut);
    dense = { frames:[f], pos:f.pos, col:f.col, n:f.count };
    SM.rad = 1;
    fuseLog = 'рельєф з одного кадру, ' + f.count + ' точок (масштаб умовний)';
    return true;
  }

  const step = Math.round(P.dstep), cut = P.dcut;
  const mk = () => maps.map((D, i) =>
    densifyFrame(D.d, D.w, D.h, rgbs[i], idxs[i], fits[i], step, cut));

  /* Масштаб глибини тепер уточнює ICP, а не повторна прив'язка: вона
     спиралась на ту саму позу і тягнула масштаб назад, тобто два методи
     воювали за одну величину. Кожен робить те, що справді спостерігає:
     SfM — зсув (нев'язка перепроєкції), ICP — поворот і масштаб. */
  let frames = mk();
  let icpLog = null;
  if (P.icp && frames.length > 1){
    await stage('суміщаю хмари (ICP)…', '', 88);
    icpLog = icpRefine(frames, idxs, SM.rad, { iters:14 });
    for (let i = 0; i < fits.length; i++){
      const sc = icpLog.scales[i] || 1;
      if (sc > 0.2 && sc < 5){ fits[i] = { a:fits[i].a/sc, b:fits[i].b/sc, n:fits[i].n, rms:fits[i].rms }; }
    }
    frames = mk();
  }

  const voxel = Math.max(1e-4, SM.rad * 0.012);
  const fused = fuseFrames(frames, voxel);
  dense = { frames, pos:fused.pos, col:fused.col, n:fused.n };
  fuseLog = `кадрів ${maps.length}/${shots.length}, точок ${fused.n}, ` +
            `прив\u2019язка ${(rmsSum/maps.length).toFixed(4)}` +
            (icpLog && icpLog.done ? `, ICP ${icpLog.rms0.toFixed(4)}→${icpLog.rms1.toFixed(4)} на ${icpLog.done} кадрах` : '');
  return true;
}

/* ============================================================
   ШАР H — ICP: УТОЧНЕННЯ ПОЗ ПО ЩІЛЬНИХ ХМАРАХ
   ============================================================
   Розріджена SfM по стиках ліній крихка: на реальній сцені пози
   розлітались. Маючи хмару на кожен кадр, їх можна уточнити прямим
   суміщенням поверхонь — це не залежить ні від паралакса, ні від
   того, чи впіймався кут.

   Точка-до-площини: для точки p і цільової точки q з нормаллю n
   нев'язка r = (p−q)·n. Лінеаризація R ≈ I + [δω]× дає
   r ≈ (p−q)·n + δω·(p×n) + t·n, тобто якобіан [p×n , n] — 6 чисел.
   Збігається за одиниці ітерацій там, де точка-до-точки повзе сотні.
   ============================================================ */

/* нормалі з регулярної сітки кадру — сусіди відомі, шукати нічого */
function frameNormals(f){
  const gw = f.gw, gh = f.gh, P3 = f.pos;
  const N = new Float32Array(f.count * 3);
  for (let y = 0; y < gh; y++){
    for (let x = 0; x < gw; x++){
      const i = y*gw + x;
      if (!isFinite(P3[i*3+2])) continue;
      const xa = x > 0 ? i-1 : i, xb = x < gw-1 ? i+1 : i;
      const ya = y > 0 ? i-gw : i, yb = y < gh-1 ? i+gw : i;
      if (!isFinite(P3[xa*3+2]) || !isFinite(P3[xb*3+2]) ||
          !isFinite(P3[ya*3+2]) || !isFinite(P3[yb*3+2])) continue;
      const ux = P3[xb*3]-P3[xa*3], uy = P3[xb*3+1]-P3[xa*3+1], uz = P3[xb*3+2]-P3[xa*3+2];
      const vx = P3[yb*3]-P3[ya*3], vy = P3[yb*3+1]-P3[ya*3+1], vz = P3[yb*3+2]-P3[ya*3+2];
      let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
      const L = Math.sqrt(nx*nx + ny*ny + nz*nz);
      if (L < 1e-12) continue;
      N[i*3] = nx/L; N[i*3+1] = ny/L; N[i*3+2] = nz/L;
    }
  }
  return N;
}

/* просторовий хеш опорної хмари */
function makeCloudHash(pos, count, cell){
  const map = new Map();
  const key = (a,b,c) => a + ',' + b + ',' + c;
  for (let i = 0; i < count; i++){
    const z = pos[i*3+2];
    if (!isFinite(z)) continue;
    const k = key(Math.floor(pos[i*3]/cell), Math.floor(pos[i*3+1]/cell), Math.floor(z/cell));
    let a = map.get(k);
    if (!a){ a = []; map.set(k, a); }
    a.push(i);
  }
  return { map, cell };
}
function nearestIn(hash, pos, x, y, z, maxD){
  const c = hash.cell;
  const bx = Math.floor(x/c), by = Math.floor(y/c), bz = Math.floor(z/c);
  let best = -1, bd = maxD*maxD;
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      for (let dz = -1; dz <= 1; dz++){
        const a = hash.map.get((bx+dx)+','+(by+dy)+','+(bz+dz));
        if (!a) continue;
        for (let n = 0; n < a.length; n++){
          const i = a[n];
          const ex = pos[i*3]-x, ey = pos[i*3+1]-y, ez = pos[i*3+2]-z;
          const d = ex*ex + ey*ey + ez*ez;
          if (d < bd){ bd = d; best = i; }
        }
      }
  return best;
}

/* Загальний Холецький для малих систем */
function cholN(A, b, x, n){
  const L = new Float64Array(n*n);
  for (let i = 0; i < n; i++)
    for (let j = 0; j <= i; j++){
      let s = A[i*n+j];
      for (let k = 0; k < j; k++) s -= L[i*n+k]*L[j*n+k];
      if (i === j){ if (s < 1e-14) return false; L[i*n+i] = Math.sqrt(s); }
      else L[i*n+j] = s / L[j*n+j];
    }
  const y = new Float64Array(n);
  for (let i = 0; i < n; i++){
    let s = b[i];
    for (let k = 0; k < i; k++) s -= L[i*n+k]*y[k];
    y[i] = s / L[i*n+i];
  }
  for (let i = n-1; i >= 0; i--){
    let s = y[i];
    for (let k = i+1; k < n; k++) s -= L[k*n+i]*x[k];
    x[i] = s / L[i*n+i];
  }
  return true;
}

/* Один крок. Чотири параметри: поворот навколо центру камери і
   масштаб глибини. Зсув НЕ чіпаємо — виміряно, що ICP його не бачить,
   а SfM бачить через нев'язку перепроєкції. Масштаб же навпаки:
   мережа віддає його довільним, і саме перекриття кадрів його ловить.
   Розтяг хмари від центру камери — це рівно зміна масштабу глибини. */
const icpH = new Float64Array(16), icpG = new Float64Array(4), icpX = new Float64Array(4);
function icpStep(src, srcN, refPos, refNrm, hash, maxD, minCos, prA, lam, wPrior, C){
  icpH.fill(0); icpG.fill(0);
  let pairs = 0, sse = 0;
  for (let i = 0; i < src.count; i++){
    const px = src.pos[i*3], py = src.pos[i*3+1], pz = src.pos[i*3+2];
    if (!isFinite(pz)) continue;
    const snx = srcN[i*3], sny = srcN[i*3+1], snz = srcN[i*3+2];
    if (snx === 0 && sny === 0 && snz === 0) continue;
    const j = nearestIn(hash, refPos, px, py, pz, maxD);
    if (j < 0) continue;
    const nx = refNrm[j*3], ny = refNrm[j*3+1], nz = refNrm[j*3+2];
    if (nx === 0 && ny === 0 && nz === 0) continue;
    if (Math.abs(snx*nx + sny*ny + snz*nz) < minCos) continue;
    const r = (px - refPos[j*3])*nx + (py - refPos[j*3+1])*ny + (pz - refPos[j*3+2])*nz;
    const qx = px - C[0], qy = py - C[1], qz = pz - C[2];
    /* J = [ q×n , q·n ] */
    const J0 = qy*nz - qz*ny, J1 = qz*nx - qx*nz, J2 = qx*ny - qy*nx;
    const J3 = qx*nx + qy*ny + qz*nz;
    const J = [J0, J1, J2, J3];
    const w = Math.abs(r) > maxD*0.3 ? (maxD*0.3)/Math.abs(r) : 1;
    for (let a = 0; a < 4; a++){
      icpG[a] -= w * J[a] * r;
      for (let b = 0; b <= a; b++) icpH[a*4+b] += w * J[a]*J[b];
    }
    sse += r*r; pairs++;
  }
  if (pairs < 40) return null;
  let dR = 0;
  for (let a = 0; a < 3; a++) dR += icpH[a*4+a];
  dR = Math.max(1e-12, dR/3);
  const dS = Math.max(1e-12, icpH[15]);
  for (let a = 0; a < 4; a++){
    const d = a < 3 ? dR : dS;
    icpH[a*4+a] += d * lam;
    if (wPrior > 0 && prA){
      const wp = d * wPrior;
      icpH[a*4+a] += wp;
      icpG[a] -= wp * prA[a];
    }
    for (let b = a+1; b < 4; b++) icpH[a*4+b] = icpH[b*4+a];
  }
  if (!cholN(icpH, icpG, icpX, 4)) return null;
  let m = 0; for (let a = 0; a < 4; a++) m += icpX[a]*icpX[a];
  if (!isFinite(m) || m > 1) return null;
  return { w:[icpX[0], icpX[1], icpX[2]], s:icpX[3], pairs, rms:Math.sqrt(sse/pairs) };
}

/* приріст → хмара, нормалі, поворот пози. Центр камери лишається за SfM. */
function applyDelta(f, N, d, poseIdx, C){
  const w = d.w, sc = 1 + d.s;
  const nq = Math.sqrt(1 + 0.25*(w[0]*w[0] + w[1]*w[1] + w[2]*w[2]));
  const dq = [w[0]*0.5/nq, w[1]*0.5/nq, w[2]*0.5/nq, 1/nq];
  const v = [0,0,0], o = [0,0,0];
  for (let i = 0; i < f.count; i++){
    if (!isFinite(f.pos[i*3+2])) continue;
    v[0]=f.pos[i*3]-C[0]; v[1]=f.pos[i*3+1]-C[1]; v[2]=f.pos[i*3+2]-C[2];
    qRot(dq, v, o);
    f.pos[i*3]=C[0]+o[0]*sc; f.pos[i*3+1]=C[1]+o[1]*sc; f.pos[i*3+2]=C[2]+o[2]*sc;
    v[0]=N[i*3]; v[1]=N[i*3+1]; v[2]=N[i*3+2];
    if (v[0]||v[1]||v[2]){ qRot(dq, v, o); N[i*3]=o[0]; N[i*3+1]=o[1]; N[i*3+2]=o[2]; }
  }
  if (poseIdx >= 0){
    const q = [kfQ[poseIdx*4], kfQ[poseIdx*4+1], kfQ[poseIdx*4+2], kfQ[poseIdx*4+3]];
    const nq2 = [0,0,0,1]; qMul(dq, q, nq2);
    const L = Math.hypot(nq2[0],nq2[1],nq2[2],nq2[3]) || 1;
    kfQ[poseIdx*4]=nq2[0]/L; kfQ[poseIdx*4+1]=nq2[1]/L;
    kfQ[poseIdx*4+2]=nq2[2]/L; kfQ[poseIdx*4+3]=nq2[3]/L;
  }
  return sc;
}

/* Кадр-до-моделі: кожен новий кадр суміщається з усім, що вже зшито.
   Кадр-до-кадру накопичував би дрейф уздовж ланцюжка. */
function icpRefine(frames, poseIdx, scale, opt){
  opt = opt || {};
  const iters = opt.iters || 12;
  if (opt.prior == null) opt.prior = 0.05;
  const log = { pairs:0, rms0:-1, rms1:-1, done:0, scales:frames.map(() => 1) };
  if (frames.length < 2) return log;

  const refP = [frames[0].pos], refN = [frameNormals(frames[0])], refC = [frames[0].count];

  for (let k = 1; k < frames.length; k++){
    const f = frames[k];
    const N = frameNormals(f);
    const pi = poseIdx ? poseIdx[k] : -1;
    const C = pi >= 0 ? [kfC[pi*3], kfC[pi*3+1], kfC[pi*3+2]] : [0,0,0];
    let tot = 0; for (const c of refC) tot += c;
    const cat = new Float32Array(tot*3), catN = new Float32Array(tot*3);
    let o = 0;
    for (let r = 0; r < refP.length; r++){
      cat.set(refP[r].subarray(0, refC[r]*3), o*3);
      catN.set(refN[r].subarray(0, refC[r]*3), o*3);
      o += refC[r];
    }
    let maxD = scale * 0.12, lam = 0.05, first = -1, last = -1, sAcc = 1;
    const hash = makeCloudHash(cat, tot, maxD);
    const acc = [0,0,0,0];
    for (let it = 0; it < iters; it++){
      const d = icpStep(f, N, cat, catN, hash, maxD, 0.6, acc, lam, opt.prior, C);
      if (!d) break;
      if (first < 0) first = d.rms;
      if (last >= 0 && d.rms > last * 1.02){ lam = Math.min(4, lam*3); continue; }
      lam = Math.max(0.01, lam*0.7);
      last = d.rms; log.pairs = d.pairs;
      sAcc *= applyDelta(f, N, d, pi, C);
      for (let a = 0; a < 3; a++) acc[a] += d.w[a];
      acc[3] += d.s;
      const step = Math.hypot(d.w[0], d.w[1], d.w[2]) + Math.abs(d.s);
      if (step < 1e-5) break;
      if (it === (iters >> 1)) maxD *= 0.6;
    }
    log.scales[k] = sAcc;
    if (first >= 0){ if (log.rms0 < 0) log.rms0 = first; log.rms1 = last; log.done++; }
    refP.push(f.pos); refN.push(N); refC.push(f.count);
  }
  return log;
}

globalThis.__ICP = { frameNormals, makeCloudHash, nearestIn, icpStep, applyDelta, icpRefine };

/* ============================================================
   ШАР G — ВЬЮПОРТ НА THREE.JS
   ============================================================
   Хмара на сотні тисяч точок 2D-полотном не малюється, тому
   тут WebGL. Two шари: щільний (мережа) і лінійний (SfM-каркас),
   вмикаються незалежно. Three тягнеться динамічно — до скану
   застосунок його не вантажить.
   ============================================================ */
let TH = null, ren3 = null, sc3 = null, cam3 = null, ctl3 = null;
let objPts = null, objMesh = null, objLine = null;
let dmode = 'mesh', lineOn = true;

async function loadThree(){
  if (TH) return TH;
  const three = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  const oc = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js');
  TH = { ...three, OrbitControls: oc.OrbitControls };
  return TH;
}

function ensureCanvas3(){
  let c = document.getElementById('gl3');
  if (!c){
    c = document.createElement('canvas');
    c.id = 'gl3';
    c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:7;display:none';
    document.getElementById('stage').appendChild(c);
  }
  return c;
}

async function openViewer(){
  const T = await loadThree();
  const c = ensureCanvas3();
  c.style.display = 'block';
  if (!ren3){
    ren3 = new T.WebGLRenderer({ canvas:c, antialias:true });
    ren3.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    sc3 = new T.Scene(); sc3.background = new T.Color(0x030906);
    cam3 = new T.PerspectiveCamera(55, 1, 0.01, 1000);
    ctl3 = new T.OrbitControls(cam3, c);
    ctl3.enableDamping = true; ctl3.dampingFactor = 0.08;
    sc3.add(new T.AmbientLight(0xffffff, 0.8));
    const dl = new T.DirectionalLight(0xDAFFC7, 1.0); dl.position.set(1,1,1); sc3.add(dl);
    (function loop(){ requestAnimationFrame(loop);
      if (ctl3 && c.style.display !== 'none'){ ctl3.update(); ren3.render(sc3, cam3); }
    })();
  }
  resize3();
  buildScene3();
}
function resize3(){
  if (!ren3) return;
  ren3.setSize(innerWidth, innerHeight, false);
  cam3.aspect = innerWidth / innerHeight; cam3.updateProjectionMatrix();
}
function closeViewer(){
  const c = document.getElementById('gl3');
  if (c) c.style.display = 'none';
}

function disposeObj(o){
  if (!o) return;
  sc3.remove(o);
  if (o.geometry) o.geometry.dispose();
  if (o.material) o.material.dispose();
}

function buildScene3(){
  const T = TH;
  disposeObj(objPts); disposeObj(objMesh); disposeObj(objLine);
  objPts = objMesh = objLine = null;

  /* щільний шар — злита хмара */
  if (dense && dense.n){
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(dense.pos, 3));
    g.setAttribute('color', new T.BufferAttribute(dense.col, 3));
    objPts = new T.Points(g, new T.PointsMaterial({ size:2.6, sizeAttenuation:false, vertexColors:true }));
    sc3.add(objPts);
  }
  /* щільний шар — поверхні по кадрах. Реконструкцію поверхні з хмари
     тут не робимо: кожен кадр уже має свою регулярну сітку, і покласти
     її у світ дешевше й чесніше, ніж вигадувати триангуляцію злитого. */
  if (dense && dense.frames && dense.frames.length){
    const grp = new T.Group();
    for (const f of dense.frames){
      if (!f.tri.length) continue;
      const g = new T.BufferGeometry();
      g.setAttribute('position', new T.BufferAttribute(f.pos, 3));
      g.setAttribute('color', new T.BufferAttribute(f.col, 3));
      g.setIndex(new T.BufferAttribute(f.tri, 1));
      g.computeVertexNormals();
      grp.add(new T.Mesh(g, new T.MeshLambertMaterial({ vertexColors:true, side:T.DoubleSide })));
    }
    objMesh = grp; sc3.add(grp);
  }
  /* лінійний шар — каркас SfM поверх */
  if (SM.n && SM.m){
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(SM.X, 3));
    g.setIndex(new T.BufferAttribute(SM.E, 1));
    objLine = new T.LineSegments(g, new T.LineBasicMaterial({
      color:0xDAFFC7, transparent:true, opacity:0.75 }));
    sc3.add(objLine);
  }
  applyMode3();

  /* кадрування */
  const box = new TH.Box3();
  if (objPts) box.expandByObject(objPts);
  else if (objLine) box.expandByObject(objLine);
  if (!box.isEmpty()){
    const ctr = box.getCenter(new TH.Vector3()), sz = box.getSize(new TH.Vector3());
    const r = Math.max(sz.x, sz.y, sz.z) || 1;
    ctl3.target.copy(ctr);
    cam3.position.set(ctr.x, ctr.y, ctr.z + r * 1.7);
    cam3.near = r/300; cam3.far = r*50; cam3.updateProjectionMatrix();
    ctl3.update();
  }
  const info = document.getElementById('vpinfo');
  if (info) info.textContent =
    (dense ? dense.n + ' ТОЧОК · ' : '') + SM.n + ' ВУЗЛІВ · ' + SM.m + ' РЕБЕР';
}

function applyMode3(){
  if (objPts) objPts.visible = dmode === 'points';
  if (objMesh) objMesh.visible = dmode === 'mesh';
  if (objLine) objLine.visible = lineOn;
}

function exportDenseOBJ(){
  const L = ['# DICH //EDGE dense scan', '# масштаб умовний'];
  if (dense && dense.n)
    for (let i = 0; i < dense.n; i++)
      L.push('v ' + dense.pos[i*3].toFixed(5) + ' ' + (-dense.pos[i*3+1]).toFixed(5) + ' ' + dense.pos[i*3+2].toFixed(5));
  const off = dense && dense.n ? dense.n : 0;
  for (let i = 0; i < SM.n; i++)
    L.push('v ' + SM.X[i*3].toFixed(5) + ' ' + (-SM.X[i*3+1]).toFixed(5) + ' ' + SM.X[i*3+2].toFixed(5));
  for (let e = 0; e < SM.m; e++)
    L.push('l ' + (off + SM.E[e*2] + 1) + ' ' + (off + SM.E[e*2+1] + 1));
  const blob = new Blob([L.join('\n')], { type:'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dich-scan-' + Date.now() + '.obj';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ============================================================
   СТАДІЇ КАДРУ
   ============================================================ */
function detectStage(){
  updFocus();
  normalize();
  if (P.preblur > 0){
    B.bl.set(B.normS);
    for (let i = 0; i < Math.round(P.preblur); i++) box3(B.bl, B.bl);
    scharr(B.bl);
  } else scharr(B.normS);
  suppress();
  hysteresis();
  traceContours();
}

function lockStage(){
  const tmp = pyrPrev; pyrPrev = pyrCur; pyrCur = tmp;
  buildPyr(pyrCur, B.gray);
  if (pyrReady){ pickPoints(); lkTrack(); fitSimilarity(); }
  else { pyrReady = true; }
  composeW();          // світ ← покадровий M
  maybeRebase();       // страховка від втрати точності Float32
  projectAll();
  edgeGeom();          // видимість + геометрія + хеш (лише видиме)
  associate();         // матчинг моделі з детекціями
  measureDrift();      // діагностика: чи модель ще збігається з реальністю
  applyMatches();      // EMA у кадрі → назад у світ
  rigidity();
  projectAll(); refreshMids();
  ageEdges();          // поза кадром памʼять не тане
  births();
  frameNo++;
  if (frameNo % 6 === 0){ weldPass(); recluster(); }
  depth();
  if (P.tri) pose3dStage();
  if (recOn){ recFrame(); shotFrame(); }
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
const dbgCan = document.createElement('canvas');
const dbgCtx = dbgCan.getContext('2d');
const dirBins = new Int32Array(16);
let lockStable = false;

function lerpCol(t){
  const r = Math.round(46  + (218 - 46)  * t);
  const g = Math.round(122 + (255 - 122) * t);
  const b = Math.round(78  + (199 - 78)  * t);
  return r + ',' + g + ',' + b;
}

function drawOverlay(){
  if (VP.on && scanReady){ drawViewport(); return; }
  const W = ovc.width, H = ovc.height;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, W, H);
  const sx = W / pw, sy = H / ph;

  if (P.dbg){
    if (dbgCan.width !== pw || dbgCan.height !== ph){ dbgCan.width = pw; dbgCan.height = ph; }
    const im = dbgCtx.createImageData(pw, ph);
    const d = im.data, e = B.edge;
    for (let i = 0, j = 0; i < B.n; i++, j += 4){
      const on = e[i] ? 255 : 0;
      d[j] = on ? 218 : 0; d[j + 1] = on; d[j + 2] = on ? 199 : 0; d[j + 3] = on ? 235 : 0;
    }
    dbgCtx.putImageData(im, 0, 0);
    octx.imageSmoothingEnabled = false;
    octx.drawImage(dbgCan, 0, 0, W, H);
      return;
  }

  octx.lineCap = 'round'; octx.lineJoin = 'round';

  if (!P.lock){
    octx.strokeStyle = 'rgba(218,255,199,.72)';
    octx.lineWidth = 1.4;
    octx.beginPath();
    for (let s = 0; s < SEG.cnt; s++){
      octx.moveTo(SEG.x0[s] * sx, SEG.y0[s] * sy);
      octx.lineTo(SEG.x1[s] * sx, SEG.y1[s] * sy);
    }
    octx.stroke();
      return;
  }

  /* --- 2. екструзія: обʼєм --- */
  const EX = P.extrude;
  if (EX > 0.5){
    octx.lineWidth = 1;
    octx.beginPath();
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e] || !EVis[e] || EConf[e] < 6) continue;
      const mx = EMx[e], my = EMy[e];
      let rx = mx - fcx, ry = my - fcy;
      const rl = Math.sqrt(rx * rx + ry * ry) || 1;
      rx /= rl; ry /= rl;
      const a = EA[e], b = EB[e];
      const dA = (dFinal[a] - 0.5) * EX, dB = (dFinal[b] - 0.5) * EX;
      octx.moveTo((PX[a] + rx * dA) * sx, (PY[a] + ry * dA) * sy);
      octx.lineTo((PX[b] + rx * dB) * sx, (PY[b] + ry * dB) * sy);
    }
    octx.strokeStyle = 'rgba(106,213,130,.14)';
    octx.stroke();

    octx.beginPath();
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e] || !EVis[e] || EConf[e] < 8) continue;
      const mx = EMx[e], my = EMy[e];
      let rx = mx - fcx, ry = my - fcy;
      const rl = Math.sqrt(rx * rx + ry * ry) || 1;
      rx /= rl; ry /= rl;
      const a = EA[e];
      const dA = (dFinal[a] - 0.5) * EX;
      octx.moveTo(PX[a] * sx, PY[a] * sy);
      octx.lineTo((PX[a] + rx * dA) * sx, (PY[a] + ry * dA) * sy);
    }
    octx.strokeStyle = 'rgba(106,213,130,.10)';
    octx.stroke();
  }

  /* --- 3. основні ребра. Пунктир = з памʼяті, детектор його зараз не бачить --- */
  for (let pass = 0; pass < 2; pass++){
    if (pass === 1) octx.setLineDash([4, 4]);
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e] || !EVis[e] || EConf[e] < 4) continue;
      const fromMem = EHit[e] ? 0 : 1;
      if (fromMem !== pass) continue;
      const a = EA[e], b = EB[e];
      const dm = (dFinal[a] + dFinal[b]) * 0.5;
      octx.lineWidth = 1.1 + 1.5 * (1 - dm);
      let al = 0.35 + 0.65 * (EConf[e] / 12);
      if (fromMem) al *= 0.55;
      octx.strokeStyle = 'rgba(' + lerpCol(dm) + ',' + al.toFixed(3) + ')';
      octx.beginPath();
      octx.moveTo(PX[a] * sx, PY[a] * sy);
      octx.lineTo(PX[b] * sx, PY[b] * sy);
      octx.stroke();
    }
    if (pass === 1) octx.setLineDash([]);
  }

  /* --- 4. вершини --- */
  if (P.verts){
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || VPin[v] < 2 || VConf[v] < 6) continue;
      const x = PX[v], y = PY[v];
      const d = dFinal[v];
      octx.fillStyle = 'rgba(218,255,199,' + (0.35 + 0.5 * d).toFixed(3) + ')';
      octx.beginPath();
      octx.arc(x * sx, y * sy, 2.0 + 1.2 * d, 0, 6.2832);
      octx.fill();
    }
  }

  if (P.tri && pts3d > 0) draw3d(sx, sy);
  if (P.boxes) drawBoxes(sx, sy);
  if (P.arrows && P.memory) drawMemoryArrows(W, H);
  if (P.ring) drawRing(sx, sy);

  if (P.flow){
    octx.lineWidth = 1;
    for (let i = 0; i < FLOW.cnt; i++){
      if (!FLOW.ok[i]) continue;
      octx.strokeStyle = FLOW.inl[i] ? 'rgba(106,213,130,.85)' : 'rgba(223,47,46,.7)';
      octx.beginPath();
      octx.moveTo(FLOW.x[i] * sx, FLOW.y[i] * sy);
      octx.lineTo((FLOW.x[i] + FLOW.u[i] * 3) * sx, (FLOW.y[i] + FLOW.v[i] * 3) * sy);
      octx.stroke();
    }
  }

}

/* 3D-каркас: ребра, обидва кінці яких тріангульовані.
   Колір і товщина за метричною глибиною, не за псевдо-пріором. */
const _p3a=[0,0,0], _p3b=[0,0,0];
function draw3d(sx, sy){
  let zMin = 1e9, zMax = -1e9;
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v] || TN[v] !== 2) continue;
    if (!project3(v, _p3a)) continue;
    if (_p3a[2] < zMin) zMin = _p3a[2];
    if (_p3a[2] > zMax) zMax = _p3a[2];
  }
  const span = Math.max(1e-3, zMax - zMin);
  octx.lineCap = 'round'; octx.lineJoin = 'round';
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EConf[e] < 5) continue;
    const a = EA[e], b = EB[e];
    if (TN[a] !== 2 || TN[b] !== 2) continue;
    if (!project3(a, _p3a) || !project3(b, _p3b)) continue;
    const t = 1 - (((_p3a[2] + _p3b[2]) * 0.5) - zMin) / span;   // ближче = 1
    octx.lineWidth = 1.2 + 1.8 * t;
    octx.strokeStyle = sealed
      ? 'rgba(255,193,60,' + (0.45 + 0.5 * t).toFixed(3) + ')'
      : 'rgba(' + lerpCol(t) + ',' + (0.45 + 0.5 * t).toFixed(3) + ')';
    octx.beginPath();
    octx.moveTo(_p3a[0] * sx, _p3a[1] * sy);
    octx.lineTo(_p3b[0] * sx, _p3b[1] * sy);
    octx.stroke();
  }
  if (P.verts){
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || TN[v] !== 2 || VPin[v] < 2) continue;
      if (!project3(v, _p3a)) continue;
      const t = 1 - (_p3a[2] - zMin) / span;
      octx.fillStyle = sealed ? 'rgba(255,193,60,.9)' : 'rgba(218,255,199,' + (0.4 + 0.5*t).toFixed(3) + ')';
      octx.beginPath();
      octx.arc(_p3a[0] * sx, _p3a[1] * sy, 2.0 + 1.4 * t, 0, 6.2832);
      octx.fill();
    }
  }
  if (sealed){
    octx.font = '700 11px ui-monospace,monospace';
    octx.fillStyle = 'rgba(255,193,60,.95)';
    octx.fillText('ЗАПЕЧАТАНО · ' + pts3d + ' ТОЧОК', 16, ovc.height - 96);
  }
}

/* Кільце вирізане з показу за замовчуванням — воно заважало бачити світ.
   Лишається тумблером, бо композиція кадру з ним читається інакше.
   Зони фокусу за ним більше немає: весь кадр рівноцінний, це чиста рамка. */
function drawRing(sx, sy){
  const cx = fcx*sx, cy = fcy*sy;
  const r = 0.34*Math.min(pw, ph)*((sx+sy)*0.5);
  octx.save();
  octx.setLineDash([5,7]); octx.lineWidth = 1;
  octx.strokeStyle = 'rgba(106,213,130,.18)';
  octx.beginPath(); octx.arc(cx, cy, r, 0, 6.2832); octx.stroke();
  octx.setLineDash([]); octx.lineWidth = 1.6;
  octx.strokeStyle = lockStable ? 'rgba(255,193,60,.9)' : 'rgba(255,193,60,.3)';
  for (let q = 0; q < 4; q++){
    const a0 = q*Math.PI/2 - 0.22, a1 = q*Math.PI/2 + 0.22;
    octx.beginPath(); octx.arc(cx, cy, r, a0, a1); octx.stroke();
  }
  if (lockStable){
    octx.font = '700 10px ui-monospace,monospace';
    octx.fillStyle = 'rgba(255,193,60,.95)';
    octx.fillText('ФІКС', cx - r + 4, cy + r + 16);
  }
  octx.restore();
}

/* Памʼять поза кадром: засічки на рамці в бік того, що там лежить.
   Довжина і яскравість — за кількістю ребер у тому напрямку. */
function drawMemoryArrows(W, H){
  dirBins.fill(0);
  let any = 0;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EVis[e] || EConf[e] < 5) continue;
    const ang = Math.atan2(EMy[e] - fcy, EMx[e] - fcx);
    let b = ((ang + Math.PI) / (2 * Math.PI) * 16) | 0;
    if (b < 0) b = 0; else if (b > 15) b = 15;
    dirBins[b]++; any++;
  }
  if (!any) return;
  let mx = 1;
  for (let i = 0; i < 16; i++) if (dirBins[i] > mx) mx = dirBins[i];
  const ccx = W * 0.5, ccy = H * 0.5;
  const inx = W * 0.5 - 20, iny = H * 0.5 - 20;
  octx.lineCap = 'butt';
  for (let i = 0; i < 16; i++){
    const n = dirBins[i];
    if (!n) continue;
    const ang = -Math.PI + (i + 0.5) / 16 * 2 * Math.PI;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const tx = Math.abs(dx) > 1e-4 ? inx / Math.abs(dx) : 1e9;
    const ty = Math.abs(dy) > 1e-4 ? iny / Math.abs(dy) : 1e9;
    const t = Math.min(tx, ty);
    const px = ccx + dx * t, py = ccy + dy * t;
    const f = n / mx;
    octx.strokeStyle = 'rgba(255,193,60,' + (0.22 + 0.55 * f).toFixed(3) + ')';
    octx.lineWidth = 2.4;
    octx.beginPath();
    octx.moveTo(px, py);
    octx.lineTo(px - dx * (9 + 24 * f), py - dy * (9 + 24 * f));
    octx.stroke();
  }
  octx.lineCap = 'round';
}

function drawBoxes(sx, sy){
  const box = new Map();
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || !EVis[e] || EConf[e] < 6) continue;
    const a = EA[e], b = EB[e];
    const cl = VCl[a];
    if (cl < 0) continue;
    let o = box.get(cl);
    if (!o){ o = { x0:1e9, y0:1e9, x1:-1e9, y1:-1e9, n:0 }; box.set(cl, o); }
    o.x0 = Math.min(o.x0, PX[a], PX[b]); o.y0 = Math.min(o.y0, PY[a], PY[b]);
    o.x1 = Math.max(o.x1, PX[a], PX[b]); o.y1 = Math.max(o.y1, PY[a], PY[b]);
    o.n++;
  }
  octx.lineWidth = 1;
  octx.font = '600 9px ui-monospace,monospace';
  box.forEach(o => {
    if (o.n < 5) return;
    const x = o.x0 * sx, y = o.y0 * sy;
    const w = (o.x1 - o.x0) * sx, h = (o.y1 - o.y0) * sy;
    if (w < 16 || h < 16) return;
    const t = Math.min(12, w * 0.25, h * 0.25);
    octx.strokeStyle = 'rgba(106,213,130,.38)';
    octx.beginPath();
    octx.moveTo(x, y + t); octx.lineTo(x, y); octx.lineTo(x + t, y);
    octx.moveTo(x + w - t, y); octx.lineTo(x + w, y); octx.lineTo(x + w, y + t);
    octx.moveTo(x + w, y + h - t); octx.lineTo(x + w, y + h); octx.lineTo(x + w - t, y + h);
    octx.moveTo(x + t, y + h); octx.lineTo(x, y + h); octx.lineTo(x, y + h - t);
    octx.stroke();
    octx.fillStyle = 'rgba(106,213,130,.6)';
    octx.fillText(o.n + ' РЕБ', x + 3, y - 4);
  });
}

let fpsT = 0, fpsN = 0, msEma = 0, degrade = 0, degradeT = 0;
const HINT = {
  off:   'Фіксація вирубана — сирі контури',
  seek:  'Шурупаю форму, погоди',
  hold:  'Зафіксував, тримаю',
  lost:  'Загубив кадр, шукаю заново',
  still: 'Стій — воду телефоном вбік, дай паралакс',
  slow:  'Тормозить, скидаю красоту',
  drift: 'Модель розʼїжджається з кадром',
  mem:   'Памʼятаю, водь далі по обʼєкту'
};
let lastHint = '';
function hint(t, amber){
  if (t === lastHint) return;
  lastHint = t;
  document.getElementById('lockline').innerHTML = amber ? '<em>' + t + '</em>' : t;
}

function render(){
  if (!running) return;
  const t0 = performance.now();

  /* база на GPU */
  if (vid.readyState >= 2 && gl){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, vid);
    const c = cover(vid.videoWidth || 2, vid.videoHeight || 2, glc.width, glc.height);
    gl.uniform2f(U.uTexel, 1 / Math.max(1, vid.videoWidth), 1 / Math.max(1, vid.videoHeight));
    gl.uniform2f(U.uScale, c.sw / Math.max(1, vid.videoWidth), c.sh / Math.max(1, vid.videoHeight));
    gl.uniform1f(U.uGain, P.gain);
    gl.uniform1f(U.uRadius, P.radius);
    gl.uniform1f(U.uLevels, Math.round(P.levels));
    gl.uniform1f(U.uShow, P.showBase ? 1 : 0);
    gl.uniform1f(U.uMirror, facing === 'user' ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /* CPU пайплайн */
  if (grabGray()){
    detectStage();
    if (P.lock) lockStage();
    drawOverlay();
  }

  /* HUD */
  const ms = performance.now() - t0;
  msEma = msEma ? msEma * 0.9 + ms * 0.1 : ms;
  fpsN++;
  const now = performance.now();
  if (now - fpsT > 500){
    document.getElementById('cFps').textContent = Math.round(fpsN * 1000 / (now - fpsT));
    fpsT = now; fpsN = 0;
    document.getElementById('cMs').textContent = msEma.toFixed(1);
    let cs = 0, cn = 0;
    for (let e = 0; e < eCnt; e++)
      if (EAlive[e] && EVis[e]){ cs += EConf[e]; cn++; }
    document.getElementById('cKf').textContent = memVis;
    document.getElementById('cMem').textContent = memTotal;
    document.getElementById('cDrift').textContent = driftRes.toFixed(1);
    document.getElementById('c3d').textContent = Math.round(depthConf * 100);
    document.getElementById('cP3').textContent = pts3d;
    document.getElementById('cPar').textContent = (parMax * 57.2958).toFixed(1);
    lockStable = cn > 20 && cs / cn > 8;

    if (!P.lock) hint(HINT.off, false);
    else if (degrade > 0) hint(HINT.slow, true);
    else if (gmeLost) hint(HINT.lost, true);
    else if (driftRes > 3.2) hint(HINT.drift, true);
    else if (!lockStable) hint(HINT.seek, false);
    else if (depthConf < 0.12) hint(HINT.still, true);
    else if (P.memory && memOff > 12) hint(HINT.mem, false);
    else hint(HINT.hold, false);

    /* адаптивна деградація */
    if (msEma > 26){
      degradeT++;
      if (degradeT >= 2 && degrade < 3){
        degrade++;
        if (degrade === 1) P.extrude = 0;
        if (degrade === 2) flowBudget = 60;
        if (degrade === 3){ P.res = Math.max(120, Math.round(P.res * 0.8)); resize(); syncRows(); }
        degradeT = 0;
      }
    } else if (msEma < 19){
      degradeT = 0;
    }
  }

  requestAnimationFrame(render);
}

function buildRows(){
  const box = { frame:document.getElementById('rowsFrame'),
                lock:document.getElementById('rowsLock'),
                scan:document.getElementById('rowsScan') };
  for (const k in box) box[k].innerHTML = '';
  ROWS.forEach(r => {
    if (!r.k) return;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<label>' + r.l + '</label><input type="range" min="' + r.min +
      '" max="' + r.max + '" step="' + r.st + '" data-k="' + r.k + '"><output></output>';
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.value = P[r.k]; out.textContent = fmt(P[r.k], r.st);
    inp.addEventListener('input', () => {
      P[r.k] = parseFloat(inp.value);
      out.textContent = fmt(P[r.k], r.st);
      if (r.k === 'res') resize();
      if (r.k === 'temporal') B.normSeeded = false;
    });
    (box[r.t] || box.frame).appendChild(row);
  });
}

function fmt(v, st){ return st < 1 ? v.toFixed(2) : String(Math.round(v)); }

let gyroOn = false, screenDeg = 0;
const GY = { evt:0, motion:0, last:0, hz:0, a:null, b:null, g:null, abs:false,
             rate:false, rx:0, ry:0, rz:0, perm:'не питали', permMotion:'не питали',
             jitter:0, jn:0, ja:0, jb:0, jg:0, err:null };

function readScreenDeg(){
  const o = (window.screen && screen.orientation && screen.orientation.angle);
  screenDeg = typeof o === 'number' ? o : (window.orientation || 0);
}
function onOrient(ev){
  if (ev.alpha === null && ev.beta === null) return;
  GY.evt++;
  const t = performance.now();
  if (GY.last) GY.hz = GY.hz * 0.9 + (1000 / Math.max(1, t - GY.last)) * 0.1;
  GY.last = t;
  GY.abs = !!ev.absolute;
  /* тремтіння орієнтації: воно прямо визначає, чи вийде реконструкція */
  if (GY.a !== null){
    const d = Math.abs(ev.alpha - GY.a) + Math.abs(ev.beta - GY.b) + Math.abs(ev.gamma - GY.g);
    if (d < 20){ GY.jitter = GY.jitter * 0.95 + d * 0.05; GY.jn++; }
  }
  GY.a = ev.alpha; GY.b = ev.beta; GY.g = ev.gamma;
  readScreenDeg();
  orientToQuat(ev.alpha, ev.beta, ev.gamma, screenDeg, curQ);
  if (poseMode === 'none') poseMode = 'imu';
}
function onMotion(ev){
  GY.motion++;
  const r = ev.rotationRate;
  if (r && (r.alpha !== null || r.beta !== null)){
    GY.rate = true;
    GY.rx = r.beta || 0; GY.ry = r.gamma || 0; GY.rz = r.alpha || 0;
  }
}
async function enableGyro(){
  GY.err = null;
  if (!window.isSecureContext){
    GY.err = 'не HTTPS — iOS не дасть дозвіл';
    return GY.err;
  }
  const DO = window.DeviceOrientationEvent, DM = window.DeviceMotionEvent;
  if (!DO){ GY.err = 'нема DeviceOrientationEvent'; return GY.err; }
  try {
    if (typeof DO.requestPermission === 'function'){
      GY.perm = await DO.requestPermission();
      if (GY.perm !== 'granted'){ GY.err = 'орієнтація: ' + GY.perm; return GY.err; }
    } else GY.perm = 'не потрібен';
  } catch (e){ GY.perm = 'помилка'; GY.err = 'дозвіл кинув помилку'; return GY.err; }
  try {
    if (DM && typeof DM.requestPermission === 'function')
      GY.permMotion = await DM.requestPermission();
    else if (DM) GY.permMotion = 'не потрібен';
  } catch (e){ GY.permMotion = 'помилка'; }

  /* absolute-варіант точніший там, де він є */
  window.addEventListener('deviceorientationabsolute', onOrient, true);
  window.addEventListener('deviceorientation', onOrient, true);
  if (DM) window.addEventListener('devicemotion', onMotion, true);
  gyroOn = true;
  setTimeout(() => { if (GY.evt === 0) GY.err = 'дозвіл є, але подій нема'; }, 1200);
  return null;
}

function diagText(){
  const L = [];
  const yn = (c, t) => '<span class="' + (c ? 'good' : 'bad') + '">' + t + '</span>';
  L.push('<h4>ПІДКЛЮЧЕННЯ</h4>');
  L.push('протокол: ' + yn(window.isSecureContext, location.protocol + ' ' +
        (window.isSecureContext ? 'захищений' : '— iOS вимагає HTTPS')));
  L.push('DeviceOrientation: ' + yn(!!window.DeviceOrientationEvent, window.DeviceOrientationEvent ? 'є' : 'нема'));
  L.push('дозвіл орієнтації: <b>' + GY.perm + '</b>');
  L.push('дозвіл руху: <b>' + GY.permMotion + '</b>');
  L.push('подій орієнтації: <b>' + GY.evt + '</b>' + (GY.evt ? ' (' + GY.hz.toFixed(0) + ' Гц)' : ''));
  L.push('подій руху: <b>' + GY.motion + '</b>');
  if (GY.err) L.push('<span class="bad">✕ ' + GY.err + '</span>');

  L.push('<h4>ГІРОСКОП</h4>');
  if (GY.a === null) L.push('<span class="bad">кутів нема</span>');
  else {
    L.push('α ' + GY.a.toFixed(1) + '  β ' + GY.b.toFixed(1) + '  γ ' + GY.g.toFixed(1) +
           '   екран ' + screenDeg + '°');
    L.push('absolute: ' + (GY.abs ? '<span class="good">так</span>' : '<span class="warn">ні</span>'));
    L.push('rotationRate: ' + (GY.rate ? '<span class="good">є</span>' : '<span class="warn">нема</span>'));
    const j = GY.jitter;
    const cls = j < 0.3 ? 'good' : (j < 0.8 ? 'warn' : 'bad');
    L.push('тремтіння: <span class="' + cls + '">' + j.toFixed(2) + '°</span>' +
           (j >= 0.5 ? ' — на 0.5° похибка точок росте вчетверо' : ''));
  }

  L.push('<h4>3D</h4>');
  L.push('режим пози: <b>' + poseMode + '</b>' + (P.tri ? '' : '  <span class="warn">(тумблер 3D вимкнений)</span>'));
  let conf = 0;
  for (let v = 0; v < vCnt; v++) if (VAlive[v] && VPin[v] >= 2 && VConf[v] >= 6) conf++;
  L.push('впевнених стиків: <b>' + conf + '</b> / треба 20 на опорний кадр');
  L.push('опорний кадр: ' + (bootPose >= 0 ? '<span class="good">є</span>' : '<span class="warn">чекає</span>'));
  L.push('паралакс: <b>' + (parMax * 57.2958).toFixed(2) + '°</b> / треба ' + P.parallax.toFixed(1) + '°');
  L.push('базис: ' + (scaleFixed ? '<span class="good">призначено</span>' : '<span class="warn">нема</span>'));
  L.push('3D-точок: <b>' + pts3d + '</b>' + (sealed ? '  <span class="warn">ЗАПЕЧАТАНО</span>' : ''));
  L.push('поле зору: ' + P.hfov + '°  (fx ' + CAM.fx.toFixed(0) + ' px)');

  L.push('<h4>ЗБІРКА</h4>');
  L.push('<b>' + BUILD + '</b>');

  L.push('<h4>СКАН</h4>');
  L.push('запис: ' + (recOn ? '<span class="good">іде</span>' : 'стоїть') +
         '   кадрів <b>' + kfN + '</b>   спостережень <b>' + obsN + '</b>');
  if (refineLog) L.push('<span class="good">' + refineLog + '</span>');

  L.push('<h4>ЩО РОБИТИ</h4>');
  if (!window.isSecureContext) L.push('<span class="bad">Відкрий через HTTPS — GitHub Pages підійде.</span>');
  else if (!gyroOn) L.push('Тисни ◎ ГІРО.');
  else if (GY.evt === 0) L.push('<span class="bad">Дозвіл є, подій нема — перезавантаж сторінку.</span>');
  else if (!P.tri) L.push('Увімкни тумблер 3D у шторці.');
  else if (conf < 20) L.push('Наведи на предмет з чіткими гранями — мало стиків.');
  else if (!scaleFixed) L.push('<span class="warn">Веди камеру ВБІК паралельно собі, не повертай.</span>');
  else L.push('<span class="good">Будую. Тап по кадру запечатує.</span>');
  return L.join('<br>');
}

ovc.addEventListener('click', () => {

              : 'Розпечатано, будую далі', sealed);

/* У новій оболонці модель — це вкладка, а не окремий екран.
   Тому перемикаємо вкладку замість того, щоб ховати пів інтерфейсу. */
function setRail(shown){
  if (shown) setTab('model');
  else if (curTab === 'model') setTab('frame');
  const inf = document.getElementById('vpinfo');
  if (inf) inf.textContent = shown
    ? ((dense && dense.n ? dense.n + ' точок · ' : '') + SM.n + ' вузлів · ' + SM.m + ' ребер')
    : 'модель ще не знята';
  setTab(curTab);
}
document.getElementById('bRec').addEventListener('click', e => {
  const el = e.currentTarget;
  if (!recOn){
    startRec(); el.classList.add('on'); el.textContent = '■ СТОП';
    hint(poseMode === 'none'
      ? 'Пишу без гіро — вийде рельєф з одного кадру'
      : 'Пишу. Обводь предмет, ведучи камеру вбік', poseMode === 'none');
  } else {
    recOn = false; el.classList.remove('on'); el.textContent = '● ЗАПИС';
    runPipeline();
  }
});

/* Драбина: спускаємось рівнями, доки щось не вийде. Найкрихкіша ланка
   (завантаження SfM) більше нічого не блокує — без неї працює одиночний
   кадр, який мережі цілком достатньо. */
async function runPipeline(){
  stageReset();
  await stage('кадрів знято: <b>' + shots.length + '</b>', shots.length ? 'ok' : 'no', 5);
  if (!shots.length){
    await stage('Кадрів нема. Тисни ЗАПИС і веди камеру кілька секунд.', 'no', 100);
    return;
  }

  /* рівень 1 — розріджена SfM */
  let haveSfM = false;
  if (scaleFixed && kfN >= 4 && obsN >= 60){
    await stage('уточнюю пози: ' + kfN + ' кадрів, ' + obsN + ' спостережень', '', 12);
    haveSfM = refineScan(12);
    await stage(haveSfM ? 'пози готові — ' + refineLog : 'уточнення не зійшлось',
                haveSfM ? 'ok' : 'wt', 22);
  } else {
    await stage('SfM не завантажилась (' + kfN + ' кадрів, ' + obsN +
                ' спостережень) — іду без поз', 'wt', 22);
  }

  /* рівень 2 — глибина з мережі */
  let ok2 = false;
  try {
    await stage('вантажу мережу глибини…', '', 28);
    await loadDepth();
    await stage('мережа готова, прискорення <b>' + depthDev + '</b>', 'ok', 34);
    ok2 = await densifyScan(haveSfM);
  } catch (e){
    await stage('мережа впала: ' + (e && e.message ? e.message : e), 'no', 100);
  }
  if (ok2) await stage('щільна модель: ' + fuseLog, 'ok', 92);
  else await stage('щільне не вийшло: ' + (fuseLog || 'причина невідома'), 'no', 92);

  /* рівень 3 — показати хоч що-небудь */
  const haveDense = !!(dense && dense.n);
  const haveWire  = !!(SM.n && SM.m);
  if (!haveDense && !haveWire){
    await stage('Показувати нема чого. Спробуй ближче до предмета з чіткими гранями.', 'no', 100);
    return;
  }
  await stage('відкриваю вьюпорт: ' + (haveDense ? dense.n + ' точок' : 'лише каркас'), 'ok', 100);
  try {
    VP.on = true; setRail(true);
    await openViewer();
    setTimeout(() => document.getElementById('procp').classList.remove('show'), 1200);
  } catch (e){
    await stage('вьюпорт не піднявся: ' + (e && e.message ? e.message : e), 'no', 100);
  }
}

/* орбіта і зум пальцем */
const ptrs = new Map();
let lastPinch = 0;
ovc.addEventListener('pointerdown', ev => { if (VP.on) ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]); });
ovc.addEventListener('pointerup', ev => { ptrs.delete(ev.pointerId); lastPinch = 0; });
ovc.addEventListener('pointercancel', ev => { ptrs.delete(ev.pointerId); lastPinch = 0; });
ovc.addEventListener('pointermove', ev => {
  if (!VP.on || !ptrs.has(ev.pointerId)) return;
  const prev = ptrs.get(ev.pointerId);
  ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (ptrs.size === 1){
    VP.az -= (ev.clientX - prev[0]) * 0.008;
    VP.el += (ev.clientY - prev[1]) * 0.008;
    VP.el = Math.max(-1.45, Math.min(1.45, VP.el));
  } else if (ptrs.size === 2){
    const a = [...ptrs.values()];
    const d = Math.hypot(a[0][0]-a[1][0], a[0][1]-a[1][1]);
    if (lastPinch) VP.dist = Math.max(1.1, Math.min(14, VP.dist * lastPinch / Math.max(1, d)));
    lastPinch = d;
  }
  ev.preventDefault();
});

document.getElementById('bShot').addEventListener('click', () => {
  const c = document.createElement('canvas');
  c.width = glc.width; c.height = glc.height;
  const x = c.getContext('2d');
  x.drawImage(glc, 0, 0); x.drawImage(ovc, 0, 0);
  c.toBlob(bl => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(bl);
    a.download = 'dich-edge-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});

});
