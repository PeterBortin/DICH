<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0B0C11"/>
<title>DICH · SPACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0B0C11;--txt:#F1F3F8;--dim:#8b91a1;--lime:#D2FF3E;--cyan:#3EE0D0;--card:rgba(20,22,30,.82);--bd:rgba(255,255,255,.10)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);
  font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.28;transition:opacity .3s}
#video.off{opacity:0}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
#start{position:fixed;inset:0;z-index:9;background:radial-gradient(140% 100% at 50% 0%,#12151d,var(--bg) 60%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center}
h1{font-family:'Space Grotesk';font-weight:700;font-size:clamp(38px,12vw,66px);letter-spacing:-.02em}
h1 span{color:var(--lime)}
.sub{font-size:12px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase}
.desc{font-size:13px;color:var(--dim);max-width:320px;line-height:1.8}
#go{background:var(--lime);color:#0B0C11;border:none;border-radius:14px;padding:15px 46px;font-size:15px;font-weight:600;font-family:'Space Grotesk'}
#err{color:#FF5C6C;font-size:12px;min-height:16px;max-width:320px}
#hud{position:fixed;top:0;left:0;right:0;z-index:3;display:none;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;pointer-events:none}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:10px;color:var(--dim);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:999px;background:var(--dim)}
.dot.on{background:var(--lime);box-shadow:0 0 6px var(--lime)}
.dot.load{background:var(--cyan);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:.2}}
#name{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--txt)}
#name b{color:var(--lime);font-weight:700}
#ctl{position:fixed;left:0;right:0;bottom:0;z-index:3;display:none;gap:8px;justify-content:center;flex-wrap:wrap;
  padding:12px 14px calc(env(safe-area-inset-bottom) + 14px)}
.btn{background:var(--card);border:1px solid var(--bd);color:var(--txt);border-radius:999px;padding:11px 18px;font-size:12px;backdrop-filter:blur(8px)}
.btn.on{background:var(--lime);border-color:var(--lime);color:#0B0C11}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:3;text-align:center;
  font-size:11px;color:var(--dim);display:none;pointer-events:none;transition:opacity .5s}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="gl"></canvas>

<div id="hud">
  <div class="pill" id="p-name"><span id="name">DICH <b>SPACE</b></span></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <div class="pill"><span class="dot" id="d-model"></span><span id="t-model">модель…</span></div>
    <div class="pill"><span class="dot on"></span><span id="t-fps">-- FPS</span></div>
  </div>
</div>

<div id="hint">проведи пальцем — обертай простір</div>

<div id="ctl">
  <button class="btn on" id="b-video">Відео</button>
  <button class="btn on" id="b-mesh">Сітка</button>
  <button class="btn" id="b-points">Точки</button>
  <button class="btn" id="b-reset">Скинути вид</button>
</div>

<div id="start">
  <h1>DICH<span>·</span>SPACE</h1>
  <div class="sub">простір у 3D</div>
  <div class="desc">Камера бачить глибину сцени й будує з неї обʼємну сітку. Усе рахується <b style="color:var(--lime)">на пристрої</b>.</div>
  <button id="go">УВІМКНУТИ</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   DICH · SPACE — одна задача: бачити простір як 3D-сітку.
   Камера → Depth Anything V2 Small (у воркері) → 3D-меш.
   Нічого зайвого: без детекції обʼєктів, OCR, голосу, правил.
   ═══════════════════════════════════════════════════════════ */

const $=id=>document.getElementById(id);
const video=$('video'), glc=$('gl');

/* ── бюджет геометрії: фіксована кількість вершин ── */
const VERT_BUDGET=9000;
let GW=0, GH=0;
const FOV=62;                    // вертикальний кут огляду (приблизно як у телефона)
const ZNEAR=1.2, ZRANGE=7.0;     // умовний діапазон глибини сцени

let renderer,scene,cam,lines,points,geoL,geoP;
let posArr=null,colArr=null,idxArr=null;
let zTarget=null,zCur=null;      // згладжування глибини
let haveDepth=false;

/* ── орбіта (палець) ── */
const view={yaw:0,pitch:0,tYaw:0,tPitch:0,drift:0,drag:false,px:0,py:0};

/* ── камера пристрою ── */
let stream=null,facing='environment';
async function startCam(){
  stream=await navigator.mediaDevices.getUserMedia({audio:false,
    video:{facingMode:facing,width:{ideal:960},height:{ideal:720}}});
  video.srcObject=stream; await video.play();
}

/* ── розміри сітки під співвідношення екрана ── */
function calcGrid(){
  const r=Math.max(0.4,Math.min(3,innerHeight/innerWidth));
  GW=Math.max(28,Math.round(Math.sqrt(VERT_BUDGET/r)));
  GH=Math.max(28,Math.round(GW*r));
}

/* ── побудова геометрії ── */
function buildScene(){
  calcGrid();
  renderer=new THREE.WebGLRenderer({canvas:glc,antialias:false,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
  renderer.setSize(innerWidth,innerHeight,false);
  scene=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(FOV,innerWidth/innerHeight,0.1,100);

  const N=GW*GH;
  posArr=new Float32Array(N*3);
  colArr=new Float32Array(N*3);
  zTarget=new Float32Array(N).fill(ZNEAR+ZRANGE*0.6);
  zCur=new Float32Array(N).fill(ZNEAR+ZRANGE*0.6);
  idxArr=new Uint32Array(N*4);

  geoL=new THREE.BufferGeometry();
  geoL.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geoL.setAttribute('color',new THREE.BufferAttribute(colArr,3));
  geoL.setIndex(new THREE.BufferAttribute(idxArr,1));
  geoL.setDrawRange(0,0);
  lines=new THREE.LineSegments(geoL,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.72}));
  scene.add(lines);

  geoP=new THREE.BufferGeometry();
  geoP.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geoP.setAttribute('color',new THREE.BufferAttribute(colArr,3));
  points=new THREE.Points(geoP,new THREE.PointsMaterial({size:.028,vertexColors:true,transparent:true,opacity:.9}));
  points.visible=false;
  scene.add(points);

  addEventListener('resize',onResize);
  onResize();
}
function onResize(){
  if(!renderer)return;
  renderer.setSize(innerWidth,innerHeight,false);
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
}

/* ── розгортка глибини у 3D (пінхол-модель) ── */
function unproject(){
  const tan=Math.tan(FOV*Math.PI/360), aspect=innerWidth/innerHeight;
  for(let y=0,i=0;y<GH;y++){
    const v=y/(GH-1), sy=(0.5-v)*2*tan;
    for(let x=0;x<GW;x++,i++){
      const u=x/(GW-1), z=zCur[i];
      posArr[i*3]  =(u-0.5)*2*tan*aspect*z;
      posArr[i*3+1]=sy*z;
      posArr[i*3+2]=-z;
      // колір: ближче — лайм, далі — бірюза
      const t=Math.min(1,Math.max(0,(z-ZNEAR)/ZRANGE));
      colArr[i*3]  =0.82*(1-t)+0.24*t;
      colArr[i*3+1]=1.00*(1-t)+0.88*t;
      colArr[i*3+2]=0.24*(1-t)+0.82*t;
    }
  }
  // ребра, крім розривів глибини (щоб не тягнулося «павутиння»)
  const BREAK=ZRANGE*0.085; let k=0;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const i=y*GW+x;
    if(x<GW-1&&Math.abs(zCur[i]-zCur[i+1])<BREAK){ idxArr[k++]=i; idxArr[k++]=i+1; }
    if(y<GH-1&&Math.abs(zCur[i]-zCur[i+GW])<BREAK){ idxArr[k++]=i; idxArr[k++]=i+GW; }
  }
  geoL.setDrawRange(0,k);
  geoL.index.needsUpdate=true;
  geoL.attributes.position.needsUpdate=true;
  geoL.attributes.color.needsUpdate=true;
  geoP.attributes.position.needsUpdate=true;
  geoP.attributes.color.needsUpdate=true;
  geoL.computeBoundingSphere();
}

/* ── воркер глибини ── */
const WSRC=`
let est=null,RI=null;
self.onmessage=async e=>{const m=e.data;
 if(m.type==='init'){
  let last='';
  for(const url of m.urls){
   try{ const TF=await import(url); TF.env.allowLocalModels=false; RI=TF.RawImage;
    let dev='wasm',dt='q8';
    if(m.gpu){ try{ est=await TF.pipeline('depth-estimation',m.model,{device:'webgpu',dtype:'fp16'}); dev='webgpu'; }catch(_){ est=null; } }
    if(!est) est=await TF.pipeline('depth-estimation',m.model,{device:'wasm',dtype:'q8'});
    try{ const ip=est.processor.image_processor; ip.size={width:m.side,height:m.side}; }catch(_){}
    postMessage({type:'ready',dev}); return;
   }catch(err){ last=String(err); }
  }
  postMessage({type:'error',msg:last||'runtime'});
 } else if(m.type==='frame'&&est){
  try{ const img=new RI(new Uint8ClampedArray(m.buf),m.w,m.h,4);
   const o=await est(img), d=o.depth, b=d.data.buffer.slice(0);
   postMessage({type:'depth',buf:b,w:d.width,h:d.height},[b]);
  }catch(err){ postMessage({type:'error',msg:String(err)}); }
 }};`;

const DEPTH=(()=>{
  let w=null,ready=false,busy=false,last=0,inC=null,inX=null,IN_W=192,PERIOD=380;
  function setState(txt,cls){ $('t-model').textContent=txt; const d=$('d-model'); d.className='dot '+(cls||''); }
  function init(){
    const gpu=!!navigator.gpu;
    if(!gpu) PERIOD=1400;                       // без WebGPU рахуємо значно рідше
    setState('модель…','load');
    const url=URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'}));
    try{ w=new Worker(url,{type:'module'}); }
    catch(e){ setState('немає воркера',''); return; }
    w.onmessage=e=>{
      const m=e.data;
      if(m.type==='ready'){ ready=true; setState(m.dev==='webgpu'?'GPU':'CPU','on'); }
      else if(m.type==='depth'){ busy=false; ingest(new Uint8ClampedArray(m.buf),m.w,m.h); }
      else if(m.type==='error'){ busy=false; if(!ready) setState('недоступно',''); }
    };
    w.onerror=()=>{ if(!ready) setState('помилка',''); };
    w.postMessage({type:'init',model:'onnx-community/depth-anything-v2-small',gpu,side:gpu?252:154,
      urls:['https://cdn.jsdelivr.net/npm/@huggingface/transformers@3',
            'https://cdn.jsdelivr.net/npm/@huggingface/transformers',
            'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2']});
  }
  // кадр беремо саме той шматок відео, який видно на екрані (cover-crop)
  function send(now){
    if(!ready||busy||!video.videoWidth||now-last<PERIOD) return;
    last=now; busy=true;
    const vw=video.videoWidth,vh=video.videoHeight,ar=innerWidth/innerHeight;
    let sw=vw,sh=vw/ar; if(sh>vh){ sh=vh; sw=vh*ar; }
    const sx=(vw-sw)/2, sy=(vh-sh)/2;
    const W=IN_W,H=Math.max(16,Math.round(IN_W/ar));
    if(!inC){ inC=document.createElement('canvas'); inX=inC.getContext('2d',{willReadFrequently:true}); }
    if(inC.width!==W||inC.height!==H){ inC.width=W; inC.height=H; }
    try{
      inX.save();
      if(facing==='user'){ inX.translate(W,0); inX.scale(-1,1); }
      inX.drawImage(video,sx,sy,sw,sh,0,0,W,H);
      inX.restore();
      const buf=inX.getImageData(0,0,W,H).data.buffer.slice(0);
      w.postMessage({type:'frame',buf,w:W,h:H},[buf]);
    }catch(e){ busy=false; }
  }
  function ingest(data,dw,dh){
    let mn=255,mx=0;
    for(let i=0;i<data.length;i++){ const v=data[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
    const rng=(mx-mn)||1;
    for(let y=0;y<GH;y++){
      const sy=Math.min(dh-1,Math.round(y*dh/GH));
      for(let x=0;x<GW;x++){
        const sx=Math.min(dw-1,Math.round(x*dw/GW));
        const d=(data[sy*dw+sx]-mn)/rng;          // 1 = ближче
        zTarget[y*GW+x]=ZNEAR+(1-d)*ZRANGE;
      }
    }
    haveDepth=true;
  }
  return {init,send};
})();

/* ── орбіта пальцем ── */
function bindOrbit(){
  const el=glc;
  el.addEventListener('pointerdown',e=>{ view.drag=true; view.px=e.clientX; view.py=e.clientY;
    el.setPointerCapture&&el.setPointerCapture(e.pointerId); $('hint').style.opacity='0'; });
  el.addEventListener('pointermove',e=>{ if(!view.drag)return;
    view.tYaw   += (e.clientX-view.px)*0.0026;
    view.tPitch += (e.clientY-view.py)*0.0020;
    view.tYaw=Math.max(-0.7,Math.min(0.7,view.tYaw));
    view.tPitch=Math.max(-0.5,Math.min(0.5,view.tPitch));
    view.px=e.clientX; view.py=e.clientY; });
  const up=()=>{view.drag=false;};
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
}

/* ── головний цикл ── */
let fpsN=0,fpsT=0;
function loop(now){
  requestAnimationFrame(loop);
  DEPTH.send(now);

  // плавне наближення глибини + легкий автодрейф камери
  if(haveDepth){ for(let i=0;i<zCur.length;i++) zCur[i]+=(zTarget[i]-zCur[i])*0.16; unproject(); }
  view.drift+=0.0016;
  view.yaw  +=((view.tYaw  +Math.sin(view.drift)*0.05)-view.yaw)*0.08;
  view.pitch+=((view.tPitch+Math.cos(view.drift*0.7)*0.03)-view.pitch)*0.08;

  // камера обертається навколо центру сцени, дивлячись на неї
  const R=ZNEAR+ZRANGE*0.45;
  cam.position.set(Math.sin(view.yaw)*R, -Math.sin(view.pitch)*R, R-Math.cos(view.yaw)*R*0.55);
  cam.lookAt(0,0,-R);
  renderer.render(scene,cam);

  fpsN++; if(now-fpsT>1000){ $('t-fps').textContent=fpsN+' FPS'; fpsN=0; fpsT=now; }
}

/* ── кнопки ── */
$('b-video').onclick=e=>{ video.classList.toggle('off'); e.target.classList.toggle('on'); };
$('b-mesh').onclick=e=>{ lines.visible=!lines.visible; e.target.classList.toggle('on'); };
$('b-points').onclick=e=>{ points.visible=!points.visible; e.target.classList.toggle('on'); };
$('b-reset').onclick=()=>{ view.tYaw=0; view.tPitch=0; };

/* ── старт ── */
$('go').onclick=async()=>{
  $('go').disabled=true; $('err').textContent='';
  try{ await startCam(); }
  catch(e){ $('err').textContent='Камера недоступна: '+(e.message||e.name); $('go').disabled=false; return; }
  $('start').style.display='none';
  $('hud').style.display='flex'; $('ctl').style.display='flex'; $('hint').style.display='block';
  setTimeout(()=>{ $('hint').style.opacity='0'; },6000);
  buildScene(); bindOrbit(); DEPTH.init();
  fpsT=performance.now(); requestAnimationFrame(loop);
};
</script>
</body>
</html>
