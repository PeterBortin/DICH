    octx.stroke();
  }

  /* --- 2. екструзія: обʼєм --- */
  const EX = P.extrude;
  if (EX > 0.5){
    octx.lineWidth = 1;
    octx.beginPath();
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e] || !EVis[e] || EConf[e] < 6) continue;
      const mx = EMx[e], my = EMy[e];
      if (!inFocus(mx, my)) continue;
      let rx = mx - fcx, ry = my - fcy;
      const rl = Math.sqrt(rx * rx + ry * ry) || 1;
      rx /= rl; ry /= rl;
      const a = EA[e], b = EB[e];
      const dA = (dFinal[a] - 0.5) * EX, dB = (dFinal[b] - 0.5) * EX;
      octx.moveTo((PX[a] + rx * dA) * sx, (PY[a] + ry * dA) * sy);
      octx.lineTo((PX[b] + rx * dB) * sx, (PY[b] + ry * dB) * sy);
    }
    octx.strokeStyle = 'rgba(106,213,130,.14)';
    octx.stroke();

    octx.beginPath();
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e] || !EVis[e] || EConf[e] < 8) continue;
      const mx = EMx[e], my = EMy[e];
      if (!inFocus(mx, my)) continue;
      let rx = mx - fcx, ry = my - fcy;
      const rl = Math.sqrt(rx * rx + ry * ry) || 1;
      rx /= rl; ry /= rl;
      const a = EA[e];
      const dA = (dFinal[a] - 0.5) * EX;
      octx.moveTo(PX[a] * sx, PY[a] * sy);
      octx.lineTo((PX[a] + rx * dA) * sx, (PY[a] + ry * dA) * sy);
    }
    octx.strokeStyle = 'rgba(106,213,130,.10)';
    octx.stroke();
  }

  /* --- 3. основні ребра. Пунктир = з памʼяті, детектор його зараз не бачить --- */
  for (let pass = 0; pass < 2; pass++){
    if (pass === 1) octx.setLineDash([4, 4]);
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e] || !EVis[e] || EConf[e] < 4) continue;
      if (!inFocus(EMx[e], EMy[e])) continue;
      const fromMem = EHit[e] ? 0 : 1;
      if (fromMem !== pass) continue;
      const a = EA[e], b = EB[e];
      const dm = (dFinal[a] + dFinal[b]) * 0.5;
      octx.lineWidth = 1.1 + 1.5 * (1 - dm);
      let al = 0.35 + 0.65 * (EConf[e] / 12);
      if (fromMem) al *= 0.55;
      octx.strokeStyle = 'rgba(' + lerpCol(dm) + ',' + al.toFixed(3) + ')';
      octx.beginPath();
      octx.moveTo(PX[a] * sx, PY[a] * sy);
      octx.lineTo(PX[b] * sx, PY[b] * sy);
      octx.stroke();
    }
    if (pass === 1) octx.setLineDash([]);
  }

  /* --- 4. вершини --- */
  if (P.verts){
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || VPin[v] < 2 || VConf[v] < 6) continue;
      const x = PX[v], y = PY[v];
      if (!inFocus(x, y)) continue;
      const d = dFinal[v];
      octx.fillStyle = 'rgba(218,255,199,' + (0.35 + 0.5 * d).toFixed(3) + ')';
      octx.beginPath();
      octx.arc(x * sx, y * sy, 2.0 + 1.2 * d, 0, 6.2832);
      octx.fill();
    }
  }

  if (P.tri && pts3d > 0) draw3d(sx, sy);
  if (P.boxes) drawBoxes(sx, sy);
  if (P.arrows && P.memory) drawMemoryArrows(W, H);

  if (P.flow){
    octx.lineWidth = 1;
    for (let i = 0; i < FLOW.cnt; i++){
      if (!FLOW.ok[i]) continue;
      octx.strokeStyle = FLOW.inl[i] ? 'rgba(106,213,130,.85)' : 'rgba(223,47,46,.7)';
      octx.beginPath();
      octx.moveTo(FLOW.x[i] * sx, FLOW.y[i] * sy);
      octx.lineTo((FLOW.x[i] + FLOW.u[i] * 3) * sx, (FLOW.y[i] + FLOW.v[i] * 3) * sy);
      octx.stroke();
    }
  }

  drawFocusRing(sx, sy);
}

/* 3D-каркас: ребра, обидва кінці яких тріангульовані.
   Колір і товщина за метричною глибиною, не за псевдо-пріором. */
const _p3a=[0,0,0], _p3b=[0,0,0];
function draw3d(sx, sy){
  let zMin = 1e9, zMax = -1e9;
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v] || TN[v] !== 2) continue;
    if (!project3(v, _p3a)) continue;
    if (_p3a[2] < zMin) zMin = _p3a[2];
    if (_p3a[2] > zMax) zMax = _p3a[2];
  }
  const span = Math.max(1e-3, zMax - zMin);
  octx.lineCap = 'round'; octx.lineJoin = 'round';
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EConf[e] < 5) continue;
    const a = EA[e], b = EB[e];
    if (TN[a] !== 2 || TN[b] !== 2) continue;
    if (!project3(a, _p3a) || !project3(b, _p3b)) continue;
    const t = 1 - (((_p3a[2] + _p3b[2]) * 0.5) - zMin) / span;   // ближче = 1
    octx.lineWidth = 1.2 + 1.8 * t;
    octx.strokeStyle = sealed
      ? 'rgba(255,193,60,' + (0.45 + 0.5 * t).toFixed(3) + ')'
      : 'rgba(' + lerpCol(t) + ',' + (0.45 + 0.5 * t).toFixed(3) + ')';
    octx.beginPath();
    octx.moveTo(_p3a[0] * sx, _p3a[1] * sy);
    octx.lineTo(_p3b[0] * sx, _p3b[1] * sy);
    octx.stroke();
  }
  if (P.verts){
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || TN[v] !== 2 || VPin[v] < 2) continue;
      if (!project3(v, _p3a)) continue;
      const t = 1 - (_p3a[2] - zMin) / span;
      octx.fillStyle = sealed ? 'rgba(255,193,60,.9)' : 'rgba(218,255,199,' + (0.4 + 0.5*t).toFixed(3) + ')';
      octx.beginPath();
      octx.arc(_p3a[0] * sx, _p3a[1] * sy, 2.0 + 1.4 * t, 0, 6.2832);
      octx.fill();
    }
  }
  if (sealed){
    octx.font = '700 11px ui-monospace,monospace';
    octx.fillStyle = 'rgba(255,193,60,.95)';
    octx.fillText('ЗАПЕЧАТАНО · ' + pts3d + ' ТОЧОК', 16, ovc.height - 96);
  }
}

/* Памʼять поза кадром: засічки на рамці в бік того, що там лежить.
   Довжина і яскравість — за кількістю ребер у тому напрямку. */
function drawMemoryArrows(W, H){
  dirBins.fill(0);
  let any = 0;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EVis[e] || EConf[e] < 5) continue;
    const ang = Math.atan2(EMy[e] - fcy, EMx[e] - fcx);
    let b = ((ang + Math.PI) / (2 * Math.PI) * 16) | 0;
    if (b < 0) b = 0; else if (b > 15) b = 15;
    dirBins[b]++; any++;
  }
  if (!any) return;
  let mx = 1;
  for (let i = 0; i < 16; i++) if (dirBins[i] > mx) mx = dirBins[i];
  const ccx = W * 0.5, ccy = H * 0.5;
  const inx = W * 0.5 - 20, iny = H * 0.5 - 20;
  octx.lineCap = 'butt';
  for (let i = 0; i < 16; i++){
    const n = dirBins[i];
    if (!n) continue;
    const ang = -Math.PI + (i + 0.5) / 16 * 2 * Math.PI;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const tx = Math.abs(dx) > 1e-4 ? inx / Math.abs(dx) : 1e9;
    const ty = Math.abs(dy) > 1e-4 ? iny / Math.abs(dy) : 1e9;
    const t = Math.min(tx, ty);
    const px = ccx + dx * t, py = ccy + dy * t;
    const f = n / mx;
    octx.strokeStyle = 'rgba(255,193,60,' + (0.22 + 0.55 * f).toFixed(3) + ')';
    octx.lineWidth = 2.4;
    octx.beginPath();
    octx.moveTo(px, py);
    octx.lineTo(px - dx * (9 + 24 * f), py - dy * (9 + 24 * f));
    octx.stroke();
  }
  octx.lineCap = 'round';
}

function drawBoxes(sx, sy){
  const box = new Map();
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || !EVis[e] || EConf[e] < 6) continue;
    const a = EA[e], b = EB[e];
    const cl = VCl[a];
    if (cl < 0) continue;
    let o = box.get(cl);
    if (!o){ o = { x0:1e9, y0:1e9, x1:-1e9, y1:-1e9, n:0 }; box.set(cl, o); }
    o.x0 = Math.min(o.x0, PX[a], PX[b]); o.y0 = Math.min(o.y0, PY[a], PY[b]);
    o.x1 = Math.max(o.x1, PX[a], PX[b]); o.y1 = Math.max(o.y1, PY[a], PY[b]);
    o.n++;
  }
  octx.lineWidth = 1;
  octx.font = '600 9px ui-monospace,monospace';
  box.forEach(o => {
    if (o.n < 5) return;
    const x = o.x0 * sx, y = o.y0 * sy;
    const w = (o.x1 - o.x0) * sx, h = (o.y1 - o.y0) * sy;
    if (w < 16 || h < 16) return;
    const t = Math.min(12, w * 0.25, h * 0.25);
    octx.strokeStyle = 'rgba(106,213,130,.38)';
    octx.beginPath();
    octx.moveTo(x, y + t); octx.lineTo(x, y); octx.lineTo(x + t, y);
    octx.moveTo(x + w - t, y); octx.lineTo(x + w, y); octx.lineTo(x + w, y + t);
    octx.moveTo(x + w, y + h - t); octx.lineTo(x + w, y + h); octx.lineTo(x + w - t, y + h);
    octx.moveTo(x + t, y + h); octx.lineTo(x, y + h); octx.lineTo(x, y + h - t);
    octx.stroke();
    octx.fillStyle = 'rgba(106,213,130,.6)';
    octx.fillText(o.n + ' РЕБ', x + 3, y - 4);
  });
}

function drawFocusRing(sx, sy){
  const cx = fcx * sx, cy = fcy * sy, r = fr * ((sx + sy) * 0.5);
  octx.save();
  octx.setLineDash([5, 7]);
  octx.lineWidth = 1;
  octx.strokeStyle = 'rgba(106,213,130,.18)';
  octx.beginPath(); octx.arc(cx, cy, r, 0, 6.2832); octx.stroke();
  octx.setLineDash([]);
  octx.lineWidth = 1.6;
  octx.strokeStyle = lockStable ? 'rgba(255,193,60,.92)' : 'rgba(255,193,60,.32)';
  for (let q = 0; q < 4; q++){
    const a0 = q * Math.PI / 2 - 0.22, a1 = q * Math.PI / 2 + 0.22;
    octx.beginPath(); octx.arc(cx, cy, r, a0, a1); octx.stroke();
  }
  if (lockStable && P.lock){
    octx.font = '700 10px ui-monospace,monospace';
    octx.fillStyle = 'rgba(255,193,60,.95)';
    octx.fillText('ФІКС', cx - r + r * 0.04, cy + r + 16);
  }
  octx.restore();
}

/* ============================================================
   ЦИКЛ
   ============================================================ */
let fpsT = 0, fpsN = 0, msEma = 0, degrade = 0, degradeT = 0;
const HINT = {
  off:   'Фіксація вирубана — сирі контури',
  seek:  'Шурупаю форму, погоди',
  hold:  'Зафіксував, тримаю',
  lost:  'Загубив кадр, шукаю заново',
  still: 'Стій — воду телефоном вбік, дай паралакс',
  slow:  'Тормозить, скидаю красоту',
  drift: 'Модель розʼїжджається з кадром',
  mem:   'Памʼятаю, водь далі по обʼєкту'
};
let lastHint = '';
function hint(t, amber){
  if (t === lastHint) return;
  lastHint = t;
  document.getElementById('lockline').innerHTML = amber ? '<em>' + t + '</em>' : t;
}

function render(){
  if (!running) return;
  const t0 = performance.now();

  /* база на GPU */
  if (vid.readyState >= 2 && gl){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, vid);
    const c = cover(vid.videoWidth || 2, vid.videoHeight || 2, glc.width, glc.height);
    gl.uniform2f(U.uTexel, 1 / Math.max(1, vid.videoWidth), 1 / Math.max(1, vid.videoHeight));
    gl.uniform2f(U.uScale, c.sw / Math.max(1, vid.videoWidth), c.sh / Math.max(1, vid.videoHeight));
    gl.uniform1f(U.uGain, P.gain);
    gl.uniform1f(U.uRadius, P.radius);
    gl.uniform1f(U.uLevels, Math.round(P.levels));
    gl.uniform1f(U.uShow, P.showBase ? 1 : 0);
    gl.uniform1f(U.uMirror, facing === 'user' ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /* CPU пайплайн */
  if (grabGray()){
    detectStage();
    if (P.lock) lockStage();
    drawOverlay();
  }

  /* HUD */
  const ms = performance.now() - t0;
  msEma = msEma ? msEma * 0.9 + ms * 0.1 : ms;
  fpsN++;
  const now = performance.now();
  if (now - fpsT > 500){
    document.getElementById('cFps').textContent = Math.round(fpsN * 1000 / (now - fpsT));
    fpsT = now; fpsN = 0;
    document.getElementById('cMs').textContent = msEma.toFixed(1);
    let cs = 0, cn = 0;
    for (let e = 0; e < eCnt; e++)
      if (EAlive[e] && EVis[e] && inFocus(EMx[e], EMy[e])){ cs += EConf[e]; cn++; }
    document.getElementById('cKf').textContent = memVis;
    document.getElementById('cMem').textContent = memTotal;
    document.getElementById('cDrift').textContent = driftRes.toFixed(1);
    document.getElementById('c3d').textContent = Math.round(depthConf * 100);
    document.getElementById('cP3').textContent = pts3d;
    document.getElementById('cPar').textContent = (parMax * 57.2958).toFixed(1);
    lockStable = cn > 20 && cs / cn > 8;

    if (!P.lock) hint(HINT.off, false);
    else if (degrade > 0) hint(HINT.slow, true);
    else if (gmeLost) hint(HINT.lost, true);
    else if (driftRes > 3.2) hint(HINT.drift, true);
    else if (!lockStable) hint(HINT.seek, false);
    else if (depthConf < 0.12) hint(HINT.still, true);
    else if (P.memory && memOff > 12) hint(HINT.mem, false);
    else hint(HINT.hold, false);

    /* адаптивна деградація */
    if (msEma > 26){
      degradeT++;
      if (degradeT >= 2 && degrade < 3){
        degrade++;
        if (degrade === 1) P.extrude = 0;
        if (degrade === 2) flowBudget = 60;
        if (degrade === 3){ P.res = Math.max(120, Math.round(P.res * 0.8)); resize(); syncRows(); }
        degradeT = 0;
      }
    } else if (msEma < 19){
      degradeT = 0;
    }
  }

  requestAnimationFrame(render);
}

function buildRows(){
  const box = document.getElementById('rows');

  ROWS.forEach(r => {

    row.innerHTML = '<label>' + r.l + '</label>' +
      '<input type="range" min="' + r.min + '" max="' + r.max + '" step="' + r.st + '" data-k="' + r.k + '">' +
      '<output></output>';
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.value = P[r.k];
    out.textContent = fmt(P[r.k], r.st);
    inp.addEventListener('input', () => {

      if (r.k === 'res') resize();
      if (r.k === 'temporal') B.normSeeded = false;
    });
    box.appendChild(row);

}

let gyroOn = false, screenDeg = 0;
const GY = { evt:0, motion:0, last:0, hz:0, a:null, b:null, g:null, abs:false,
             rate:false, rx:0, ry:0, rz:0, perm:'не питали', permMotion:'не питали',
             jitter:0, jn:0, ja:0, jb:0, jg:0, err:null };

function readScreenDeg(){
  const o = (window.screen && screen.orientation && screen.orientation.angle);
  screenDeg = typeof o === 'number' ? o : (window.orientation || 0);
}
function onOrient(ev){
  if (ev.alpha === null && ev.beta === null) return;
  GY.evt++;
  const t = performance.now();
  if (GY.last) GY.hz = GY.hz * 0.9 + (1000 / Math.max(1, t - GY.last)) * 0.1;
  GY.last = t;
  GY.abs = !!ev.absolute;
  /* тремтіння орієнтації: воно прямо визначає, чи вийде реконструкція */
  if (GY.a !== null){
    const d = Math.abs(ev.alpha - GY.a) + Math.abs(ev.beta - GY.b) + Math.abs(ev.gamma - GY.g);
    if (d < 20){ GY.jitter = GY.jitter * 0.95 + d * 0.05; GY.jn++; }
  }
  GY.a = ev.alpha; GY.b = ev.beta; GY.g = ev.gamma;
  readScreenDeg();
  orientToQuat(ev.alpha, ev.beta, ev.gamma, screenDeg, curQ);
  if (poseMode === 'none') poseMode = 'imu';
}
function onMotion(ev){
  GY.motion++;
  const r = ev.rotationRate;
  if (r && (r.alpha !== null || r.beta !== null)){
    GY.rate = true;
    GY.rx = r.beta || 0; GY.ry = r.gamma || 0; GY.rz = r.alpha || 0;
  }
}
async function enableGyro(){
  GY.err = null;
  if (!window.isSecureContext){
    GY.err = 'не HTTPS — iOS не дасть дозвіл';
    return GY.err;
  }
  const DO = window.DeviceOrientationEvent, DM = window.DeviceMotionEvent;
  if (!DO){ GY.err = 'нема DeviceOrientationEvent'; return GY.err; }
  try {
    if (typeof DO.requestPermission === 'function'){
      GY.perm = await DO.requestPermission();
      if (GY.perm !== 'granted'){ GY.err = 'орієнтація: ' + GY.perm; return GY.err; }
    } else GY.perm = 'не потрібен';
  } catch (e){ GY.perm = 'помилка'; GY.err = 'дозвіл кинув помилку'; return GY.err; }
  try {
    if (DM && typeof DM.requestPermission === 'function')
      GY.permMotion = await DM.requestPermission();
    else if (DM) GY.permMotion = 'не потрібен';
  } catch (e){ GY.permMotion = 'помилка'; }

  /* absolute-варіант точніший там, де він є */
  window.addEventListener('deviceorientationabsolute', onOrient, true);
  window.addEventListener('deviceorientation', onOrient, true);
  if (DM) window.addEventListener('devicemotion', onMotion, true);
  gyroOn = true;
  setTimeout(() => { if (GY.evt === 0) GY.err = 'дозвіл є, але подій нема'; }, 1200);
  return null;
}

function diagText(){
  const L = [];
  const yn = (c, t) => '<span class="' + (c ? 'good' : 'bad') + '">' + t + '</span>';
  L.push('<h4>ПІДКЛЮЧЕННЯ</h4>');
  L.push('протокол: ' + yn(window.isSecureContext, location.protocol + ' ' +
        (window.isSecureContext ? 'захищений' : '— iOS вимагає HTTPS')));
  L.push('DeviceOrientation: ' + yn(!!window.DeviceOrientationEvent, window.DeviceOrientationEvent ? 'є' : 'нема'));
  L.push('дозвіл орієнтації: <b>' + GY.perm + '</b>');
  L.push('дозвіл руху: <b>' + GY.permMotion + '</b>');
  L.push('подій орієнтації: <b>' + GY.evt + '</b>' + (GY.evt ? ' (' + GY.hz.toFixed(0) + ' Гц)' : ''));
  L.push('подій руху: <b>' + GY.motion + '</b>');
  if (GY.err) L.push('<span class="bad">✕ ' + GY.err + '</span>');

  L.push('<h4>ГІРОСКОП</h4>');
  if (GY.a === null) L.push('<span class="bad">кутів нема</span>');
  else {
    L.push('α ' + GY.a.toFixed(1) + '  β ' + GY.b.toFixed(1) + '  γ ' + GY.g.toFixed(1) +
           '   екран ' + screenDeg + '°');
    L.push('absolute: ' + (GY.abs ? '<span class="good">так</span>' : '<span class="warn">ні</span>'));
    L.push('rotationRate: ' + (GY.rate ? '<span class="good">є</span>' : '<span class="warn">нема</span>'));
    const j = GY.jitter;
    const cls = j < 0.3 ? 'good' : (j < 0.8 ? 'warn' : 'bad');
    L.push('тремтіння: <span class="' + cls + '">' + j.toFixed(2) + '°</span>' +
           (j >= 0.5 ? ' — на 0.5° похибка точок росте вчетверо' : ''));
  }

  L.push('<h4>3D</h4>');
  L.push('режим пози: <b>' + poseMode + '</b>' + (P.tri ? '' : '  <span class="warn">(тумблер 3D вимкнений)</span>'));
  let conf = 0;
  for (let v = 0; v < vCnt; v++) if (VAlive[v] && VPin[v] >= 2 && VConf[v] >= 6) conf++;
  L.push('впевнених стиків: <b>' + conf + '</b> / треба 20 на опорний кадр');
  L.push('опорний кадр: ' + (bootPose >= 0 ? '<span class="good">є</span>' : '<span class="warn">чекає</span>'));
  L.push('паралакс: <b>' + (parMax * 57.2958).toFixed(2) + '°</b> / треба ' + P.parallax.toFixed(1) + '°');
  L.push('базис: ' + (scaleFixed ? '<span class="good">призначено</span>' : '<span class="warn">нема</span>'));
  L.push('3D-точок: <b>' + pts3d + '</b>' + (sealed ? '  <span class="warn">ЗАПЕЧАТАНО</span>' : ''));
  L.push('поле зору: ' + P.hfov + '°  (fx ' + CAM.fx.toFixed(0) + ' px)');

  L.push('<h4>ЩО РОБИТИ</h4>');
  if (!window.isSecureContext) L.push('<span class="bad">Відкрий через HTTPS — GitHub Pages підійде.</span>');
  else if (!gyroOn) L.push('Тисни ◎ ГІРО.');
  else if (GY.evt === 0) L.push('<span class="bad">Дозвіл є, подій нема — перезавантаж сторінку.</span>');
  else if (!P.tri) L.push('Увімкни тумблер 3D у шторці.');
  else if (conf < 20) L.push('Наведи на предмет з чіткими гранями — мало стиків.');
  else if (!scaleFixed) L.push('<span class="warn">Веди камеру ВБІК паралельно собі, не повертай.</span>');
  else L.push('<span class="good">Будую. Тап по кадру запечатує.</span>');
  return L.join('<br>');
}

/* тап по кадру — запечатати / розпечатати модель */
ovc.addEventListener('click', () => {
  if (!P.tri) return;
  if (!sealed && pts3d < 12){ hint('Мало 3D-точок, води ще', true); return; }
  sealed = !sealed;
  hint(sealed ? 'Запечатано. Обходь — воно лишається на місці'
              : 'Розпечатано, будую далі', sealed);
});

document.getElementById('bForget').addEventListener('click', e => {
  resetTracks();
  const el = e.currentTarget;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 220);
});

document.getElementById('bBase').addEventListener('click', e => {
  P.showBase = P.showBase ? 0 : 1;
  e.currentTarget.classList.toggle('on', !!P.showBase);
});
document.getElementById('bBox').addEventListener('click', e => {
  P.boxes = !P.boxes;
  e.currentTarget.classList.toggle('on', P.boxes);
});
document.getElementById('bCam').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCam(); resetTracks(); } catch (err){ console.warn(err); }
});
document.getElementById('bShot').addEventListener('click', () => {
  const c = document.createElement('canvas');
  c.width = glc.width; c.height = glc.height;
  const x = c.getContext('2d');
  x.drawImage(glc, 0, 0); x.drawImage(ovc, 0, 0);
  c.toBlob(bl => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(bl);
    a.download = 'dich-edge-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});

addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(resize, 140); });
addEventListener('orientationchange', () => setTimeout(resize, 300));

document.getElementById('go').addEventListener('click', async () => {
  const errEl = document.getElementById('err');
  errEl.textContent = 'Камеру шукаю, погоди…';
  try {
    initGL();
    await startCam();
    resize();
    buildRows();
    document.getElementById('boot').classList.add('hide');
    running = true; fpsT = performance.now();
    render();
  } catch (err){
    errEl.textContent = 'Не пішло: ' + (err && err.message ? err.message : err) +
      ' — потрібен HTTPS (або localhost) і дозвіл на камеру.';
  }
});
</script>
</body>
