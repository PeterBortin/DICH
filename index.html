<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B08">
<title>DICH //LIDAR</title>
<style>
:root{
  --accent:#6AD582; --hot:#DAFFC7; --deep:#00311E; --panel:#0d3b25;
  --amber:#FFC13C; --red:#DF2F2E; --bg:#050B08; --ink:#8FA99A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --pad:14px; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--accent);
  font-family:var(--mono);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:var(--mono);border:0;background:0 0;color:inherit}

/* ---------- каркас: сітка, що адаптується ---------- */
#app{position:fixed;inset:0;display:grid;
  grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left)}
#view{position:relative;overflow:hidden}
#view canvas,#view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam{z-index:1}
#dep{z-index:2;image-rendering:auto;opacity:.85}
#gl3{z-index:3;display:none}
#hud{position:absolute;inset:0;z-index:4;pointer-events:none}

/* ---------- верхня смуга стану ---------- */
#bar{display:flex;align-items:center;gap:8px;padding:10px var(--pad) 8px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--hot)}
.brand s{text-decoration:none;color:var(--accent);font-weight:400;font-size:11px;letter-spacing:.2em}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.035);
  border:1px solid rgba(106,213,130,.16);border-radius:99px;padding:4px 9px;
  font-size:9.5px;letter-spacing:.09em;color:var(--ink);white-space:nowrap}
.pill b{color:var(--hot);font-weight:700}
.pill.warn{border-color:rgba(255,193,60,.4)} .pill.warn b{color:var(--amber)}
.pill.bad{border-color:rgba(223,47,46,.45)} .pill.bad b{color:var(--red)}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
#bar .grow{margin-left:auto}

/* ---------- нижній док ---------- */
#dock{padding:0 var(--pad) calc(var(--pad) + 2px)}
#tabs{display:flex;gap:6px;padding:8px 0 10px}
.tab{flex:1;padding:9px 0;border-radius:99px;font-size:10.5px;letter-spacing:.13em;
  color:var(--ink);background:rgba(255,255,255,.03);border:1px solid rgba(106,213,130,.14)}
.tab[aria-selected=true]{color:var(--hot);background:rgba(0,49,30,.72);
  border-color:rgba(106,213,130,.5)}
#panel{min-height:0}
.grp{display:none} .grp.on{display:block}
.row{display:grid;grid-template-columns:82px 1fr 44px;align-items:center;gap:10px;padding:5px 0}
.row label{font-size:10px;letter-spacing:.1em;color:var(--ink)}
.row output{font-size:10.5px;color:var(--hot);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:0 0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(106,213,130,.24)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  margin-top:-7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(106,213,130,.55)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 8px}
.chip{padding:8px 12px;border-radius:99px;font-size:9.5px;letter-spacing:.1em;color:var(--ink);
  background:rgba(255,255,255,.03);border:1px solid rgba(106,213,130,.16)}
.chip[aria-pressed=true]{color:var(--hot);background:rgba(0,49,30,.7);border-color:rgba(106,213,130,.5)}

#act{display:flex;align-items:center;gap:12px;padding-top:4px}
#shoot{flex:1;height:56px;border-radius:99px;background:var(--accent);color:#03150c;
  font-size:13px;font-weight:700;letter-spacing:.14em;box-shadow:0 0 26px rgba(106,213,130,.3)}
#shoot.rec{background:var(--red);color:#fff;box-shadow:0 0 26px rgba(223,47,46,.4)}
#shoot:disabled{opacity:.45;box-shadow:none}
.mini{width:56px;height:56px;border-radius:99px;background:rgba(255,255,255,.04);
  border:1px solid rgba(106,213,130,.2);font-size:16px;color:var(--ink)}
.mini[aria-pressed=true]{color:var(--hot);border-color:rgba(106,213,130,.55);background:rgba(0,49,30,.7)}

/* ---------- накладки на видошукач ---------- */
#legend{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:7px;
  font-size:9px;letter-spacing:.1em;color:var(--ink)}
#ramp{width:104px;height:7px;border-radius:4px}
#pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.pin i{display:block;width:11px;height:11px;border:1.5px solid var(--hot);border-radius:50%;
  box-shadow:0 0 8px rgba(218,255,199,.6)}
.pin span{position:absolute;left:15px;top:-7px;white-space:nowrap;font-size:10px;
  color:var(--hot);text-shadow:0 0 8px #000;letter-spacing:.06em}
#note{position:absolute;left:12px;right:12px;top:10px;font-size:10.5px;letter-spacing:.05em;
  color:var(--ink);text-shadow:0 0 10px #000;line-height:1.6}
#note em{color:var(--amber);font-style:normal}

#proc{position:absolute;left:12px;right:12px;top:44px;z-index:6;background:rgba(4,14,9,.97);
  border:1px solid rgba(106,213,130,.3);border-radius:var(--r);padding:14px 16px;display:none;
  pointer-events:auto;max-height:70%;overflow-y:auto}
#proc.on{display:block}
#plog{font-size:11px;line-height:1.9;color:var(--ink)}
#plog b{color:var(--hot)} #plog .ok{color:var(--accent)}
#plog .no{color:var(--red)} #plog .wt{color:var(--amber)}
#pb{height:3px;background:rgba(106,213,130,.16);border-radius:2px;margin-top:10px;overflow:hidden}
#pf{height:100%;width:0;background:var(--accent);transition:width .3s}

/* ---------- широкий екран: док збоку ---------- */
@media (min-aspect-ratio:1/1) and (min-width:640px){
  #app{grid-template-rows:auto 1fr;grid-template-columns:1fr 300px}
  #bar{grid-column:1/-1}
  #view{grid-row:2;grid-column:1}
  #dock{grid-row:2;grid-column:2;overflow-y:auto;
        border-left:1px solid rgba(106,213,130,.14)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
#boot h1{margin:0;font-size:27px;font-weight:800;letter-spacing:.15em;color:var(--hot)}
#boot h1 s{text-decoration:none;color:var(--accent);font-weight:400;font-size:17px;letter-spacing:.24em}
#boot p{margin:0;max-width:340px;font-size:11.5px;line-height:1.9;color:var(--ink)}
#boot .stamp{font-size:9.5px;letter-spacing:.18em;color:var(--amber)}
#go{background:var(--accent);color:#03150c;border-radius:99px;padding:15px 42px;
  font-size:13px;font-weight:700;letter-spacing:.14em;box-shadow:0 0 30px rgba(106,213,130,.34)}
#boot.hide{display:none}
#err{color:var(--red);font-size:10.5px;max-width:320px;line-height:1.6}
</style>

</script>

<body>
<div id="app">
  <div id="bar">
    <div class="brand">DICH <s>//LIDAR</s></div>
    <div class="pill grow"><i class="dot"></i><b id="pDev">—</b></div>
    <div class="pill"><b id="pFps">0</b>Гц</div>
    <div class="pill" id="pConfPill"><b id="pConf">—</b>ДОВІРА</div>
    <div class="pill warn" id="pScale"><b>УМОВНИЙ</b>МАСШТАБ</div>
  </div>

  <div id="view">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="dep"></canvas>
    <canvas id="gl3"></canvas>
    <div id="hud">
      <div id="note"></div>
      <div id="pins"></div>
      <div id="legend"><span id="lNear">ближче</span><div id="ramp"></div><span id="lFar">далі</span></div>
    </div>
    <div id="proc"><div id="plog"></div><div id="pb"><div id="pf"></div></div></div>
  </div>

  <div id="dock">
    <div id="tabs" role="tablist">
      <button class="tab" role="tab" data-t="sense" aria-selected="true">ВИМІР</button>
      <button class="tab" role="tab" data-t="scan" aria-selected="false">СКАН</button>
      <button class="tab" role="tab" data-t="model" aria-selected="false">МОДЕЛЬ</button>
    </div>

    <div id="panel">
      <div class="grp on" data-g="sense">
        <div class="chips">
          <button class="chip" data-pal="0" aria-pressed="true">ТЕПЛО</button>
          <button class="chip" data-pal="1" aria-pressed="false">ЗЕЛЕНЬ</button>
          <button class="chip" data-pal="2" aria-pressed="false">СІРЕ</button>
          <button class="chip" id="cMask" aria-pressed="true">МАСКА ДОВІРИ</button>
        </div>
        <div class="row"><label>ПРОЗОРІСТЬ</label><input type="range" id="sOpa" min="0" max="1" step="0.05" value="0.85"><output>0.85</output></div>
        <div class="row"><label>БЛИЖНЯ</label><input type="range" id="sNear" min="0" max="0.9" step="0.01" value="0"><output>0.00</output></div>
        <div class="row"><label>ДАЛЬНЯ</label><input type="range" id="sFar" min="0.1" max="1" step="0.01" value="1"><output>1.00</output></div>
        <div class="row"><label>ПОРІГ ДОВІРИ</label><input type="range" id="sConf" min="0" max="0.9" step="0.02" value="0.18"><output>0.18</output></div>
      </div>

      <div class="grp" data-g="scan">
        <div class="chips">
          <button class="chip" id="cGyro" aria-pressed="false">ГІРО</button>
          <button class="chip" id="cAuto" aria-pressed="true">АВТОКАДР</button>
        </div>
        <div class="row"><label>КАДРІВ</label><input type="range" id="sShots" min="1" max="60" step="1" value="24"><output>24</output></div>
        <div class="row"><label>ЩІЛЬНІСТЬ</label><input type="range" id="sStep" min="1" max="6" step="1" value="2"><output>2</output></div>
        <div class="row"><label>РОЗРИВ</label><input type="range" id="sCut" min="0.01" max="0.4" step="0.01" value="0.06"><output>0.06</output></div>
      </div>

      <div class="grp" data-g="model">
        <div class="chips">
          <button class="chip" data-m="points" aria-pressed="false">ТОЧКИ</button>
          <button class="chip" data-m="mesh" aria-pressed="true">ПОВЕРХНЯ</button>
          <button class="chip" data-m="wire" aria-pressed="false">КАРКАС</button>
        </div>
        <div class="row"><label>РЕЛЬЄФ</label><input type="range" id="sRel" min="0.2" max="3" step="0.05" value="1"><output>1.00</output></div>
        <div class="chips">
          <button class="chip" id="bObj">↧ OBJ</button>
          <button class="chip" id="bPly">↧ PLY</button>
          <button class="chip" id="bDrop">✕ СКИНУТИ</button>
        </div>
      </div>
    </div>

    <div id="act">
      <button class="mini" id="bMeasure" aria-pressed="false" title="вимір по тапу">⊹</button>
      <button id="shoot">ЗНЯТИ</button>
      <button class="mini" id="bInfo" aria-pressed="false" title="журнал">?</button>
    </div>
  </div>
</div>

<div id="boot">
  <h1>DICH <s>//LIDAR</s></h1>
  <div class="stamp" id="stamp"></div>
  <p>Глибина з однієї камери. Прилад показує не лише відстань, а й власну
     довіру до неї — там, де він насправді нічого не бачить, поверхні не буде.</p>
  <button id="go">ПУСК</button>
  <div id="err"></div>
</div>

<script type="module">
const BUILD = 'L1 · сенсор';
document.getElementById('stamp').textContent = 'ЗБІРКА ' + BUILD;

/* ============================================================
   ПАРАМЕТРИ
   ============================================================ */
const P = {
  pal:0, mask:true, opacity:0.85, near:0, far:1, confMin:0.18,
  shots:24, step:2, cut:0.06, relief:1, hfov:62, range:6,
  measure:false, gyro:false, auto:true
};
let mode = 'sense';

/* ============================================================
   ГЕОМЕТРІЯ — перенесено з перевіреного ядра
   Круговий обхід «сцена → карта глибини → реконструкція» давав 7.9e-7.
   ============================================================ */
function depthToZ(dn, range){ const k = 1/range; return 1/(dn*(1-k) + k); }

function buildRelief(depth, conf, W, H, rgb, o){
  const step = Math.max(1, Math.round(o.step));
  const gw = Math.floor((W-1)/step)+1, gh = Math.floor((H-1)/step)+1;
  const n = gw*gh;
  const pos = new Float32Array(n*3), col = new Float32Array(n*3), zs = new Float32Array(n);
  const fx = (W*0.5)/Math.tan(o.hfov*Math.PI/360), cx = W*0.5, cy = H*0.5;
  let lo = Infinity, hi = -Infinity;
  for (let i=0;i<depth.length;i++){ const d=depth[i]; if(d<lo)lo=d; if(d>hi)hi=d; }
  const span = Math.max(1e-6, hi-lo);
  let i = 0, kept = 0;
  for (let gy=0; gy<gh; gy++){
    const v = Math.min(H-1, gy*step);
    for (let gx=0; gx<gw; gx++, i++){
      const u = Math.min(W-1, gx*step), k = v*W+u;
      const dn = (depth[k]-lo)/span;
      if (dn < o.near || dn > o.far || (conf && conf[k] < o.confMin)){ zs[i] = -1; pos[i*3+2] = NaN; continue; }
      const z = depthToZ(dn, o.range) * o.relief;
      zs[i] = z; kept++;
      pos[i*3] = (u-cx)*z/fx; pos[i*3+1] = -(v-cy)*z/fx; pos[i*3+2] = -z;
      if (rgb){ const q=k*4; col[i*3]=rgb[q]/255; col[i*3+1]=rgb[q+1]/255; col[i*3+2]=rgb[q+2]/255; }
      else { col[i*3]=.42; col[i*3+1]=.84; col[i*3+2]=.51; }
    }
  }
  /* грань пропускаємо на розриві глибини: інакше на межах предметів
     тягнеться плівка від переднього плану до фону */
  const tri = [];
  for (let gy=0; gy<gh-1; gy++)
    for (let gx=0; gx<gw-1; gx++){
      const a=gy*gw+gx, b=a+1, c=a+gw, d=c+1;
      const za=zs[a],zb=zs[b],zc=zs[c],zd=zs[d];
      if (za<0||zb<0||zc<0||zd<0) continue;
      const mx=Math.max(za,zb,zc,zd), mn=Math.min(za,zb,zc,zd);
      /* Квад ширший — перепад глибини в ньому природно більший. Без цієї
         поправки на кроці 4 поріг з'їдав 95% граней. */
      if ((mx-mn)/mn > o.cut*step) continue;
      tri.push(a,c,b, b,c,d);
    }
  return { pos, col, tri:new Uint32Array(tri), gw, gh, count:n, kept };
}
function edgesFromTris(tri){
  const seen = new Set(), out = [];
  for (let i=0;i<tri.length;i+=3){
    const t=[tri[i],tri[i+1],tri[i+2]];
    for (let e=0;e<3;e++){
      const a=t[e], b=t[(e+1)%3];
      const k = a<b ? a*4294967296+b : b*4294967296+a;
      if (seen.has(k)) continue;
      seen.add(k); out.push(a,b);
    }
  }
  return new Uint32Array(out);
}

/* ============================================================
   ДОВІРА
   ============================================================
   Мережа завжди щось віддає — і на білій стіні теж, де насправді
   нічого не бачить. Апаратний лідар там просто не повертає точку.
   Тому міряємо локальну текстурованість: нема градієнта — нема
   підстав вірити глибині. Це саме та межа, де залізо виграє.
   ============================================================ */
function confidenceMap(gray, W, H, out){
  const th = 0.055;
  for (let y=0;y<H;y++){
    const y0 = y>0?y-1:0, y1 = y<H-1?y+1:H-1;
    for (let x=0;x<W;x++){
      const x0 = x>0?x-1:0, x1 = x<W-1?x+1:W-1;
      const gx = gray[y*W+x1]-gray[y*W+x0], gy = gray[y1*W+x]-gray[y0*W+x];
      let e = Math.sqrt(gx*gx+gy*gy)/th;
      const l = gray[y*W+x];
      if (l < 0.06 || l > 0.97) e *= 0.25;      // тінь і пересвіт брешуть
      out[y*W+x] = e > 1 ? 1 : e;
    }
  }
  /* розмиття 3×3 — довіра має бути плавною, а не по пікселю */
  const tmp = out.slice();
  for (let y=1;y<H-1;y++)
    for (let x=1;x<W-1;x++){
      let s=0;
      for (let j=-1;j<=1;j++) for (let i=-1;i<=1;i++) s+=tmp[(y+j)*W+x+i];
      out[y*W+x] = s/9;
    }
  return out;
}

/* ============================================================
   ПАЛІТРИ
   ============================================================ */
function palette(p, t){
  if (p === 2){ const v = (t*255)|0; return [v,v,v]; }
  if (p === 1){ return [ (18+200*t)|0, (49+206*t)|0, (30+169*t)|0 ]; }
  const r = Math.max(0, Math.min(1, 1.6*t-0.35));
  const g = Math.max(0, Math.min(1, 1.5*Math.sin(Math.PI*t)));
  const b = Math.max(0, Math.min(1, 1.2*(1-t)-0.1));
  return [(r*255)|0,(g*255)|0,(b*255)|0];
}
(function rampFill(){
  const c = document.createElement('canvas'); c.width=104; c.height=7;
  const x = c.getContext('2d');
  const paint = () => { const im = x.createImageData(104,7);
    for (let u=0;u<104;u++){ const [r,g,b] = palette(P.pal, u/103);
      for (let v=0;v<7;v++){ const k=(v*104+u)*4; im.data[k]=r;im.data[k+1]=g;im.data[k+2]=b;im.data[k+3]=255; } }
    x.putImageData(im,0,0);
    document.getElementById('ramp').style.background = 'url('+c.toDataURL()+') center/100% 100%'; };
  paint(); globalThis.__ramp = paint;
})();

globalThis.__CORE = { depthToZ, buildRelief, edgesFromTris, confidenceMap, palette };

/* ============================================================
   КАМЕРА І СЕНСОР
   ============================================================ */
const vid = document.getElementById('cam');
const dep = document.getElementById('dep');
const dctx = dep.getContext('2d');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently:true });

let stream = null, pipe = null, device = '—', running = false;
let D = null, DW = 0, DH = 0, CONF = null, GRAY = null;
let inferMs = 0, hz = 0, lastShown = 0, busyInfer = false;
let inputSide = 384;                 // адаптується під швидкість пристрою

function note(html){ document.getElementById('note').innerHTML = html || ''; }

async function startCam(){
  stream = await navigator.mediaDevices.getUserMedia({
    audio:false, video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} } });
  vid.srcObject = stream;
  await vid.play().catch(()=>{});
  await new Promise(r => vid.videoWidth ? r() : (vid.onloadedmetadata = () => r()));
}

async function loadModel(){
  plog('вантажу мережу глибини…', '', 8);
  const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
  env.allowLocalModels = false;
  let gpu = false;
  try { gpu = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch(e){}
  device = gpu ? 'WebGPU' : 'WASM';
  if (!gpu) inputSide = 256;
  document.getElementById('pDev').textContent = device;
  const opt = { device: gpu?'webgpu':'wasm', dtype: gpu?'fp16':'q8',
    progress_callback: p => { if (p.status==='progress' && p.total)
      plog('мережа: ' + Math.round(100*p.loaded/p.total) + '%', '', 8+60*p.loaded/p.total, true); } };
  try { pipe = await pipeline('depth-estimation','onnx-community/depth-anything-v2-small',opt); }
  catch(e){ pipe = await pipeline('depth-estimation','onnx-community/depth-anything-v2-base',opt); }
  plog('мережа готова · ' + device, 'ok', 100);
  setTimeout(hideProc, 900);
}

function grabWork(side){
  const vw = vid.videoWidth, vh = vid.videoHeight;
  if (!vw) return null;
  const w = side, h = Math.round(side*vh/vw);
  work.width = w; work.height = h;
  wctx.drawImage(vid, 0, 0, w, h);
  return { w, h };
}

async function inferOnce(){
  if (!pipe || busyInfer || !vid.videoWidth) return;
  busyInfer = true;
  try {
    const g = grabWork(inputSide);
    if (!g) { busyInfer = false; return; }
    const url = work.toDataURL('image/jpeg', 0.85);
    const t0 = performance.now();
    const out = await pipe(url);
    inferMs = performance.now() - t0;
    /* адаптація: тримаємо близько 250 мс на прохід */
    if (inferMs > 420 && inputSide > 224) inputSide = Math.max(224, inputSide - 64);
    else if (inferMs < 140 && inputSide < 512) inputSide = Math.min(512, inputSide + 64);

    const pd = out.predicted_depth;
    if (pd && pd.data && pd.dims){
      const dm = pd.dims; DH = dm[dm.length-2]; DW = dm[dm.length-1];
      D = Float32Array.from(pd.data);
    } else {
      const r = out.depth; DW = r.width; DH = r.height;
      const ch = r.data.length/(DW*DH);
      D = new Float32Array(DW*DH);
      for (let i=0;i<D.length;i++) D[i] = r.data[i*ch];
    }
    /* сірий тієї ж роздільності — для карти довіри */
    work.width = DW; work.height = DH;
    wctx.drawImage(vid, 0, 0, DW, DH);
    const im = wctx.getImageData(0,0,DW,DH).data;
    if (!GRAY || GRAY.length !== DW*DH){ GRAY = new Float32Array(DW*DH); CONF = new Float32Array(DW*DH); }
    for (let i=0,j=0;i<DW*DH;i++,j+=4) GRAY[i] = (im[j]*.299+im[j+1]*.587+im[j+2]*.114)/255;
    confidenceMap(GRAY, DW, DH, CONF);
    hz = 1000/Math.max(1,inferMs);
    paintDepth();
  } catch(e){ note('<em>мережа спіткнулась:</em> ' + (e.message||e)); }
  busyInfer = false;
}

let dimg = null;
function paintDepth(){
  if (!D) return;
  if (dep.width !== DW || dep.height !== DH){ dep.width = DW; dep.height = DH; dimg = dctx.createImageData(DW,DH); }
  let lo=Infinity, hi=-Infinity;
  for (let i=0;i<D.length;i++){ const v=D[i]; if(v<lo)lo=v; if(v>hi)hi=v; }
  const span = Math.max(1e-6, hi-lo);
  const px = dimg.data;
  let good = 0;
  for (let i=0;i<D.length;i++){
    const dn = (D[i]-lo)/span;
    const c = CONF ? CONF[i] : 1;
    const k = i*4;
    if (dn < P.near || dn > P.far || (P.mask && c < P.confMin)){ px[k+3] = 0; continue; }
    const t = (dn - P.near)/Math.max(1e-6, P.far - P.near);
    const [r,g,b] = palette(P.pal, Math.max(0,Math.min(1,t)));
    px[k]=r; px[k+1]=g; px[k+2]=b;
    px[k+3] = P.mask ? (60 + 195*Math.min(1,c*1.4))|0 : 235;
    good++;
  }
  dctx.putImageData(dimg, 0, 0);
  dep.style.opacity = P.opacity;
  document.getElementById('pFps').textContent = hz.toFixed(1);
  const cf = good/D.length;
  const el = document.getElementById('pConf'), pill = document.getElementById('pConfPill');
  el.textContent = Math.round(cf*100) + '%';
  pill.className = 'pill' + (cf < 0.25 ? ' bad' : cf < 0.5 ? ' warn' : '');
  if (cf < 0.25) note('<em>мало текстури</em> — глибині тут вірити не можна, підійди ближче або додай світла');
  else if (mode === 'sense' && !P.measure) note('');
}

/* ---------- вимір по тапу ---------- */
const pins = [];
document.getElementById('view').addEventListener('click', ev => {
  if (!P.measure || !D || mode === 'model') return;
  const r = dep.getBoundingClientRect();
  const u = Math.round((ev.clientX - r.left)/r.width * DW);
  const v = Math.round((ev.clientY - r.top)/r.height * DH);
  if (u<0||v<0||u>=DW||v>=DH) return;
  let lo=Infinity, hi=-Infinity;
  for (let i=0;i<D.length;i++){ const q=D[i]; if(q<lo)lo=q; if(q>hi)hi=q; }
  const dn = (D[v*DW+u]-lo)/Math.max(1e-6,hi-lo);
  const z = depthToZ(dn, P.range);
  const c = CONF ? CONF[v*DW+u] : 1;
  pins.push({ x:(ev.clientX-r.left)/r.width, y:(ev.clientY-r.top)/r.height,
              z, c });
  if (pins.length > 6) pins.shift();
  drawPins();
});
function drawPins(){
  const box = document.getElementById('pins');
  box.innerHTML = pins.map(p =>
    '<div class="pin" style="left:' + (p.x*100) + '%;top:' + (p.y*100) + '%">' +
    '<i style="border-color:' + (p.c < P.confMin ? '#DF2F2E' : '#DAFFC7') + '"></i>' +
    '<span>' + p.z.toFixed(2) + ' у.о.' + (p.c < P.confMin ? ' ?' : '') + '</span></div>').join('');
}

/* ---------- цикл ---------- */
function loop(){
  if (!running) return;
  requestAnimationFrame(loop);
  if (mode !== 'model' && pipe && !busyInfer && performance.now() - lastShown > 40){
    lastShown = performance.now();
    inferOnce();
  }
}

/* ============================================================
   ЖУРНАЛ
   ============================================================ */
const LOG = [];
function plog(t, cls, pct, replace){
  if (replace && LOG.length) LOG[LOG.length-1] = '<span class="'+(cls||'')+'">'+t+'</span>';
  else LOG.push('<span class="'+(cls||'')+'">'+t+'</span>');
  document.getElementById('plog').innerHTML = LOG.join('<br>');
  document.getElementById('proc').classList.add('on');
  if (pct != null) document.getElementById('pf').style.width = pct + '%';
  return new Promise(r => setTimeout(r, 16));
}
function plogReset(){ LOG.length = 0; document.getElementById('plog').innerHTML = '';
  document.getElementById('pf').style.width = '0'; }
function hideProc(){ document.getElementById('proc').classList.remove('on'); }
document.getElementById('bInfo').addEventListener('click', e => {
  const on = document.getElementById('proc').classList.toggle('on');
  e.currentTarget.setAttribute('aria-pressed', on);
});

/* ============================================================
   ЗНІМОК І МОДЕЛЬ
   ============================================================ */
let relief = null, shotRGB = null;

async function shootOne(){
  if (!D){ await plog('глибини ще нема — дай мережі кадр', 'wt', 100); return; }
  plogReset();
  await plog('кадр ' + DW + '×' + DH + ' · довіра ' + document.getElementById('pConf').textContent, '', 20);
  work.width = DW; work.height = DH;
  wctx.drawImage(vid, 0, 0, DW, DH);
  shotRGB = wctx.getImageData(0,0,DW,DH).data;
  await plog('будую рельєф…', '', 55);
  relief = buildRelief(D, CONF, DW, DH, shotRGB, P);
  await plog('точок <b>' + relief.kept + '</b> · граней <b>' + (relief.tri.length/3|0) + '</b>',
             relief.kept ? 'ok' : 'no', 80);
  if (!relief.kept){ await plog('усе відкинуто порогом довіри — знизь його', 'no', 100); return; }
  await plog('відкриваю модель', 'ok', 100);
  setTab('model');
  await openViewer();
  setTimeout(hideProc, 900);
}

/* ---------- вьюпорт ---------- */
let TH=null, ren=null, sc=null, cam=null, ctl=null, oPts=null, oMesh=null, oWire=null, vmode='mesh';
async function openViewer(){
  if (!TH){
    const three = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
    const oc = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js');
    TH = { ...three, OrbitControls: oc.OrbitControls };
  }
  const c = document.getElementById('gl3');
  c.style.display = 'block';
  if (!ren){
    ren = new TH.WebGLRenderer({ canvas:c, antialias:true });
    ren.setPixelRatio(Math.min(2, devicePixelRatio||1));
    sc = new TH.Scene(); sc.background = new TH.Color(0x030906);
    cam = new TH.PerspectiveCamera(52, 1, 0.01, 500);
    ctl = new TH.OrbitControls(cam, c); ctl.enableDamping = true; ctl.dampingFactor = .08;
    sc.add(new TH.AmbientLight(0xffffff, .85));
    const dl = new TH.DirectionalLight(0xDAFFC7, 1); dl.position.set(1,1,1); sc.add(dl);
    (function r3(){ requestAnimationFrame(r3);
      if (ctl && c.style.display !== 'none'){ ctl.update(); ren.render(sc, cam); } })();
  }
  sizeViewer(); buildViewer();
}
function sizeViewer(){
  if (!ren) return;
  const v = document.getElementById('view');
  ren.setSize(v.clientWidth, v.clientHeight, false);
  cam.aspect = v.clientWidth/Math.max(1,v.clientHeight); cam.updateProjectionMatrix();
}
function buildViewer(){
  if (!relief) return;
  for (const o of [oPts,oMesh,oWire]) if (o){ sc.remove(o); o.geometry.dispose(); o.material.dispose(); }
  const g = new TH.BufferGeometry();
  g.setAttribute('position', new TH.BufferAttribute(relief.pos,3));
  g.setAttribute('color', new TH.BufferAttribute(relief.col,3));
  oPts = new TH.Points(g, new TH.PointsMaterial({ size:2.2, sizeAttenuation:false, vertexColors:true }));
  const gm = g.clone(); gm.setIndex(new TH.BufferAttribute(relief.tri,1)); gm.computeVertexNormals();
  oMesh = new TH.Mesh(gm, new TH.MeshLambertMaterial({ vertexColors:true, side:TH.DoubleSide }));
  const gw = g.clone(); gw.setIndex(new TH.BufferAttribute(edgesFromTris(relief.tri),1));
  oWire = new TH.LineSegments(gw, new TH.LineBasicMaterial({ color:0x6AD582, transparent:true, opacity:.4 }));
  sc.add(oPts); sc.add(oMesh); sc.add(oWire);
  applyVMode();
  const bb = new TH.Box3().setFromBufferAttribute(g.getAttribute('position'));
  if (!bb.isEmpty()){
    const ct = bb.getCenter(new TH.Vector3()), sz = bb.getSize(new TH.Vector3());
    const r = Math.max(sz.x,sz.y,sz.z)||1;
    ctl.target.copy(ct); cam.position.set(ct.x, ct.y, ct.z + r*1.6);
    cam.near = r/200; cam.far = r*40; cam.updateProjectionMatrix(); ctl.update();
  }
}
function applyVMode(){
  if (!oPts) return;
  oPts.visible = vmode==='points'; oMesh.visible = vmode==='mesh';
  oWire.visible = vmode==='wire' || vmode==='mesh';
  oWire.material.opacity = vmode==='wire' ? .8 : .14;
}

/* ---------- експорт ---------- */
function save(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/plain' }));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function toOBJ(){
  const L = ['# DICH //LIDAR','# масштаб умовний — монокулярна глибина'];
  for (let i=0;i<relief.count;i++){
    if (!isFinite(relief.pos[i*3+2])) { L.push('v 0 0 0'); continue; }
    L.push('v '+relief.pos[i*3].toFixed(4)+' '+relief.pos[i*3+1].toFixed(4)+' '+relief.pos[i*3+2].toFixed(4));
  }
  for (let i=0;i<relief.tri.length;i+=3)
    L.push('f '+(relief.tri[i]+1)+' '+(relief.tri[i+1]+1)+' '+(relief.tri[i+2]+1));
  return L.join('\n');
}
function toPLY(){
  const idx = [], map = new Int32Array(relief.count).fill(-1);
  for (let i=0;i<relief.count;i++) if (isFinite(relief.pos[i*3+2])){ map[i]=idx.length; idx.push(i); }
  const H = ['ply','format ascii 1.0','comment DICH //LIDAR — масштаб умовний',
    'element vertex '+idx.length,'property float x','property float y','property float z',
    'property uchar red','property uchar green','property uchar blue',
    'element face '+(relief.tri.length/3),'property list uchar int vertex_index','end_header'];
  for (const i of idx)
    H.push(relief.pos[i*3].toFixed(4)+' '+relief.pos[i*3+1].toFixed(4)+' '+relief.pos[i*3+2].toFixed(4)+
      ' '+(relief.col[i*3]*255|0)+' '+(relief.col[i*3+1]*255|0)+' '+(relief.col[i*3+2]*255|0));
  for (let i=0;i<relief.tri.length;i+=3)
    H.push('3 '+map[relief.tri[i]]+' '+map[relief.tri[i+1]]+' '+map[relief.tri[i+2]]);
  return H.join('\n');
}

/* ============================================================
   UI
   ============================================================ */
function setTab(t){
  mode = t;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t===t));
  document.querySelectorAll('.grp').forEach(g => g.classList.toggle('on', g.dataset.g===t));
  const sh = document.getElementById('shoot');
  sh.textContent = t==='scan' ? 'ПОЧАТИ СКАН' : t==='model' ? 'НОВИЙ ЗНІМОК' : 'ЗНЯТИ';
  sh.classList.remove('rec');
  const g3 = document.getElementById('gl3');
  if (t==='model'){ if (relief) { g3.style.display='block'; sizeViewer(); } }
  else g3.style.display = 'none';
  dep.style.display = t==='model' ? 'none' : 'block';
  document.getElementById('legend').style.display = t==='model' ? 'none' : 'flex';
  if (t==='scan') note('Скан по кількох кадрах — наступний крок. Поки що працює одиночний знімок.');
  else note('');
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.t)));

const bind = (id, key, fmt) => {
  const el = document.getElementById(id), out = el.parentElement.querySelector('output');
  let t = 0;
  const upd = () => {
    P[key] = parseFloat(el.value); out.textContent = (fmt||(v=>v.toFixed(2)))(P[key]);
    if (key==='opacity'){ dep.style.opacity = P.opacity; return; }
    if (mode !== 'model'){ paintDepth(); return; }
    clearTimeout(t);                       // перебудова сітки коштує сотні мс
    t = setTimeout(() => { if (relief && D){ relief = buildRelief(D,CONF,DW,DH,shotRGB,P); buildViewer(); } }, 160);
  };
  el.addEventListener('input', upd); upd();
};
bind('sOpa','opacity'); bind('sNear','near'); bind('sFar','far'); bind('sConf','confMin');
bind('sShots','shots', v=>String(v|0)); bind('sStep','step', v=>String(v|0));
bind('sCut','cut'); bind('sRel','relief');

document.querySelectorAll('[data-pal]').forEach(b => b.addEventListener('click', () => {
  P.pal = +b.dataset.pal;
  document.querySelectorAll('[data-pal]').forEach(x => x.setAttribute('aria-pressed', x===b));
  globalThis.__ramp(); paintDepth();
}));
document.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => {
  vmode = b.dataset.m;
  document.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x===b));
  applyVMode();
}));
const toggle = (id, key, after) => document.getElementById(id).addEventListener('click', e => {
  P[key] = !P[key]; e.currentTarget.setAttribute('aria-pressed', P[key]); if (after) after();
});
toggle('cMask','mask', paintDepth);
toggle('bMeasure','measure', () => { if (!P.measure){ pins.length=0; drawPins(); } });
toggle('cAuto','auto');
document.getElementById('cGyro').addEventListener('click', async e => {
  try {
    const DO = window.DeviceOrientationEvent;
    if (DO && typeof DO.requestPermission === 'function'){
      const r = await DO.requestPermission();
      if (r !== 'granted'){ note('<em>гіро:</em> ' + r); return; }
    }
    P.gyro = true; e.currentTarget.setAttribute('aria-pressed', true);
    note('Гіро увімкнено — знадобиться для скану по кількох кадрах');
  } catch(err){ note('<em>гіро не дало:</em> ' + (err.message||err)); }
});
document.getElementById('bObj').addEventListener('click', () => relief && save('dich-lidar-'+Date.now()+'.obj', toOBJ()));
document.getElementById('bPly').addEventListener('click', () => relief && save('dich-lidar-'+Date.now()+'.ply', toPLY()));
document.getElementById('bDrop').addEventListener('click', () => { relief = null; setTab('sense'); });
document.getElementById('shoot').addEventListener('click', () => {
  if (mode === 'model'){ setTab('sense'); return; }
  if (mode === 'scan'){ note('Багатокадровий скан ще не підключений — тисни ВИМІР і ЗНЯТИ'); return; }
  shootOne();
});
addEventListener('resize', () => { sizeViewer(); });

document.getElementById('go').addEventListener('click', async () => {
  const err = document.getElementById('err');
  err.textContent = 'Камеру шукаю…';
  try {
    if (!isSecureContext) throw new Error('потрібен HTTPS');
    await startCam();
    document.getElementById('boot').classList.add('hide');
    running = true; setTab('sense'); loop();
    loadModel().catch(e => plog('мережа не завантажилась: ' + (e.message||e), 'no', 100));
  } catch(e){ err.textContent = 'Не пішло: ' + (e.message||e); }
});
</script>
