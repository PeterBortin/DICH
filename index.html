<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B08">
<title>DICH //EDGE</title>
<style>
:root{
  --accent:#6AD582;
  --hot:#DAFFC7;
  --deep:#00311E;
  --panel:#0d3b25;
  --amber:#FFC13C;
  --red:#DF2F2E;
  --bg:#050B08;
  --ink:#8FA99A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
  font-family:var(--mono);color:var(--accent);
  -webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{z-index:1}
#ov{z-index:2}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#proc{display:none}

/* ---------- HUD ---------- */
.hud{position:absolute;z-index:3;pointer-events:none}
#top{top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;
  display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mark{font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--hot);
  text-shadow:0 0 14px rgba(106,213,130,.55)}
.mark span{color:var(--accent);font-weight:500;letter-spacing:.22em;font-size:13px}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(4,14,9,.72);border:1px solid rgba(106,213,130,.18);
  border-radius:999px;padding:5px 11px;font-size:10.5px;letter-spacing:.11em;
  color:var(--ink);display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 7px var(--accent)}
.chip b{color:var(--hot);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- right rail ---------- */
#rail{position:absolute;z-index:3;right:14px;top:calc(env(safe-area-inset-top) + 74px);
  display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.btn{pointer-events:auto;background:rgba(6,17,11,.82);border:1px solid rgba(106,213,130,.16);
  color:var(--ink);border-radius:999px;padding:11px 17px;font-family:var(--mono);
  font-size:12px;letter-spacing:.1em;display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(10px);transition:.14s;cursor:pointer}
.btn:active{transform:scale(.96)}
.btn.on{background:var(--accent);color:#03150c;border-color:var(--accent);
  font-weight:700;box-shadow:0 0 22px rgba(106,213,130,.34)}
.btn.amber{border-color:rgba(255,193,60,.4);color:var(--amber)}
.btn:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

/* ---------- sheet ---------- */
#sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,rgba(5,11,8,.5),rgba(3,8,6,.97) 22%);
  border-top:1px solid rgba(106,213,130,.16);backdrop-filter:blur(18px);
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(calc(100% - 62px));transition:transform .26s cubic-bezier(.3,.8,.3,1)}
#sheet.open{transform:translateY(0)}
#grip{pointer-events:auto;display:flex;align-items:center;gap:10px;height:34px;cursor:pointer}
#grip .bar{width:34px;height:3px;border-radius:2px;background:rgba(106,213,130,.4)}
#grip .lbl{font-size:11px;letter-spacing:.16em;color:var(--ink)}
#grip .lbl em{color:var(--amber);font-style:normal}
.presets{display:flex;gap:7px;margin:6px 0 14px;flex-wrap:wrap}
.pre{pointer-events:auto;flex:1;min-width:88px;background:transparent;
  border:1px solid rgba(106,213,130,.22);color:var(--accent);border-radius:8px;
  padding:9px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;cursor:pointer}
.pre:active{background:rgba(106,213,130,.14)}
.rows{display:grid;grid-template-columns:1fr;gap:11px;
  max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{pointer-events:auto;display:grid;grid-template-columns:78px 1fr 52px;
  align-items:center;gap:10px}
.row label{font-size:10px;letter-spacing:.1em;color:var(--ink)}
.row output{font-size:11px;text-align:right;color:var(--hot);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(106,213,130,.2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--accent);margin-top:-6.5px;
  box-shadow:0 0 10px rgba(106,213,130,.6)}
input[type=range]::-moz-range-track{height:2px;background:rgba(106,213,130,.2)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;
  background:var(--accent)}
.toggles{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.tg{pointer-events:auto;background:transparent;border:1px solid rgba(106,213,130,.22);
  color:var(--ink);border-radius:999px;padding:8px 13px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.09em;cursor:pointer}
.tg.on{background:rgba(106,213,130,.16);color:var(--hot);border-color:var(--accent)}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:20;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px}
#boot h1{margin:0;font-size:26px;letter-spacing:.16em;color:var(--hot);font-weight:800}
#boot h1 span{color:var(--accent);font-weight:400;letter-spacing:.24em;font-size:15px}
#boot p{margin:0;max-width:290px;text-align:center;font-size:11.5px;line-height:1.75;
  color:var(--ink);letter-spacing:.04em}
#go{pointer-events:auto;background:var(--accent);color:#03150c;border:0;border-radius:999px;
  padding:16px 44px;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.14em;
  cursor:pointer;box-shadow:0 0 34px rgba(106,213,130,.36)}
#boot.hide{display:none}
#err{color:var(--red);font-size:11px;text-align:center;max-width:300px;line-height:1.6}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}.btn{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
  <canvas id="proc"></canvas>
</div>

<div class="hud" id="top">
  <div class="mark">DICH <span>//EDGE</span></div>
  <div class="chips">
    <div class="chip"><i class="dot"></i>LIVE</div>
    <div class="chip"><b id="cFps">--</b>FPS</div>
    <div class="chip"><b id="cLines">0</b>ЛІНІЙ</div>
    <div class="chip"><b id="cMs">--</b>MS</div>
  </div>
</div>

<div id="rail">
  <button class="btn" id="bCam">⟳ КАМЕРА</button>
  <button class="btn on" id="bBase">◆ БАЗА</button>
  <button class="btn" id="bBox">◉ БОКСИ</button>
  <button class="btn amber" id="bShot">⚡ КАДР</button>
</div>

<div id="sheet">
  <div id="grip"><div class="bar"></div><div class="lbl">НАСТРОЙКА <em id="gripHint">— тицяй</em></div></div>
  <div class="presets">
    <button class="pre" data-pre="max">МАКС КОНТРАСТ</button>
    <button class="pre" data-pre="clean">ЧИСТІ ЛІНІЇ</button>
    <button class="pre" data-pre="wire">ТІЛЬКИ КАРКАС</button>
    <button class="pre" data-pre="soft">М'ЯКО</button>
  </div>
  <div class="rows" id="rows"></div>
  <div class="toggles">
    <button class="tg on" data-tg="nms">NMS</button>
    <button class="tg on" data-tg="hyst">ГІСТЕРЕЗИС</button>
    <button class="tg" data-tg="dbg">СИРА МАСКА</button>
  </div>
</div>

<div id="boot">
  <h1>DICH <span>//EDGE</span></h1>
  <p>Локальна нормалізація → Scharr → NMS → гістерезис → векторні контури. База постеризована на N рівнів.</p>
  <button id="go">ПУСК</button>
  <div id="err"></div>
</div>

<script>
'use strict';

/* ============================================================
   ПАРАМЕТРИ
   ============================================================ */
const P = {
  gain:      3.4,   // підсилення локального контрасту
  radius:    14,    // радіус локального середнього (proc px)
  levels:    4,     // рівні постеризації бази
  tHigh:     0.19,  // сильний порог
  tLow:      0.07,  // слабкий порог (гістерезис)
  preblur:   1,     // згладжування перед Scharr (0..3)
  temporal:  0.35,  // темпоральне згладжування 0..0.85
  minLen:    16,    // мін. довжина полілінії (proc px)
  eps:       1.15,  // RDP: спрощення
  procW:     240,   // ширина CPU-буфера
  glow:      1.0,   // товщина світіння
  showBase:  1,
  boxes:     false,
  nms:       true,
  hyst:      true,
  dbg:       false
};

const SPECS = [
  ['gain',     'КОНТРАСТ',  0.5, 9,    0.1, v=>v.toFixed(1)+'×'],
  ['radius',   'РАДІУС',    2,   40,   1,   v=>v+'px'],
  ['levels',   'РІВНІ',     2,   6,    1,   v=>v|0],
  ['tHigh',    'ПОРІГ ▲',   0.02,0.6,  0.005,v=>v.toFixed(3)],
  ['tLow',     'ПОРІГ ▼',   0.01,0.4,  0.005,v=>v.toFixed(3)],
  ['preblur',  'ЗГЛАДЖ',    0,   3,    1,   v=>v|0],
  ['temporal', 'ТЕМПОРАЛ',  0,   0.85, 0.05,v=>v.toFixed(2)],
  ['minLen',   'МІН.ДОВЖ',  4,   80,   1,   v=>v|0],
  ['eps',      'ДЕТАЛЬ',    0.3, 4,    0.05,v=>v.toFixed(2)],
  ['procW',    'РОЗДІЛ',    160, 420,  20,  v=>(v|0)+'w'],
  ['glow',     'СВІТІННЯ',  0,   2.4,  0.1, v=>v.toFixed(1)]
];

const PRESETS = {
  max:   {gain:6.5, levels:3,  tHigh:0.24, tLow:0.09, preblur:1, temporal:0.3,  eps:1.0,  showBase:1, glow:1.3},
  clean: {gain:3.2, levels:4,  tHigh:0.20, tLow:0.075,preblur:2, temporal:0.5,  eps:1.6,  showBase:1, glow:0.9, minLen:24},
  wire:  {gain:4.2, levels:4,  tHigh:0.17, tLow:0.06, preblur:1, temporal:0.4,  eps:1.2,  showBase:0, glow:1.6},
  soft:  {gain:2.0, levels:6,  tHigh:0.13, tLow:0.05, preblur:2, temporal:0.6,  eps:2.2,  showBase:1, glow:0.7, minLen:20}
};

/* ============================================================
   DOM
   ============================================================ */
const video = document.getElementById('v');
const glc   = document.getElementById('gl');
const ovc   = document.getElementById('ov');
const prc   = document.getElementById('proc');
const octx  = ovc.getContext('2d');
const pctx  = prc.getContext('2d', {willReadFrequently:true});

/* ============================================================
   WEBGL: постеризована зелена база
   ============================================================ */
const VS = `
attribute vec2 a;
varying vec2 uv;
void main(){ uv = a*0.5+0.5; gl_Position = vec4(a,0.0,1.0); }`;

const FS_LUMA = `
precision mediump float;
varying vec2 uv;
uniform sampler2D tex;
uniform vec2 crop;
void main(){
  vec2 t = (uv-0.5)*crop + 0.5;
  t.y = 1.0 - t.y;
  vec3 c = texture2D(tex, t).rgb;
  float l = dot(c, vec3(0.299,0.587,0.114));
  gl_FragColor = vec4(l,l,l,1.0);
}`;

const FS_BLUR = `
precision mediump float;
varying vec2 uv;
uniform sampler2D tex;
uniform vec2 dir;
void main(){
  float s = texture2D(tex,uv).r*0.2270;
  s += (texture2D(tex,uv-dir).r      + texture2D(tex,uv+dir).r)      * 0.1946;
  s += (texture2D(tex,uv-dir*2.0).r  + texture2D(tex,uv+dir*2.0).r)  * 0.1216;
  s += (texture2D(tex,uv-dir*3.0).r  + texture2D(tex,uv+dir*3.0).r)  * 0.0540;
  s += (texture2D(tex,uv-dir*4.0).r  + texture2D(tex,uv+dir*4.0).r)  * 0.0162;
  gl_FragColor = vec4(s,s,s,1.0);
}`;

const FS_MAIN = `
precision mediump float;
varying vec2 uv;
uniform sampler2D vtex;
uniform sampler2D mtex;
uniform vec2  crop;
uniform float gain;
uniform float levels;
uniform float base;
vec3 ramp(float t){
  vec3 c0 = vec3(0.012,0.031,0.020);
  vec3 c1 = vec3(0.000,0.192,0.118);
  vec3 c2 = vec3(0.051,0.231,0.145);
  vec3 c3 = vec3(0.416,0.835,0.510);
  vec3 c4 = vec3(0.855,1.000,0.780);
  if(t < 0.25) return mix(c0,c1, t/0.25);
  if(t < 0.50) return mix(c1,c2,(t-0.25)/0.25);
  if(t < 0.75) return mix(c2,c3,(t-0.50)/0.25);
  return mix(c3,c4,(t-0.75)/0.25);
}
void main(){
  vec2 t = (uv-0.5)*crop + 0.5;
  t.y = 1.0 - t.y;
  vec3 c = texture2D(vtex, t).rgb;
  float l = dot(c, vec3(0.299,0.587,0.114));
  float m = texture2D(mtex, uv).r;
  float v = clamp((l-m)*gain + 0.5, 0.0, 1.0);
  float q = clamp(floor(v*levels)/max(levels-1.0,1.0), 0.0, 1.0);
  gl_FragColor = vec4(ramp(q)*base, 1.0);
}`;

let gl, quad, pLuma, pBlur, pMain, texV, fbA, fbB, fbC;
let fboW = 2, fboH = 2;

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function prog(fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('link: ' + gl.getProgramInfoLog(p));
  const loc = {}; p.u = n => (loc[n] !== undefined ? loc[n] : (loc[n] = gl.getUniformLocation(p,n)));
  p.a = gl.getAttribLocation(p, 'a');
  return p;
}
function makeTex(w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {tex:t, fb:f, w, h};
}
function initGL(){
  gl = glc.getContext('webgl', {antialias:false, depth:false, alpha:false,
                               preserveDrawingBuffer:true});
  if(!gl) throw new Error('WebGL недоступний');
  quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  pLuma = prog(FS_LUMA); pBlur = prog(FS_BLUR); pMain = prog(FS_MAIN);
  texV = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texV);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}
function bindQuad(p){
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(p.a);
  gl.vertexAttribPointer(p.a, 2, gl.FLOAT, false, 0, 0);
}
function pass(p, target, setup){
  gl.useProgram(p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : glc.width, target ? target.h : glc.height);
  bindQuad(p);
  setup(p);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ============================================================
   CPU: буфери
   ============================================================ */
let pw=1, ph=1, np=1;
let L,M,Nf,PV,S,MAG,MAG2,DIR,EDG,STK;
let crop = [1,1], srcRect = [0,0,1,1];

function allocProc(w, h){
  pw=w; ph=h; np=w*h;
  prc.width=w; prc.height=h;
  L=new Float32Array(np); M=new Float32Array(np); Nf=new Float32Array(np);
  PV=new Float32Array(np); S=new Float32Array(np);
  MAG=new Float32Array(np); MAG2=new Float32Array(np);
  DIR=new Uint8Array(np); EDG=new Uint8Array(np); STK=new Int32Array(np);
}

/* box blur, розділений на дві осі, зі скользящим вікном — O(n) */
const tmpA = {buf:null};
function blurH(src, dst, w, h, r){
  const div = 1/(2*r+1);
  for(let y=0; y<h; y++){
    const row = y*w;
    let acc = 0;
    for(let k=-r; k<=r; k++){
      const x = k<0 ? 0 : (k>w-1 ? w-1 : k);
      acc += src[row+x];
    }
    dst[row] = acc*div;
    for(let x=1; x<w; x++){
      const add = x+r     > w-1 ? w-1 : x+r;
      const sub = x-r-1   < 0   ? 0   : x-r-1;
      acc += src[row+add] - src[row+sub];
      dst[row+x] = acc*div;
    }
  }
}
function blurV(src, dst, w, h, r){
  const div = 1/(2*r+1);
  for(let x=0; x<w; x++){
    let acc = 0;
    for(let k=-r; k<=r; k++){
      const y = k<0 ? 0 : (k>h-1 ? h-1 : k);
      acc += src[y*w+x];
    }
    dst[x] = acc*div;
    for(let y=1; y<h; y++){
      const add = (y+r   > h-1 ? h-1 : y+r)*w   + x;
      const sub = (y-r-1 < 0   ? 0   : y-r-1)*w + x;
      acc += src[add] - src[sub];
      dst[y*w+x] = acc*div;
    }
  }
}
function boxBlur(src, dst, w, h, r){
  if(r < 1){ dst.set(src); return; }
  if(!tmpA.buf || tmpA.buf.length < w*h) tmpA.buf = new Float32Array(w*h);
  blurH(src, tmpA.buf, w, h, r);
  blurV(tmpA.buf, dst, w, h, r);
}

/* ---------- Scharr + NMS + гістерезис ---------- */
const OFF = [[-1,1],[0,0],[0,0],[0,0]]; // заповнюється в processFrame

function detect(){
  const w=pw, h=ph;
  MAG.fill(0);
  for(let y=1; y<h-1; y++){
    const r = y*w;
    for(let x=1; x<w-1; x++){
      const i = r+x;
      const a=S[i-w-1], b=S[i-w], c=S[i-w+1];
      const d=S[i-1],              f=S[i+1];
      const g=S[i+w-1], hh=S[i+w], k=S[i+w+1];
      const gx = (3*a + 10*d + 3*g - 3*c - 10*f - 3*k) * 0.0625;
      const gy = (3*a + 10*b + 3*c - 3*g - 10*hh - 3*k) * 0.0625;
      MAG[i] = Math.sqrt(gx*gx + gy*gy);
      // сектор напрямку градієнта: 0=гориз 1=45° 2=верт 3=135°
      let aa = Math.atan2(gy, gx) * 57.29577951308232;
      if(aa < 0) aa += 180;
      DIR[i] = (aa < 22.5 || aa >= 157.5) ? 0 : (aa < 67.5 ? 1 : (aa < 112.5 ? 2 : 3));
    }
  }
  // non-maximum suppression по напрямку градієнта → лінія в 1px
  if(P.nms){
    MAG2.fill(0);
    for(let y=2; y<h-2; y++){
      const r = y*w;
      for(let x=2; x<w-2; x++){
        const i = r+x, m = MAG[i];
        if(m <= 0) continue;
        let o;
        switch(DIR[i]){
          case 0: o = 1;     break;
          case 1: o = -w+1;  break;
          case 2: o = w;     break;
          default:o = w+1;
        }
        // строга нерівність з одного боку — інакше на рівних магнітудах
        // (ідеально осьовий край) виживають обидва пікселі і лінія виходить 2px
        if(m > MAG[i-o] && m >= MAG[i+o]) MAG2[i] = m;
      }
    }
  } else {
    MAG2.set(MAG);
  }
  // гістерезисний порог
  EDG.fill(0);
  const tH=P.tHigh, tL=Math.min(P.tLow, P.tHigh);
  let sp = 0;
  for(let i=0; i<np; i++){
    if(MAG2[i] >= tH){ EDG[i]=1; if(sp < np) STK[sp++]=i; }
  }
  if(P.hyst){
    while(sp > 0){
      const i = STK[--sp];
      const nb = [i-w-1,i-w,i-w+1,i-1,i+1,i+w-1,i+w,i+w+1];
      for(let n=0; n<8; n++){
        const j = nb[n];
        if(EDG[j] === 0 && MAG2[j] >= tL){ EDG[j]=1; if(sp < np) STK[sp++]=j; }
      }
    }
  }
  // край кадру завжди чистий — щоб трасування не вилітало за межі
  for(let x=0; x<w; x++){ EDG[x]=0; EDG[(h-1)*w+x]=0; EDG[w+x]=0; EDG[(h-2)*w+x]=0; }
  for(let y=0; y<h; y++){ EDG[y*w]=0; EDG[y*w+w-1]=0; EDG[y*w+1]=0; EDG[y*w+w-2]=0; }
}

/* ---------- трасування поліліній ---------- */
let N4, ND, N8;
function buildOffsets(){
  N4 = [-pw, 1, pw, -1];
  ND = [-pw-1, -pw+1, pw+1, pw-1];
  N8 = [-pw-1,-pw,-pw+1,-1,1,pw-1,pw,pw+1];
}
let VIS;
function degree(i){
  let c = 0;
  for(let n=0; n<8; n++) if(EDG[i+N8[n]]) c++;
  return c;
}
function walk(seed){
  const pts = [seed];
  VIS[seed] = 1;
  let cur = seed;
  for(let step=0; step<4000; step++){
    let next = -1;
    for(let n=0; n<4; n++){ const j = cur+N4[n]; if(EDG[j] && !VIS[j]){ next=j; break; } }
    if(next < 0) for(let n=0; n<4; n++){ const j = cur+ND[n]; if(EDG[j] && !VIS[j]){ next=j; break; } }
    if(next < 0) break;
    VIS[next] = 1; pts.push(next); cur = next;
  }
  return pts;
}
function trace(){
  if(!VIS || VIS.length !== np) VIS = new Uint8Array(np);
  else VIS.fill(0);
  const raw = [];
  // 1) від кінців та розгалужень (deg !== 2)
  for(let i=0; i<np; i++){
    if(!EDG[i] || VIS[i]) continue;
    const d = degree(i);
    if(d === 2) continue;
    VIS[i] = 1;
    for(let n=0; n<8; n++){
      const j = i+N8[n];
      if(EDG[j] && !VIS[j]){
        const seg = walk(j); seg.unshift(i);
        if(seg.length >= 3) raw.push(seg);
      }
    }
  }
  // 2) залишок — замкнені петлі
  for(let i=0; i<np; i++){
    if(!EDG[i] || VIS[i]) continue;
    const seg = walk(i);
    if(seg.length >= 6) raw.push(seg);
  }
  return raw;
}

/* ---------- Ramer–Douglas–Peucker ---------- */
function rdp(pts, eps){
  if(pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length);
  keep[0] = keep[pts.length-1] = 1;
  const stack = [[0, pts.length-1]];
  const e2 = eps*eps;
  while(stack.length){
    const [a, b] = stack.pop();
    if(b - a < 2) continue;
    const ax=pts[a][0], ay=pts[a][1], bx=pts[b][0], by=pts[b][1];
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
    let bi=-1, bd=-1;
    for(let i=a+1; i<b; i++){
      const px=pts[i][0]-ax, py=pts[i][1]-ay;
      let d2;
      if(len2 === 0){ d2 = px*px+py*py; }
      else {
        let t = (px*dx+py*dy)/len2;
        t = t<0 ? 0 : (t>1 ? 1 : t);
        const cx=px-t*dx, cy=py-t*dy;
        d2 = cx*cx+cy*cy;
      }
      if(d2 > bd){ bd=d2; bi=i; }
    }
    if(bd > e2 && bi > 0){ keep[bi]=1; stack.push([a,bi],[bi,b]); }
  }
  const out = [];
  for(let i=0; i<pts.length; i++) if(keep[i]) out.push(pts[i]);
  return out;
}

/* ============================================================
   ОБРОБКА КАДРУ
   ============================================================ */
let lines = [], boxes = [];

function processFrame(){
  pctx.drawImage(video, srcRect[0], srcRect[1], srcRect[2], srcRect[3], 0, 0, pw, ph);
  let img;
  try { img = pctx.getImageData(0, 0, pw, ph); } catch(e){ return; }
  const d = img.data;

  for(let i=0, j=0; i<np; i++, j+=4){
    L[i] = (d[j]*0.299 + d[j+1]*0.587 + d[j+2]*0.114) * 0.00392156862745098;
  }
  boxBlur(L, M, pw, ph, P.radius|0);

  const g = P.gain;
  for(let i=0; i<np; i++){
    let v = (L[i]-M[i])*g + 0.5;
    Nf[i] = v<0 ? 0 : (v>1 ? 1 : v);
  }
  const a = P.temporal;
  if(a > 0.001){ for(let i=0; i<np; i++) Nf[i] = Nf[i]*(1-a) + PV[i]*a; }
  PV.set(Nf);

  boxBlur(Nf, S, pw, ph, P.preblur|0);
  detect();

  const raw = trace();
  const sx = ovc.width/pw, sy = ovc.height/ph;
  lines = []; boxes = [];
  const minL = P.minLen;

  for(let r=0; r<raw.length; r++){
    const seg = raw[r];
    if(seg.length < minL) continue;
    const pts = new Array(seg.length);
    for(let i=0; i<seg.length; i++){
      const idx = seg[i];
      pts[i] = [idx % pw, (idx/pw)|0];
    }
    const simp = rdp(pts, P.eps);
    if(simp.length < 2) continue;

    let minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
    for(let i=0; i<simp.length; i++){
      const p = simp[i];
      if(p[0]<minx) minx=p[0]; if(p[0]>maxx) maxx=p[0];
      if(p[1]<miny) miny=p[1]; if(p[1]>maxy) maxy=p[1];
    }
    const f = simp[0], l = simp[simp.length-1];
    const closed = Math.abs(f[0]-l[0]) <= 2 && Math.abs(f[1]-l[1]) <= 2 && seg.length > 14;

    lines.push({pts:simp, len:seg.length, closed, sx, sy});

    if(P.boxes && closed){
      const w = (maxx-minx), h = (maxy-miny);
      if(w > pw*0.08 && h > ph*0.06) boxes.push({x:minx*sx, y:miny*sy, w:w*sx, h:h*sy, len:seg.length});
    }
  }
  boxes.sort((A,B) => B.len - A.len);
  boxes = boxes.slice(0, 6);
}

/* ============================================================
   МАЛЮВАННЯ ВЕКТОРІВ
   ============================================================ */
function drawLines(){
  octx.clearRect(0, 0, ovc.width, ovc.height);
  if(!lines.length) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const gw = P.glow;

  // довгі контури — це справжні границі, короткі — текстура. Розділяємо по яскравості.
  let maxLen = 1;
  for(let i=0; i<lines.length; i++) if(lines[i].len > maxLen) maxLen = lines[i].len;

  const strong = new Path2D(), weak = new Path2D();
  for(let i=0; i<lines.length; i++){
    const ln = lines[i], pts = ln.pts;
    const p = (ln.len / maxLen) > 0.28 ? strong : weak;
    p.moveTo(pts[0][0]*ln.sx, pts[0][1]*ln.sy);
    for(let k=1; k<pts.length; k++) p.lineTo(pts[k][0]*ln.sx, pts[k][1]*ln.sy);
    if(ln.closed) p.closePath();
  }

  octx.lineJoin = 'round';
  octx.lineCap  = 'round';

  // слабкі — тільки тонка глуха лінія
  octx.strokeStyle = 'rgba(106,213,130,0.30)';
  octx.lineWidth = 1.0*dpr;
  octx.stroke(weak);

  // сильні — три шари: широке гало, тіло, гарячий сердечник
  if(gw > 0.01){
    octx.strokeStyle = 'rgba(106,213,130,0.13)';
    octx.lineWidth = 7.0*dpr*gw;
    octx.stroke(strong);
    octx.strokeStyle = 'rgba(106,213,130,0.34)';
    octx.lineWidth = 3.2*dpr*gw;
    octx.stroke(strong);
  }
  octx.strokeStyle = '#DAFFC7';
  octx.lineWidth = 1.25*dpr;
  octx.stroke(strong);

  // бокси: кутові засічки, без рамки
  if(P.boxes && boxes.length){
    octx.strokeStyle = '#6AD582';
    octx.lineWidth = 2*dpr;
    const t = 14*dpr;
    for(let i=0; i<boxes.length; i++){
      const b = boxes[i];
      const c = [[b.x,b.y,1,1],[b.x+b.w,b.y,-1,1],[b.x,b.y+b.h,1,-1],[b.x+b.w,b.y+b.h,-1,-1]];
      octx.beginPath();
      for(let k=0; k<4; k++){
        const [x,y,dx,dy] = c[k];
        octx.moveTo(x, y); octx.lineTo(x+t*dx, y);
        octx.moveTo(x, y); octx.lineTo(x, y+t*dy);
      }
      octx.stroke();
      octx.fillStyle = 'rgba(4,14,9,0.8)';
      octx.fillRect(b.x, b.y-19*dpr, 62*dpr, 16*dpr);
      octx.fillStyle = '#DAFFC7';
      octx.font = (10*dpr)+'px ui-monospace, monospace';
      octx.fillText('CONTOUR ' + b.len, b.x+4*dpr, b.y-7*dpr);
    }
  }
}

/* режим «сира маска» — показує EDG як є, до трасування */
function drawRawMask(){
  octx.clearRect(0, 0, ovc.width, ovc.height);
  const w = pw, h = ph, sx = ovc.width/w, sy = ovc.height/h;
  octx.fillStyle = '#DAFFC7';
  const s = Math.max(sx, sy);
  for(let y=0; y<h; y++){
    const r = y*w;
    for(let x=0; x<w; x++) if(EDG[r+x]) octx.fillRect(x*sx, y*sy, s, s);
  }
}

/* ============================================================
   РОЗМІРИ / КРОП
   ============================================================ */
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  glc.width = Math.round(W*dpr); glc.height = Math.round(H*dpr);
  ovc.width = Math.round(W*dpr); ovc.height = Math.round(H*dpr);

  fboW = Math.max(2, Math.round(glc.width/4));
  fboH = Math.max(2, Math.round(glc.height/4));
  if(gl){
    [fbA,fbB,fbC].forEach(f => { if(f){ gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fb); } });
    fbA = makeTex(fboW, fboH); fbB = makeTex(fboW, fboH); fbC = makeTex(fboW, fboH);
  }

  const w = Math.round(P.procW), hh = Math.max(2, Math.round(w * H / W));
  if(w !== pw || hh !== ph){ allocProc(w, hh); buildOffsets(); }
  computeCrop();
}
function computeCrop(){
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  const dAsp = innerWidth/innerHeight, vAsp = vw/vh;
  let cx = 1, cy = 1;
  if(vAsp > dAsp) cx = dAsp/vAsp; else cy = vAsp/dAsp;
  crop = [cx, cy];
  const sw = vw*cx, sh = vh*cy;
  srcRect = [(vw-sw)/2, (vh-sh)/2, sw, sh];
}

/* ============================================================
   ЦИКЛ
   ============================================================ */
let facing = 'environment', stream = null, running = false;
let frames = 0, fpsT = 0, lastMs = 0, procAcc = 0;

function render(){
  if(!running) return;
  requestAnimationFrame(render);
  if(video.readyState < 2) return;

  // --- GPU: база
  gl.bindTexture(gl.TEXTURE_2D, texV);
  try {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  } catch(e){ return; }

  pass(pLuma, fbA, p => {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texV);
    gl.uniform1i(p.u('tex'), 0);
    gl.uniform2f(p.u('crop'), crop[0], crop[1]);
  });
  const rr = Math.max(1, P.radius/4);
  pass(pBlur, fbB, p => {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbA.tex);
    gl.uniform1i(p.u('tex'), 0);
    gl.uniform2f(p.u('dir'), rr/fboW, 0);
  });
  pass(pBlur, fbC, p => {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbB.tex);
    gl.uniform1i(p.u('tex'), 0);
    gl.uniform2f(p.u('dir'), 0, rr/fboH);
  });
  pass(pMain, null, p => {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texV);
    gl.uniform1i(p.u('vtex'), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fbC.tex);
    gl.uniform1i(p.u('mtex'), 1);
    gl.uniform2f(p.u('crop'), crop[0], crop[1]);
    gl.uniform1f(p.u('gain'), P.gain);
    gl.uniform1f(p.u('levels'), Math.round(P.levels));
    gl.uniform1f(p.u('base'), P.showBase ? 1.0 : 0.06);
  });

  // --- CPU: вектори
  const t0 = performance.now();
  processFrame();
  if(P.dbg) drawRawMask(); else drawLines();
  procAcc = procAcc*0.9 + (performance.now()-t0)*0.1;

  frames++;
  const now = performance.now();
  if(now - fpsT > 500){
    document.getElementById('cFps').textContent = Math.round(frames*1000/(now-fpsT));
    document.getElementById('cLines').textContent = lines.length;
    document.getElementById('cMs').textContent = procAcc.toFixed(1);
    frames = 0; fpsT = now;
  }
}

/* ============================================================
   КАМЕРА
   ============================================================ */
async function startCam(){
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720} }
  });
  video.srcObject = stream;
  await video.play();
  await new Promise(r => {
    if(video.videoWidth) return r();
    video.onloadedmetadata = r;
  });
  computeCrop();
}

/* ============================================================
   UI
   ============================================================ */
function buildRows(){
  const box = document.getElementById('rows');
  box.innerHTML = '';
  for(const [key, label, min, max, step, fmt] of SPECS){
    const row = document.createElement('div'); row.className = 'row';
    const lb = document.createElement('label'); lb.textContent = label; lb.id = 'lb_'+key;
    const inp = document.createElement('input');
    inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=P[key];
    inp.setAttribute('aria-labelledby','lb_'+key);
    const out = document.createElement('output'); out.textContent = fmt(P[key]);
    inp.addEventListener('input', () => {
      P[key] = parseFloat(inp.value);
      out.textContent = fmt(P[key]);
      if(key === 'procW'){
        const w = Math.round(P.procW), h = Math.max(2, Math.round(w*innerHeight/innerWidth));
        allocProc(w, h); buildOffsets(); computeCrop();
      }
    });
    row.append(lb, inp, out); box.append(row);
    inp.dataset.key = key;
  }
}
function syncRows(){
  document.querySelectorAll('#rows input').forEach(inp => {
    const key = inp.dataset.key;
    const spec = SPECS.find(s => s[0] === key);
    inp.value = P[key];
    inp.parentElement.querySelector('output').textContent = spec[5](P[key]);
  });
  document.getElementById('bBase').classList.toggle('on', !!P.showBase);
  document.getElementById('bBox').classList.toggle('on', !!P.boxes);
}

document.getElementById('grip').addEventListener('click', () => {
  const s = document.getElementById('sheet');
  s.classList.toggle('open');
  document.getElementById('gripHint').textContent = s.classList.contains('open') ? '— крути' : '— тицяй';
});
document.querySelectorAll('.pre').forEach(b => b.addEventListener('click', () => {
  Object.assign(P, PRESETS[b.dataset.pre]);
  syncRows();
}));
document.querySelectorAll('.tg').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.tg; P[k] = !P[k]; b.classList.toggle('on', P[k]);
}));
document.getElementById('bBase').addEventListener('click', e => {
  P.showBase = P.showBase ? 0 : 1; e.currentTarget.classList.toggle('on', !!P.showBase);
});
document.getElementById('bBox').addEventListener('click', e => {
  P.boxes = !P.boxes; e.currentTarget.classList.toggle('on', P.boxes);
});
document.getElementById('bCam').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCam(); } catch(err){ console.warn(err); }
});
document.getElementById('bShot').addEventListener('click', () => {
  const c = document.createElement('canvas');
  c.width = glc.width; c.height = glc.height;
  const x = c.getContext('2d');
  x.drawImage(glc, 0, 0); x.drawImage(ovc, 0, 0);
  c.toBlob(bl => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(bl);
    a.download = 'dich-edge-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});

addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(resize, 140); });
addEventListener('orientationchange', () => setTimeout(resize, 300));

document.getElementById('go').addEventListener('click', async () => {
  const errEl = document.getElementById('err');
  errEl.textContent = 'Камеру шукаю, погоди…';
  try {
    initGL();
    await startCam();
    resize();
    buildRows();
    document.getElementById('boot').classList.add('hide');
    running = true; fpsT = performance.now();
    render();
  } catch(err){
    errEl.textContent = 'Не пішло: ' + (err && err.message ? err.message : err) +
      ' — потрібен HTTPS (або localhost) і дозвіл на камеру.';
  }
});
</script>
