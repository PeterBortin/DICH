<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B08">
<title>DICH //EDGE</title>
<style>
:root{
  --accent:#6AD582; --hot:#DAFFC7; --far:#2E7A4E; --deep:#00311E; --panel:#0d3b25;
  --amber:#FFC13C; --red:#DF2F2E; --bg:#050B08; --ink:#8FA99A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --pad:14px; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--accent);
  font-family:var(--mono);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:var(--mono);border:0;background:0 0;color:inherit}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;overflow:hidden}
#stage canvas,#stage video{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{z-index:1} #ov{z-index:2} #proc{display:none}
video{opacity:0;pointer-events:none;width:1px;height:1px}

/* ---------- смуга стану ---------- */
#top{display:flex;align-items:center;gap:7px;padding:9px var(--pad) 7px;flex-wrap:wrap}
.mark{font-size:15px;font-weight:800;letter-spacing:.13em;color:var(--hot);line-height:1.1}
.mark span{color:var(--accent);font-weight:400;font-size:11px;letter-spacing:.2em}
.mark i{display:block;font-style:normal;font-size:8px;letter-spacing:.15em;color:var(--ink);opacity:.6}
.chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.035);
  border:1px solid rgba(106,213,130,.16);border-radius:99px;padding:4px 9px;
  font-size:9.5px;letter-spacing:.09em;color:var(--ink);white-space:nowrap}
.chip b{color:var(--hot);font-weight:700}
.chip.lock b{color:var(--amber)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 6px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
#top .grow{margin-left:auto}

/* ---------- док ---------- */
#dock{padding:0 var(--pad) calc(var(--pad) + 2px)}
#tabs{display:flex;gap:5px;padding:8px 0 9px}
.tab{flex:1;padding:9px 0;border-radius:99px;font-size:10px;letter-spacing:.11em;
  color:var(--ink);background:rgba(255,255,255,.03);border:1px solid rgba(106,213,130,.14)}
.tab[aria-selected=true]{color:var(--hot);background:rgba(0,49,30,.72);border-color:rgba(106,213,130,.5)}
.grp{display:none;max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grp.on{display:block}
.row{display:grid;grid-template-columns:88px 1fr 44px;align-items:center;gap:10px;padding:5px 0}
.row label{font-size:10px;letter-spacing:.1em;color:var(--ink)}
.row output{font-size:10.5px;color:var(--hot);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:0 0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(106,213,130,.24)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(106,213,130,.55)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--accent)}
.pills{display:flex;gap:5px;flex-wrap:wrap;padding:3px 0 7px}
.tg,.pre,.md,.vb{padding:8px 12px;border-radius:99px;font-size:9.5px;letter-spacing:.1em;
  color:var(--ink);background:rgba(255,255,255,.03);border:1px solid rgba(106,213,130,.16)}
.tg.on,.md.on,.vb.on{color:var(--hot);background:rgba(0,49,30,.7);border-color:rgba(106,213,130,.5)}
.pre.hot{border-color:rgba(255,193,60,.45);color:var(--amber)}
.sect{font-size:8.5px;letter-spacing:.2em;color:var(--amber);padding:9px 0 2px;opacity:.85}

#act{display:flex;align-items:center;gap:10px;padding-top:5px}
#shoot{flex:1;height:54px;border-radius:99px;background:var(--accent);color:#03150c;
  font-size:12.5px;font-weight:700;letter-spacing:.13em;box-shadow:0 0 24px rgba(106,213,130,.28)}
#shoot.rec{background:var(--red);color:#fff;box-shadow:0 0 24px rgba(223,47,46,.38)}
.mini{width:54px;height:54px;border-radius:99px;background:rgba(255,255,255,.04);
  border:1px solid rgba(106,213,130,.2);font-size:15px;color:var(--ink)}
.mini.on{color:var(--hot);border-color:rgba(106,213,130,.55);background:rgba(0,49,30,.7)}

/* ---------- накладки ---------- */
#lockline{position:absolute;z-index:4;left:12px;right:12px;bottom:10px;font-size:10.5px;
  letter-spacing:.05em;color:var(--ink);text-shadow:0 0 10px #000;pointer-events:none;line-height:1.5}
#lockline em{color:var(--amber);font-style:normal}
#procp{position:absolute;z-index:6;left:12px;right:12px;top:12px;background:rgba(4,14,9,.97);
  border:1px solid rgba(106,213,130,.3);border-radius:var(--r);padding:14px 16px;display:none;
  max-height:80%;overflow-y:auto}
#procp.show{display:block}
#ptitle{font-size:9px;letter-spacing:.2em;color:var(--amber);margin-bottom:9px}
#plist{font-size:11px;line-height:1.9;color:var(--ink)}
#plist b{color:var(--hot)} #plist .ok{color:var(--accent)}
#plist .no{color:var(--red)} #plist .wt{color:var(--amber)}
#pbar{height:3px;background:rgba(106,213,130,.16);border-radius:2px;margin-top:10px;overflow:hidden}
#pfill{height:100%;width:0;background:var(--accent);transition:width .3s}
#diag{position:absolute;z-index:5;left:12px;right:12px;top:12px;background:rgba(4,14,9,.95);
  border:1px solid rgba(106,213,130,.28);border-radius:var(--r);padding:13px 15px;
  font-size:10.5px;line-height:1.75;color:var(--ink);display:none;max-height:80%;overflow-y:auto}
#diag.show{display:block}
#diag b{color:var(--hot)} #diag .bad{color:var(--red)}
#diag .good{color:var(--accent)} #diag .warn{color:var(--amber)}
#diag h4{margin:9px 0 3px;font-size:8.5px;letter-spacing:.2em;color:var(--amber);font-weight:600}
#diag h4:first-child{margin-top:0}

/* сумісність з рушієм: старі гачки лишаються, але не малюються */
#rail,#sheet,#grip,#rows,#vpbar,#vpmodes{display:none}

/* ---------- широкий екран ---------- */
@media (min-aspect-ratio:1/1) and (min-width:660px){
  #app{grid-template-rows:auto 1fr;grid-template-columns:1fr 310px}
  #top{grid-column:1/-1}
  #stage{grid-row:2;grid-column:1}
  #dock{grid-row:2;grid-column:2;overflow-y:auto;border-left:1px solid rgba(106,213,130,.14)}
  .grp{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
#boot h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.15em;color:var(--hot)}
#boot h1 span{color:var(--accent);font-weight:400;font-size:17px;letter-spacing:.24em}
#boot p{margin:0;max-width:340px;font-size:11.5px;line-height:1.9;color:var(--ink)}
#bldBoot{font-size:9.5px;letter-spacing:.18em;color:var(--amber)}
#go{background:var(--accent);color:#03150c;border-radius:99px;padding:15px 42px;font-size:13px;
  font-weight:700;letter-spacing:.14em;box-shadow:0 0 30px rgba(106,213,130,.34)}
#boot.hide{display:none}
#err{color:var(--red);font-size:10.5px;max-width:320px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="mark">DICH <span>//EDGE</span><i id="bld"></i></div>
    <div class="chip grow"><i class="dot"></i>LIVE</div>
    <div class="chip"><b id="cFps">0</b>FPS</div>
    <div class="chip lock"><b id="cKf">0</b>КАРКАС</div>
    <div class="chip lock"><b id="cMem">0</b>ПАМʼЯТЬ</div>
    <div class="chip"><b id="cDrift">0</b>ДРЕЙФ</div>
    <div class="chip lock"><b id="cP3">0</b>3D</div>
    <div class="chip"><b id="cPar">0</b>° ПАРАЛАКС</div>
    <div class="chip"><b id="c3d">0</b>% ГЛИБ</div>
    <div class="chip"><b id="cMs">0</b>MS</div>
  </div>

  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <canvas id="proc"></canvas>
    <div id="lockline">Фіксація спить</div>
    <div id="procp"><div id="ptitle">ОБРОБКА</div><div id="plist"></div>
      <div id="pbar"><div id="pfill"></div></div></div>
    <div id="diag"></div>
  </div>

  <div id="dock">
    <div id="tabs" role="tablist">
      <button class="tab" role="tab" data-t="frame" aria-selected="true">КАДР</button>
      <button class="tab" role="tab" data-t="lock" aria-selected="false">ФІКСАЦІЯ</button>
      <button class="tab" role="tab" data-t="scan" aria-selected="false">3D</button>
      <button class="tab" role="tab" data-t="model" aria-selected="false">МОДЕЛЬ</button>

    <div class="grp on" data-g="frame">

      <div id="rowsFrame"></div>
      <div class="pills">
        <button class="tg on" data-tg="nms">NMS</button>
        <button class="tg on" data-tg="hyst">ГІСТЕРЕЗИС</button>
        <button class="tg" data-tg="dbg">СИРА МАСКА</button>

      </div>
    </div>

    <div class="grp" data-g="lock">
      <div id="rowsLock"></div>
      <div class="pills">
        <button class="tg on" data-tg="lock">ФІКСАЦІЯ</button>
        <button class="tg on" data-tg="memory">ПАМʼЯТЬ</button>
        <button class="tg on" data-tg="verts">ВЕРШИНИ</button>
        <button class="tg" data-tg="rigid">ЖОРСТКІСТЬ</button>

        <button class="tg" id="bGyro">◎ ГІРО</button>

        <button class="tg on" data-tg="icp">ICP</button>
      </div>
      <div id="rowsScan"></div>
    </div>

    <div class="grp" data-g="model">
      <div class="pills">
        <button class="md" data-d="points">ТОЧКИ</button>
        <button class="md on" data-d="mesh">ПОВЕРХНЯ</button>
        <button class="vb on" id="vbLine">КАРКАС</button>
      </div>
      <div class="sect" id="vpinfo">модель ще не знята</div>
      <div class="pills">
        <button class="vb" id="vbExp">↧ OBJ</button>
        <button class="vb" id="vbNew">↺ НОВИЙ СКАН</button>
        <button class="vb" id="vbClose">✕ ЗАКРИТИ</button>
      </div>
    </div>

    <div id="act">
      <button class="mini" id="bCam">⟳</button>
      <button id="shoot">⚡ КАДР</button>
      <button class="mini" id="bDiag">?</button>

</div>

<!-- гачки, яких чекає рушій; не малюються -->
<div id="rail"></div>
<div id="sheet"><div id="grip"><span id="gripHint"></span></div><div id="rows"></div></div>
<div id="vpbar"></div><div id="vpmodes"></div>
<button id="bRec" style="display:none"></button>
<button id="bShot" style="display:none"></button>
<button id="pClose" style="display:none"></button>

<div id="boot">
  <h1>DICH <span>//EDGE</span></h1>
  <div id="bldBoot"></div>
  <p>Контури залипають на об'єкті й лягають у світову памʼять. Далі — щільна
     глибина з мережі, зшита з розрідженими точками.</p>
  <button id="go">ПУСК</button>
  <div id="err"></div>
</div>

<script>
'use strict';

/* ============================================================
   ПАРАМЕТРИ
   ============================================================ */
const BUILD = 'H5 · цілий файл';
const P = {
  /* детектор */
  gain:      3.4,
  radius:    14,
  levels:    4,
  tHigh:     0.19,
  tLow:      0.07,
  preblur:   1,
  temporal:  0.35,
  minLen:    16,
  res:       200,
  /* фіксація */
  inertia:   0.22,   // EMA α у фокусі
  mem:       14,     // maxMiss у фокусі, кадрів
  weld:      4,      // радіус зварки, proc px
  extrude:   9,      // об'єм
  /* памʼять */
  world:     6,      // межа світу в діагоналях кадру
  /* 3D */
  hfov:      62,     // горизонтальне поле зору камери, градуси
  dstep:     2,      // проріджування карти глибини
  icp:       true,   // суміщення хмар перед злиттям
  dcut:      0.06,   // поріг розриву глибини для граней
  parallax:  4.0,    // мінімальний кут паралакса для тріангуляції, градуси
  smooth:    1.0,    // пріор гладкості траєкторії камери (виміряно на 4 сідах)
  /* тумблери */
  lock:  true,  verts: true,  rigid:  false,   // виміряно: у світовій системі шкодить
  memory:true,  arrows: true,  tri: false,  ring: false,
  nms:   true,  hyst:  true,  flow:  false,  dbg: false,
  showBase: 1,  boxes: false
};

const ROWS = [
  { t:'frame', k:'gain',    l:'КОНТРАСТ',  min:1,    max:8,    st:0.1  },
  { t:'frame', k:'radius',  l:'РАДІУС',    min:3,    max:40,   st:1    },
  { t:'frame', k:'levels',  l:'РІВНІ',     min:2,    max:8,    st:1    },
  { t:'frame', k:'tHigh',   l:'ПОРІГ ▲',   min:0.04, max:0.6,  st:0.01 },
  { t:'frame', k:'tLow',    l:'ПОРІГ ▼',   min:0.01, max:0.3,  st:0.01 },
  { t:'frame', k:'preblur', l:'РОЗМИТТЯ',  min:0,    max:3,    st:1    },
  { t:'frame', k:'temporal',l:'ЧАС',       min:0,    max:0.85, st:0.05 },
  { t:'frame', k:'minLen',  l:'МІН ДОВЖ',  min:4,    max:60,   st:1    },
  { t:'frame', k:'res',     l:'РОЗДІЛ',    min:120,  max:320,  st:20   },
  { t:'lock', k:'inertia', l:'ІНЕРЦІЯ',   min:0.05, max:0.60, st:0.01 },
  { t:'lock', k:'mem',     l:'ПАМʼЯТЬ',   min:2,    max:30,   st:1    },
  { t:'lock', k:'weld',    l:'ЗВАРКА',    min:2,    max:12,   st:1    },
  { t:'lock', k:'extrude', l:'ОБʼЄМ',     min:0,    max:20,   st:1    },
  { t:'lock', k:'world',   l:'СВІТ',      min:2,    max:12,   st:1    },
  { t:'scan', k:'hfov',    l:'ПОЛЕ ЗОРУ', min:40,   max:90,   st:1    },
  { t:'scan', k:'parallax',l:'ПАРАЛАКС',  min:0.5,  max:8,    st:0.1  },
  { t:'scan', k:'smooth',  l:'ГЛАДКІСТЬ', min:0,    max:4,    st:0.1  },
  { t:'scan', k:'dstep',   l:'ЩІЛЬНІСТЬ', min:1,    max:6,    st:1    },
  { t:'scan', k:'dcut',    l:'РОЗРИВ',    min:0.01, max:0.4,  st:0.01 }
];

const PRESETS = {
  max:    { gain:5.2, radius:10, levels:3, tHigh:0.14, tLow:0.05, preblur:0, temporal:0.30, minLen:12 },
  clean:  { gain:3.0, radius:16, levels:4, tHigh:0.22, tLow:0.09, preblur:1, temporal:0.45, minLen:22 },
  wire:   { gain:3.8, radius:22, levels:2, tHigh:0.26, tLow:0.10, preblur:2, temporal:0.55, minLen:30 },
  soft:   { gain:2.2, radius:20, levels:5, tHigh:0.16, tLow:0.06, preblur:2, temporal:0.60, minLen:18 },
  wire3d: { gain:3.0, radius:16, levels:4, tHigh:0.22, tLow:0.09, preblur:1, temporal:0.45, minLen:22,
            lock:true, mem:20, rigid:false, verts:true, extrude:12, inertia:0.10, weld:3,
            memory:true, arrows:true, world:6 }
};

/* ============================================================
   DOM
   ============================================================ */
const vid  = document.getElementById('v');
const glc  = document.getElementById('gl');
const ovc  = document.getElementById('ov');
const prc  = document.getElementById('proc');
const octx = ovc.getContext('2d');
const pctx = prc.getContext('2d', { willReadFrequently:true });

let facing = 'environment';
let running = false;
let stream = null;

/* ============================================================
   WEBGL — постеризована база
   ============================================================ */
const VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = vec2((aPos.x + 1.0) * 0.5, 1.0 - (aPos.y + 1.0) * 0.5);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FS = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2  uTexel;
uniform vec2  uScale;
uniform float uGain;
uniform float uRadius;
uniform float uLevels;
uniform float uShow;
uniform float uMirror;

float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

void main(){
  vec2 uv = (vUv - 0.5) * uScale + 0.5;
  if (uMirror > 0.5) uv.x = 1.0 - uv.x;
  float l = lum(texture2D(uTex, uv).rgb);
  float mean = 0.0;
  for (int i = 0; i < 16; i++){
    float fi  = float(i);
    float ang = fi * 2.39996;
    float rad = sqrt((fi + 0.5) / 16.0) * uRadius;
    vec2  o   = vec2(cos(ang), sin(ang)) * rad * uTexel;
    mean += lum(texture2D(uTex, clamp(uv + o, vec2(0.001), vec2(0.999))).rgb);
  }
  mean /= 16.0;
  float n = clamp(0.5 + (l - mean) * uGain, 0.0, 1.0);
  float q = floor(n * uLevels) / max(uLevels - 1.0, 1.0);
  q = clamp(q, 0.0, 1.0);
  vec3 col = mix(vec3(0.012, 0.034, 0.023), vec3(0.145, 0.40, 0.245), q);
  gl_FragColor = vec4(col * uShow, 1.0);
}`;

let gl = null, prog = null, tex = null, U = {};

function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}

function initGL(){
  gl = glc.getContext('webgl', { antialias:false, preserveDrawingBuffer:true, alpha:false })
    || glc.getContext('experimental-webgl', { antialias:false, preserveDrawingBuffer:true });
  if (!gl) throw new Error('WebGL не завівся');

  prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error('link: ' + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  ['uTex','uTexel','uScale','uGain','uRadius','uLevels','uShow','uMirror']
    .forEach(n => { U[n] = gl.getUniformLocation(prog, n); });

  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.uniform1i(U.uTex, 0);
}

/* ============================================================
   КАМЕРА / РОЗМІРИ
   ============================================================ */
async function startCam(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:facing, width:{ ideal:1280 }, height:{ ideal:720 } }
  });
  vid.srcObject = stream;
  await vid.play().catch(() => {});
  await new Promise(res => {
    if (vid.videoWidth) return res();
    vid.onloadedmetadata = () => res();
  });
}

/* «cover»: який прямокутник відео лізе в кадр */
function cover(vw, vh, cw, ch){
  const cr = cw / ch;
  let sw, sh;
  if (vw / vh > cr) { sh = vh; sw = vh * cr; }
  else              { sw = vw; sh = vw / cr; }
  return { sx:(vw - sw) / 2, sy:(vh - sh) / 2, sw, sh };
}

let pw = 0, ph = 0;   // proc розміри
let B  = null;        // буфери

function allocBuffers(w, h){
  const n = w * h;
  B = {
    n, gray:new Float32Array(n), integ:new Float64Array((w + 1) * (h + 1)),
    norm:new Float32Array(n), normS:new Float32Array(n),
    bl:new Float32Array(n), tm:new Float32Array(n),
    mag:new Float32Array(n), gx:new Float32Array(n), gy:new Float32Array(n),
    sup:new Float32Array(n), edge:new Uint8Array(n),
    deg:new Uint8Array(n), seen:new Uint8Array(n),
    stack:new Int32Array(n),
    pyrA:makePyr(w, h), pyrB:makePyr(w, h)
  };
  B.normSeeded = false;
  pyrCur = B.pyrA; pyrPrev = B.pyrB;
  resetTracks();
}

function makePyr(w, h){
  const lv = [];
  let cw = w, chh = h;
  for (let l = 0; l < 3; l++){
    lv.push({ w:cw, h:chh,
      I:new Float32Array(cw * chh),
      gx:new Float32Array(cw * chh),
      gy:new Float32Array(cw * chh) });
    cw = Math.max(8, cw >> 1); chh = Math.max(8, chh >> 1);
  }
  return lv;
}

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = window.innerWidth, ch = window.innerHeight;

  glc.width  = Math.round(cw * dpr); glc.height = Math.round(ch * dpr);
  ovc.width  = Math.round(cw * dpr); ovc.height = Math.round(ch * dpr);
  if (gl) gl.viewport(0, 0, glc.width, glc.height);

  const nw = Math.round(P.res);
  const nh = Math.max(60, Math.round(nw * ch / cw));
  if (nw !== pw || nh !== ph){
    pw = nw; ph = nh;
    prc.width = pw; prc.height = ph;
    allocBuffers(pw, ph);
  }
}

/* ============================================================
   ДЕТЕКТОР
   ============================================================ */
function grabGray(){
  if (!vid.videoWidth) return false;
  const c = cover(vid.videoWidth, vid.videoHeight, pw, ph);
  pctx.save();
  if (facing === 'user'){ pctx.translate(pw, 0); pctx.scale(-1, 1); }
  pctx.drawImage(vid, c.sx, c.sy, c.sw, c.sh, 0, 0, pw, ph);
  pctx.restore();
  const d = pctx.getImageData(0, 0, pw, ph).data;
  const g = B.gray;
  for (let i = 0, j = 0; i < B.n; i++, j += 4)
    g[i] = (d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114) / 255;
  return true;
}

/* локальне середнє через інтегральне зображення — O(n) незалежно від радіуса */
function localMean(src, dst, r){
  const I = B.integ, W = pw + 1;
  for (let x = 0; x <= pw; x++) I[x] = 0;
  for (let y = 0; y < ph; y++){
    let run = 0;
    const ro = y * pw, io = (y + 1) * W;
    I[io] = 0;
    for (let x = 0; x < pw; x++){
      run += src[ro + x];
      I[io + x + 1] = I[io - W + x + 1] + run;
    }
  }
  for (let y = 0; y < ph; y++){
    const y0 = Math.max(0, y - r), y1 = Math.min(ph - 1, y + r);
    const a = y0 * W, b = (y1 + 1) * W, ro = y * pw;
    for (let x = 0; x < pw; x++){
      const x0 = Math.max(0, x - r), x1 = Math.min(pw - 1, x + r);
      const area = (x1 - x0 + 1) * (y1 - y0 + 1);
      dst[ro + x] = (I[b + x1 + 1] - I[b + x0] - I[a + x1 + 1] + I[a + x0]) / area;
    }
  }
}

function normalize(){
  localMean(B.gray, B.bl, Math.round(P.radius));
  const g = B.gray, m = B.bl, o = B.norm, k = P.gain;
  for (let i = 0; i < B.n; i++){
    let v = 0.5 + (g[i] - m[i]) * k;
    o[i] = v < 0 ? 0 : v > 1 ? 1 : v;
  }
  const s = B.normS, t = P.temporal;
  if (!B.normSeeded){ s.set(o); B.normSeeded = true; }
  else for (let i = 0; i < B.n; i++) s[i] = s[i] * t + o[i] * (1 - t);
}

function box3(src, dst){
  for (let y = 0; y < ph; y++){
    const ro = y * pw;
    for (let x = 0; x < pw; x++){
      const xm = x > 0 ? x - 1 : 0, xp = x < pw - 1 ? x + 1 : pw - 1;
      dst[ro + x] = (src[ro + xm] + src[ro + x] + src[ro + xp]) / 3;
    }
  }
  for (let x = 0; x < pw; x++){
    for (let y = 0; y < ph; y++){
      const ym = y > 0 ? y - 1 : 0, yp = y < ph - 1 ? y + 1 : ph - 1;
      B.tm[y * pw + x] = (dst[ym * pw + x] + dst[y * pw + x] + dst[yp * pw + x]) / 3;
    }
  }
  dst.set(B.tm);
}

function scharr(src){
  const gx = B.gx, gy = B.gy, mg = B.mag;
  gx.fill(0); gy.fill(0); mg.fill(0);
  for (let y = 1; y < ph - 1; y++){
    const r0 = (y - 1) * pw, r1 = y * pw, r2 = (y + 1) * pw;
    for (let x = 1; x < pw - 1; x++){
      const a = src[r0 + x - 1], b = src[r0 + x], c = src[r0 + x + 1];
      const d = src[r1 + x - 1],                 f = src[r1 + x + 1];
      const g = src[r2 + x - 1], h = src[r2 + x], i = src[r2 + x + 1];
      const sx = (-3 * a + 3 * c - 10 * d + 10 * f - 3 * g + 3 * i) / 32;
      const sy = (-3 * a - 10 * b - 3 * c + 3 * g + 10 * h + 3 * i) / 32;
      const k = r1 + x;
      gx[k] = sx; gy[k] = sy;
      mg[k] = Math.sqrt(sx * sx + sy * sy);
    }
  }
}

function suppress(){
  const mg = B.mag, gx = B.gx, gy = B.gy, o = B.sup;
  if (!P.nms){ o.set(mg); return; }
  o.fill(0);
  for (let y = 1; y < ph - 1; y++){
    for (let x = 1; x < pw - 1; x++){
      const k = y * pw + x, m = mg[k];
      if (m < 1e-4) continue;
      const ax = Math.abs(gx[k]), ay = Math.abs(gy[k]);
      let d1, d2;
      if (ax > 2.414 * ay)      { d1 = 1;       d2 = -1; }
      else if (ay > 2.414 * ax) { d1 = pw;      d2 = -pw; }
      else if (gx[k] * gy[k] > 0){ d1 = pw + 1; d2 = -pw - 1; }
      else                      { d1 = pw - 1;  d2 = -pw + 1; }
      if (m >= mg[k + d1] && m >= mg[k + d2]) o[k] = m;
    }
  }
}

function hysteresis(){
  const s = B.sup, e = B.edge, st = B.stack;
  e.fill(0);
  const hi = P.tHigh, lo = P.hyst ? P.tLow : P.tHigh;
  let sp = 0;
  for (let i = 0; i < B.n; i++) if (s[i] >= hi){ e[i] = 1; st[sp++] = i; }
  if (!P.hyst) return;
  const nb = [1, -1, pw, -pw, pw + 1, pw - 1, -pw + 1, -pw - 1];
  while (sp > 0){
    const k = st[--sp];
    const x = k % pw, y = (k - x) / pw;
    if (x < 1 || y < 1 || x > pw - 2 || y > ph - 2) continue;
    for (let d = 0; d < 8; d++){
      const j = k + nb[d];
      if (!e[j] && s[j] >= lo){ e[j] = 1; if (sp < B.n) st[sp++] = j; }
    }
  }
}

/* ---- трасування контурів → відрізки ---- */
const SEG = { x0:null, y0:null, x1:null, y1:null, mx:null, my:null, an:null, ln:null, cnt:0, cap:0 };
function segCap(c){
  if (SEG.cap >= c) return;
  SEG.cap = c;
  SEG.x0 = new Float32Array(c); SEG.y0 = new Float32Array(c);
  SEG.x1 = new Float32Array(c); SEG.y1 = new Float32Array(c);
  SEG.mx = new Float32Array(c); SEG.my = new Float32Array(c);
  SEG.an = new Float32Array(c); SEG.ln = new Float32Array(c);
}
segCap(1400);

const polyX = new Float32Array(4096), polyY = new Float32Array(4096);
const simpX = new Float32Array(4096), simpY = new Float32Array(4096);
const rdpStack = new Int32Array(4096);
const rdpKeep  = new Uint8Array(4096);

function rdp(np, eps){
  if (np < 3){ for (let i = 0; i < np; i++){ simpX[i] = polyX[i]; simpY[i] = polyY[i]; } return np; }
  const keep = rdpKeep;
  keep.fill(0, 0, np);
  keep[0] = 1; keep[np - 1] = 1;
  let sp = 0;
  rdpStack[sp++] = 0; rdpStack[sp++] = np - 1;
  const e2 = eps * eps;
  while (sp > 0){
    const b = rdpStack[--sp], a = rdpStack[--sp];
    if (b - a < 2) continue;
    const ax = polyX[a], ay = polyY[a], bx = polyX[b], by = polyY[b];
    const dx = bx - ax, dy = by - ay;
    const dd = dx * dx + dy * dy;
    let best = -1, bd = -1;
    for (let i = a + 1; i < b; i++){
      const px = polyX[i] - ax, py = polyY[i] - ay;
      let t = dd > 1e-9 ? (px * dx + py * dy) / dd : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const ex = px - dx * t, ey = py - dy * t;
      const d2 = ex * ex + ey * ey;
      if (d2 > bd){ bd = d2; best = i; }
    }
    if (bd > e2 && best > 0){
      keep[best] = 1;
      rdpStack[sp++] = a; rdpStack[sp++] = best;
      rdpStack[sp++] = best; rdpStack[sp++] = b;
    }
  }
  let m = 0;
  for (let i = 0; i < np; i++) if (keep[i]){ simpX[m] = polyX[i]; simpY[m] = polyY[i]; m++; }
  return m;
}

function pushSeg(x0, y0, x1, y1){
  if (SEG.cnt >= SEG.cap) return;
  const dx = x1 - x0, dy = y1 - y0;
  const L = Math.sqrt(dx * dx + dy * dy);
  if (L < 3.5) return;
  const i = SEG.cnt++;
  SEG.x0[i] = x0; SEG.y0[i] = y0; SEG.x1[i] = x1; SEG.y1[i] = y1;
  SEG.mx[i] = (x0 + x1) * 0.5; SEG.my[i] = (y0 + y1) * 0.5;
  SEG.an[i] = Math.atan2(dy, dx); SEG.ln[i] = L;
}

function traceContours(){
  SEG.cnt = 0;
  const e = B.edge, deg = B.deg, seen = B.seen;
  seen.fill(0);
  const nb = [1, -1, pw, -pw, pw + 1, -pw - 1, pw - 1, -pw + 1];

  for (let y = 1; y < ph - 1; y++){
    for (let x = 1; x < pw - 1; x++){
      const k = y * pw + x;
      if (!e[k]){ deg[k] = 0; continue; }
      let c = 0;
      for (let d = 0; d < 8; d++) if (e[k + nb[d]]) c++;
      deg[k] = c;
    }
  }

  const walk = (start) => {
    let np = 0, k = start;
    while (np < 4090){
      const x = k % pw, y = (k - x) / pw;
      polyX[np] = x; polyY[np] = y; np++;
      seen[k] = 1;
      let nx = -1;
      for (let d = 0; d < 8; d++){
        const j = k + nb[d];
        if (j < 0 || j >= B.n) continue;
        if (e[j] && !seen[j]){ nx = j; if (d < 4) break; }
      }
      if (nx < 0) break;
      k = nx;
    }
    if (np < 2) return;
    let L = 0;
    for (let i = 1; i < np; i++)
      L += Math.hypot(polyX[i] - polyX[i - 1], polyY[i] - polyY[i - 1]);
    if (L < P.minLen) return;
    const m = rdp(np, 1.25);
    for (let i = 1; i < m; i++) pushSeg(simpX[i - 1], simpY[i - 1], simpX[i], simpY[i]);
  };

  for (let y = 1; y < ph - 1; y++)
    for (let x = 1; x < pw - 1; x++){
      const k = y * pw + x;
      if (e[k] && !seen[k] && deg[k] === 1) walk(k);
    }
  for (let y = 1; y < ph - 1; y++)
    for (let x = 1; x < pw - 1; x++){
      const k = y * pw + x;
      if (e[k] && !seen[k]) walk(k);
    }
}

/* ============================================================
   ШАР A — КОМПЕНСАЦІЯ РУХУ КАМЕРИ (LK + RANSAC similarity)
   ============================================================ */
let pyrCur = null, pyrPrev = null, pyrReady = false;

function buildPyr(pyr, src){
  const L0 = pyr[0];
  L0.I.set(src);
  for (let l = 1; l < pyr.length; l++){
    const a = pyr[l - 1], b = pyr[l];
    for (let y = 0; y < b.h; y++){
      const sy = Math.min(a.h - 1, y * 2), sy1 = Math.min(a.h - 1, y * 2 + 1);
      for (let x = 0; x < b.w; x++){
        const sx = Math.min(a.w - 1, x * 2), sx1 = Math.min(a.w - 1, x * 2 + 1);
        b.I[y * b.w + x] = (a.I[sy * a.w + sx] + a.I[sy * a.w + sx1] +
                            a.I[sy1 * a.w + sx] + a.I[sy1 * a.w + sx1]) * 0.25;
      }
    }
  }
  for (let l = 0; l < pyr.length; l++){
    const p = pyr[l], w = p.w, h = p.h, I = p.I;
    p.gx.fill(0); p.gy.fill(0);
    for (let y = 1; y < h - 1; y++)
      for (let x = 1; x < w - 1; x++){
        const k = y * w + x;
        p.gx[k] = (I[k + 1] - I[k - 1]) * 0.5;
        p.gy[k] = (I[k + w] - I[k - w]) * 0.5;
      }
  }
}

function samp(a, w, h, x, y){
  if (x < 0) x = 0; if (y < 0) y = 0;
  if (x > w - 1.001) x = w - 1.001;
  if (y > h - 1.001) y = h - 1.001;
  const x0 = x | 0, y0 = y | 0;
  const fx = x - x0, fy = y - y0;
  const k = y0 * w + x0;
  const a0 = a[k], a1 = a[k + 1], a2 = a[k + w], a3 = a[k + w + 1];
  return a0 + (a1 - a0) * fx + (a2 - a0) * fy + (a0 - a1 - a2 + a3) * fx * fy;
}

/* сідований PRNG — щоб RANSAC був відтворюваний */
let rngState = 0x9E3779B9 >>> 0;
function rnd(){
  let x = rngState;
  x ^= x << 13; x >>>= 0;
  x ^= x >>> 17;
  x ^= x << 5;  x >>>= 0;
  rngState = x;
  return x / 4294967296;
}

const FLOW = { x:new Float32Array(300), y:new Float32Array(300),
               u:new Float32Array(300), v:new Float32Array(300),
               ok:new Uint8Array(300), inl:new Uint8Array(300), cnt:0 };
let flowBudget = 110;

function pickPoints(){
  const p = pyrPrev[0], w = p.w, h = p.h, gx = p.gx, gy = p.gy;
  const gcx = 16, gcy = 12;
  const cw = Math.floor((w - 24) / gcx), ch = Math.floor((h - 24) / gcy);
  if (cw < 3 || ch < 3){ FLOW.cnt = 0; return; }
  const cand = [];
  for (let cy = 0; cy < gcy; cy++)
    for (let cx = 0; cx < gcx; cx++){
      let bs = 0, bx = -1, by = -1;
      const x0 = 12 + cx * cw, y0 = 12 + cy * ch;
      for (let y = y0; y < y0 + ch; y += 3)
        for (let x = x0; x < x0 + cw; x += 3){
          let sxx = 0, syy = 0, sxy = 0;
          for (let j = -1; j <= 1; j++)
            for (let i = -1; i <= 1; i++){
              const k = (y + j) * w + (x + i);
              const a = gx[k], b = gy[k];
              sxx += a * a; syy += b * b; sxy += a * b;
            }
          const tr = sxx + syy, dt = sxx * syy - sxy * sxy;
          const disc = Math.max(0, tr * tr * 0.25 - dt);
          const lam = tr * 0.5 - Math.sqrt(disc);
          if (lam > bs){ bs = lam; bx = x; by = y; }
        }
      if (bx >= 0 && bs > 1.4e-4) cand.push({ s:bs, x:bx, y:by });
    }
  cand.sort((a, b) => b.s - a.s);
  const n = Math.min(flowBudget, cand.length, FLOW.x.length);
  for (let i = 0; i < n; i++){ FLOW.x[i] = cand[i].x; FLOW.y[i] = cand[i].y; }
  FLOW.cnt = n;
}

const tI = new Float32Array(49), tGx = new Float32Array(49), tGy = new Float32Array(49);

function lkTrack(){
  const nl = pyrPrev.length;
  for (let i = 0; i < FLOW.cnt; i++){
    let u = 0, v = 0, ok = 1;
    for (let l = nl - 1; l >= 0; l--){
      const pp = pyrPrev[l], pc = pyrCur[l];
      const sc = 1 / (1 << l);
      const tx = FLOW.x[i] * sc, ty = FLOW.y[i] * sc;
      if (tx < 4 || ty < 4 || tx > pp.w - 5 || ty > pp.h - 5){ if (l === 0) ok = 0; continue; }
      let sxx = 0, syy = 0, sxy = 0, m = 0;
      for (let j = -3; j <= 3; j++)
        for (let k = -3; k <= 3; k++, m++){
          const X = tx + k, Y = ty + j;
          tI[m]  = samp(pp.I,  pp.w, pp.h, X, Y);
          const a = samp(pp.gx, pp.w, pp.h, X, Y);
          const b = samp(pp.gy, pp.w, pp.h, X, Y);
          tGx[m] = a; tGy[m] = b;
          sxx += a * a; syy += b * b; sxy += a * b;
        }
      const det = sxx * syy - sxy * sxy;
      if (Math.abs(det) < 1e-7){ if (l === 0) ok = 0; continue; }
      const i00 =  syy / det, i01 = -sxy / det, i11 =  sxx / det;
      for (let it = 0; it < 4; it++){
        let bx = 0, by = 0; m = 0;
        for (let j = -3; j <= 3; j++)
          for (let k = -3; k <= 3; k++, m++){
            const d = tI[m] - samp(pc.I, pc.w, pc.h, tx + u + k, ty + v + j);
            bx += tGx[m] * d; by += tGy[m] * d;
          }
        const du = i00 * bx + i01 * by, dv = i01 * bx + i11 * by;
        u += du; v += dv;
        if (du * du + dv * dv < 9e-4) break;
        if (Math.abs(u) > 40 || Math.abs(v) > 40){ ok = 0; break; }
      }
      if (l > 0){ u *= 2; v *= 2; }
    }
    FLOW.u[i] = u; FLOW.v[i] = v; FLOW.ok[i] = ok;
  }
}

const M = { ax:1, ay:0, bx:0, by:0 };
let inlierRatio = 0, transMag = 0, transDX = 0, transDY = 0, gmeLost = true;

function fitSimilarity(){
  const idx = [];
  for (let i = 0; i < FLOW.cnt; i++) if (FLOW.ok[i]) idx.push(i);
  FLOW.inl.fill(0);
  M.ax = 1; M.ay = 0; M.bx = 0; M.by = 0;
  inlierRatio = 0; transMag = 0; gmeLost = true;
  if (idx.length < 8) return;

  let bestCnt = 0, bA = 1, bB = 0, bC = 0, bD = 0;
  for (let it = 0; it < 40; it++){
    const p = idx[(rnd() * idx.length) | 0], q = idx[(rnd() * idx.length) | 0];
    if (p === q) continue;
    const z1x = FLOW.x[p], z1y = FLOW.y[p], z2x = FLOW.x[q], z2y = FLOW.y[q];
    const w1x = z1x + FLOW.u[p], w1y = z1y + FLOW.v[p];
    const w2x = z2x + FLOW.u[q], w2y = z2y + FLOW.v[q];
    const dzx = z2x - z1x, dzy = z2y - z1y;
    const dn = dzx * dzx + dzy * dzy;
    if (dn < 64) continue;
    const dwx = w2x - w1x, dwy = w2y - w1y;
    const ax = (dwx * dzx + dwy * dzy) / dn;
    const ay = (dwy * dzx - dwx * dzy) / dn;
    if (!isFinite(ax) || !isFinite(ay)) continue;
    const s = Math.hypot(ax, ay);
    if (s < 0.75 || s > 1.35) continue;
    const bx = w1x - (ax * z1x - ay * z1y);
    const by = w1y - (ay * z1x + ax * z1y);
    let c = 0;
    for (let n = 0; n < idx.length; n++){
      const j = idx[n];
      const px = ax * FLOW.x[j] - ay * FLOW.y[j] + bx;
      const py = ay * FLOW.x[j] + ax * FLOW.y[j] + by;
      const ex = px - (FLOW.x[j] + FLOW.u[j]);
      const ey = py - (FLOW.y[j] + FLOW.v[j]);
      if (ex * ex + ey * ey < 1.44) c++;
    }
    if (c > bestCnt){ bestCnt = c; bA = ax; bB = ay; bC = bx; bD = by; }
  }

  inlierRatio = bestCnt / idx.length;
  if (inlierRatio < 0.25 || bestCnt < 6) return;

  /* перефіт МНК на інлаєрах */
  let cnt = 0, mzx = 0, mzy = 0, mwx = 0, mwy = 0;
  for (let n = 0; n < idx.length; n++){
    const j = idx[n];
    const px = bA * FLOW.x[j] - bB * FLOW.y[j] + bC;
    const py = bB * FLOW.x[j] + bA * FLOW.y[j] + bD;
    const wx = FLOW.x[j] + FLOW.u[j], wy = FLOW.y[j] + FLOW.v[j];
    if ((px - wx) ** 2 + (py - wy) ** 2 < 1.44){
      FLOW.inl[j] = 1;
      mzx += FLOW.x[j]; mzy += FLOW.y[j]; mwx += wx; mwy += wy; cnt++;
    }
  }
  if (cnt < 6) return;
  mzx /= cnt; mzy /= cnt; mwx /= cnt; mwy /= cnt;
  let num_r = 0, num_i = 0, den = 0, fx = 0, fy = 0;
  for (let j = 0; j < FLOW.cnt; j++){
    if (!FLOW.inl[j]) continue;
    const zx = FLOW.x[j] - mzx, zy = FLOW.y[j] - mzy;
    const wx = FLOW.x[j] + FLOW.u[j] - mwx, wy = FLOW.y[j] + FLOW.v[j] - mwy;
    num_r += wx * zx + wy * zy;
    num_i += wy * zx - wx * zy;
    den   += zx * zx + zy * zy;
    fx += FLOW.u[j]; fy += FLOW.v[j];
  }
  if (den < 1e-6) return;
  const ax = num_r / den, ay = num_i / den;
  const s = Math.hypot(ax, ay);
  if (!isFinite(s) || s < 0.7 || s > 1.4) return;
  M.ax = ax; M.ay = ay;
  M.bx = mwx - (ax * mzx - ay * mzy);
  M.by = mwy - (ay * mzx + ax * mzy);
  fx /= cnt; fy /= cnt;
  transDX = fx; transDY = fy;
  transMag = Math.hypot(fx, fy);
  gmeLost = false;
}

/* ============================================================
   ШАР B — СВІТОВА ПАМʼЯТЬ: ГРАФ У СВІТОВИХ КООРДИНАТАХ
   ============================================================
   Вершини живуть у СВІТОВИХ координатах, не в координатах кадру.
   W — similarity світ→кадр, накопичується з покадрових M.
   Кластер, що систематично не згоден зі світом, отримує власну
   поправку L і відвʼязується (гібридна топологія).
   Поза кадром треки дормантні: не набирають miss, живуть до ресету.
   ============================================================ */

const MAXV = 2600, MAXE = 3600, MAXC = 24;

let VX, VY, VD, VDw, VConf, VMiss, VPin, VAlive, VCl, VUid, vCnt;
let uidNext = 1;
let PX, PY;                                   // проєкція вершин у кадр
let EA, EB, EConf, EMiss, EAge, ELen, EAlive, eCnt;
let EMx, EMy, EAng, ECur, EVis, EWas, EGrace, EHit;
let vFree, vFreeN = 0, eFree, eFreeN = 0;
let clCount = 0;
let uf, clSize, clRoots;
const ageHist = new Int32Array(64);

/* світовий трансформ: p_кадр = W · p_світ */
let Wax = 1, Way = 0, Wbx = 0, Wby = 0;
let driftRes = 0, memTotal = 0, memOff = 0, memVis = 0, evicted = 0, rebases = 0;
let frameNo = 0;

function resetTracks(){
  VX = new Float32Array(MAXV); VY = new Float32Array(MAXV);
  PX = new Float32Array(MAXV); PY = new Float32Array(MAXV);
  VD = new Float32Array(MAXV); VDw = new Float32Array(MAXV);
  VConf = new Int16Array(MAXV); VMiss = new Int16Array(MAXV);
  VPin = new Int16Array(MAXV); VAlive = new Uint8Array(MAXV);
  VCl = new Int16Array(MAXV); VCl.fill(-1);
  VUid = new Int32Array(MAXV);
  uidNext = 1;
  EA = new Int32Array(MAXE); EB = new Int32Array(MAXE);
  EConf = new Int16Array(MAXE); EMiss = new Int16Array(MAXE);
  EAge = new Int32Array(MAXE); ELen = new Float32Array(MAXE);
  EAlive = new Uint8Array(MAXE);
  EMx = new Float32Array(MAXE); EMy = new Float32Array(MAXE);
  EAng = new Float32Array(MAXE); ECur = new Float32Array(MAXE);
  EVis = new Uint8Array(MAXE); EWas = new Uint8Array(MAXE);
  EGrace = new Int16Array(MAXE); EHit = new Uint8Array(MAXE);
  vFree = new Int32Array(MAXV); eFree = new Int32Array(MAXE);
  uf = new Int32Array(MAXV); clSize = new Int32Array(MAXV);
  clRoots = new Int32Array(MAXV);
  vFreeN = 0; eFreeN = 0; vCnt = 0; eCnt = 0; clCount = 0;
  Wax = 1; Way = 0; Wbx = 0; Wby = 0;
  /* Стан, що переживав скидання і робив прогони невідтворюваними.
     rngState — головний: RANSAC в оцінці руху камери брав щоразу інший
     відрізок послідовності, давав інший напрямок базису, і вся модель
     успадковувала випадковий старт. Виміряно: 38, 9 і 34 кадри з тих
     самих вхідних даних, розбіжність поз 988% розмаху.
     normSeeded тягнув поле яскравості з попереднього прогону,
     flowBudget і degrade лишались зниженими після деградації. */
  rngState = 0x9E3779B9 >>> 0;
  /* M живе на рівні модуля, а на нульовому кадрі fitSimilarity ще не
     викликається (піраміда порожня) — тому composeW() брав трансформ
     з ПОПЕРЕДНЬОГО прогону і псував світ з першого ж кадру. */
  M.ax = 1; M.ay = 0; M.bx = 0; M.by = 0;
  inlierRatio = 0; transMag = 0; transDX = 0; transDY = 0; gmeLost = true;
  flowBudget = 110;
  degrade = 0; degradeT = 0;
  if (B) B.normSeeded = false;
  driftRes = 0; memTotal = 0; memOff = 0; memVis = 0;
  evicted = 0; rebases = 0;
  pyrReady = false; frameNo = 0;
  reset3d();
  resetScan();
}

/* ---------- світовий трансформ ---------- */
function preComposeW(ax, ay, bx, by){          // W ← C ∘ W
  const nax = ax * Wax - ay * Way;
  const nay = ax * Way + ay * Wax;
  const nbx = ax * Wbx - ay * Wby + bx;
  const nby = ax * Wby + ay * Wbx + by;
  Wax = nax; Way = nay; Wbx = nbx; Wby = nby;
  const s = Wax * Wax + Way * Way;
  if (!(s > 2.5e-3 && s < 400)){ Wax = 1; Way = 0; Wbx = 0; Wby = 0; }
}
function composeW(){ preComposeW(M.ax, M.ay, M.bx, M.by); }
function worldScale(){ return Math.sqrt(Wax * Wax + Way * Way) || 1; }

function projectAll(){
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v]) continue;
    const x = VX[v], y = VY[v];
    PX[v] = Wax * x - Way * y + Wbx;
    PY[v] = Way * x + Wax * y + Wby;
  }
}

function refreshMids(){
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || !EVis[e]) continue;
    const a = EA[e], b = EB[e];
    EMx[e] = (PX[a] + PX[b]) * 0.5; EMy[e] = (PY[a] + PY[b]) * 0.5;
  }
}

function unprojectTo(v, ix, iy){
  const den = Wax * Wax + Way * Way;
  if (den < 1e-9) return;
  const dx = ix - Wbx, dy = iy - Wby;
  VX[v] = (dx * Wax + dy * Way) / den;
  VY[v] = (dy * Wax - dx * Way) / den;
}

/* Перебазування: коли W відʼїхав далеко, Float32 світових координат
   починає губити точність. Складаємо W у самі координати й скидаємо. */
function rebaseWorld(){
  projectAll();
  const sc = worldScale();
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v]) continue;
    VX[v] = PX[v]; VY[v] = PY[v]; VCl[v] = VCl[v];
  }
  for (let e = 0; e < eCnt; e++) if (EAlive[e]) ELen[e] *= sc;
  Wax = 1; Way = 0; Wbx = 0; Wby = 0;
  rebases++;
}
function maybeRebase(){
  const sc = worldScale();
  if (Math.abs(Wbx) > 3000 || Math.abs(Wby) > 3000 || sc < 0.55 || sc > 1.9) rebaseWorld();
}

/* ---------- просторовий хеш (у координатах кадру, лише видиме) ---------- */
const HCELL = 16, VIEWM = 30;
let hHead = null, hNext = null, hcw = 0, hch = 0;
let vHead = null, vNext = null;
function cellX(x){ let c = (x / HCELL) | 0; if (c < 0) c = 0; else if (c >= hcw) c = hcw - 1; return c; }
function cellY(y){ let c = (y / HCELL) | 0; if (c < 0) c = 0; else if (c >= hch) c = hch - 1; return c; }

/* Геометрія ребер у кадрі + видимість + хеш. Дормантні ребра
   (поза кадром) у хеш не потрапляють — тому вартість матчингу
   не залежить від того, скільки всього накопичено. */
function edgeGeom(){
  hcw = Math.ceil(pw / HCELL) + 1; hch = Math.ceil(ph / HCELL) + 1;
  const cells = hcw * hch;
  if (!hHead || hHead.length < cells) hHead = new Int32Array(cells);
  if (!hNext || hNext.length < MAXE)  hNext = new Int32Array(MAXE);
  hHead.fill(-1, 0, cells);
  memTotal = 0; memOff = 0; memVis = 0;
  const keepAll = !!P.memory;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e]) continue;
    const a = EA[e], b = EB[e];
    const ax = PX[a], ay = PY[a], bx = PX[b], by = PY[b];
    const mx = (ax + bx) * 0.5, my = (ay + by) * 0.5;
    const dx = bx - ax, dy = by - ay;
    EMx[e] = mx; EMy[e] = my;
    EAng[e] = Math.atan2(dy, dx);
    ECur[e] = Math.sqrt(dx * dx + dy * dy);
    const vis = (mx > -VIEWM && my > -VIEWM && mx < pw + VIEWM && my < ph + VIEWM) ? 1 : 0;
    if (vis && !EWas[e]){ EMiss[e] = 0; EGrace[e] = 8; }   // повернувся в кадр — дати шанс
    EWas[e] = vis; EVis[e] = vis;
    memTotal++;
    if (!vis){
      if (keepAll) memOff++;          // рахуємо лише те, що справді лежить
      else killEdge(e);               // ПАМʼЯТЬ вимкнена — старе поводження
      continue;
    }
    memVis++;
    const c = cellY(my) * hcw + cellX(mx);
    hNext[e] = hHead[c]; hHead[c] = e;
  }
}

function hashVerts(){
  const cells = hcw * hch;
  if (!vHead || vHead.length < cells) vHead = new Int32Array(cells);
  if (!vNext || vNext.length < MAXV)  vNext = new Int32Array(MAXV);
  vHead.fill(-1, 0, cells);
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v]) continue;
    const x = PX[v], y = PY[v];
    if (x < -VIEWM || y < -VIEWM || x > pw + VIEWM || y > ph + VIEWM) continue;
    const c = cellY(y) * hcw + cellX(x);
    vNext[v] = vHead[c]; vHead[c] = v;
  }
}

/* ---------- зона фокусу (координати кадру) ---------- */
/* Зони фокусу більше немає — весь кадр рівноцінний. fcx/fcy лишились
   як центр кадру: від нього йде напрямок екструзії, туди ж міряється
   межа світу при витісненні. */
let fcx = 0, fcy = 0;
function updFocus(){ fcx = pw * 0.5; fcy = ph * 0.5; }

/* ---------- життєвий цикл вершин і ребер ---------- */
function killVertex(v){
  if (!VAlive[v]) return;
  VAlive[v] = 0; VPin[v] = 0; VCl[v] = -1;
  if (TA) reset3dVertex(v);        // слот піде іншій вершині — 3D-стан не успадковується
  if (vFreeN < MAXV) vFree[vFreeN++] = v;
}
function newVertex(x, y){
  let v;
  if (vFreeN > 0) v = vFree[--vFreeN];
  else if (vCnt < MAXV) v = vCnt++;
  else return -1;
  VX[v] = x; VY[v] = y; VD[v] = 0.5; VDw[v] = 0;
  VConf[v] = 1; VMiss[v] = 0; VPin[v] = 0; VAlive[v] = 1; VCl[v] = -1;
  VUid[v] = uidNext++;
  if (TA) reset3dVertex(v);
  return v;
}
function killEdge(e){
  if (!EAlive[e]) return;
  EAlive[e] = 0;
  const a = EA[e], b = EB[e];
  if (VAlive[a] && VPin[a] > 0) VPin[a]--;
  if (VAlive[b] && VPin[b] > 0) VPin[b]--;
  if (eFreeN < MAXE) eFree[eFreeN++] = e;
}
function newEdge(a, b, worldLen){
  if (a < 0 || b < 0 || a === b) return -1;
  let e;
  if (eFreeN > 0) e = eFree[--eFreeN];
  else if (eCnt < MAXE) e = eCnt++;
  else return -1;
  EA[e] = a; EB[e] = b; EConf[e] = 1; EMiss[e] = 0; EAge[e] = 0;
  ELen[e] = worldLen; EAlive[e] = 1; EVis[e] = 1; EWas[e] = 1;
  EGrace[e] = 0; EHit[e] = 1;
  VPin[a]++; VPin[b]++;
  return e;
}

function weldOrNew(ix, iy){
  const r2 = P.weld * P.weld;
  const cx = cellX(ix), cy = cellY(iy);
  let best = -1, bd = r2;
  for (let j = -1; j <= 1; j++)
    for (let i = -1; i <= 1; i++){
      const gx = cx + i, gy = cy + j;
      if (gx < 0 || gy < 0 || gx >= hcw || gy >= hch) continue;
      for (let v = vHead[gy * hcw + gx]; v !== -1; v = vNext[v]){
        if (!VAlive[v] || VPin[v] >= 6) continue;
        const dx = PX[v] - ix, dy = PY[v] - iy;
        const d = dx * dx + dy * dy;
        if (d < bd){ bd = d; best = v; }
      }
    }
  if (best >= 0) return best;
  const den = Wax * Wax + Way * Way;
  if (den < 1e-9) return -1;
  const dx = ix - Wbx, dy = iy - Wby;
  const v = newVertex((dx * Wax + dy * Way) / den, (dy * Wax - dx * Way) / den);
  if (v >= 0){
    PX[v] = ix; PY[v] = iy;
    const c = cy * hcw + cx;
    vNext[v] = vHead[c]; vHead[c] = v;
  }
  return v;
}

/* ---------- асоціація (лише матчинг) ---------- */
const matchedSeg = new Uint8Array(1400);
const matchedEdge = new Uint8Array(MAXE);
const pairBuf = new Float64Array(30000);
let pairN = 0;
const pairOrder = new Int32Array(10000);
const BUCKN = 64, BSCALE = BUCKN / 30;
const bBin = new Int32Array(10000);
const bCnt = new Int32Array(BUCKN + 1);
const MTseg = new Int32Array(4200), MTedge = new Int32Array(4200);
let mtN = 0;

function angDiff(a, b){
  let d = Math.abs(a - b) % Math.PI;
  if (d > Math.PI * 0.5) d = Math.PI - d;
  return d;
}

function associate(){
  matchedSeg.fill(0, 0, SEG.cnt);
  matchedEdge.fill(0, 0, eCnt);
  for (let e = 0; e < eCnt; e++) EHit[e] = 0;
  pairN = 0; mtN = 0;

  const gateA = 0.314;
  const gateBase = 14, gateD2Base = gateBase * gateBase;
  for (let s = 0; s < SEG.cnt; s++){
    const mx = SEG.mx[s], my = SEG.my[s], an = SEG.an[s], ln = SEG.ln[s];
    const cx = cellX(mx), cy = cellY(my);
    for (let j = -1; j <= 1; j++)
      for (let i = -1; i <= 1; i++){
        const gx = cx + i, gy = cy + j;
        if (gx < 0 || gy < 0 || gx >= hcw || gy >= hch) continue;
        for (let e = hHead[gy * hcw + gx]; e !== -1; e = hNext[e]){
          if (!EAlive[e]) continue;
          const dx = EMx[e] - mx, dy = EMy[e] - my;
          const d2 = dx * dx + dy * dy;
          if (d2 > gateD2Base) continue;
          /* Впевнений трек вимагає ближчого збігу — менше підмін сусіднім
             контуром. Але ребро, що тільки-но вернулось у кадр після довгої
             відсутності, судимо широким гейтом: ми якраз менш упевнені,
             де воно тепер. */
          if (EGrace[e] === 0){
            const g = gateBase - 5 * (EConf[e] / 12);
            if (d2 > g * g) continue;
          }
          const da = angDiff(an, EAng[e]);
          if (da > gateA) continue;
          const el = ECur[e];
          const ratio = el > 0.5 ? ln / el : 99;
          if (ratio < 0.55 || ratio > 1.8) continue;
          const cost = Math.sqrt(d2) + 0.55 * da * 57.3 * 0.25
                     + 0.8 * Math.abs(ln - el) / Math.max(el, 1) * 6;
          if (pairN < 10000){
            const w = pairN * 3;
            pairBuf[w] = cost; pairBuf[w + 1] = s; pairBuf[w + 2] = e; pairN++;
          }
        }
      }
  }

  const np = pairN, co = pairBuf, order = pairOrder;
  bCnt.fill(0);
  for (let i = 0; i < np; i++){
    let b = (co[i * 3] * BSCALE) | 0;
    if (b < 0) b = 0; else if (b >= BUCKN) b = BUCKN - 1;
    bBin[i] = b; bCnt[b]++;
  }
  let acc = 0;
  for (let b = 0; b < BUCKN; b++){ const c = bCnt[b]; bCnt[b] = acc; acc += c; }
  for (let i = 0; i < np; i++) order[bCnt[bBin[i]]++] = i;

  for (let n = 0; n < np; n++){
    const i = order[n] * 3;
    const s = co[i + 1], e = co[i + 2];
    if (matchedSeg[s] || matchedEdge[e] || !EAlive[e]) continue;
    matchedSeg[s] = 1; matchedEdge[e] = 1; EHit[e] = 1;
    if (mtN < 4200){ MTseg[mtN] = s; MTedge[mtN] = e; mtN++; }
  }
}

/* ---------- ЯКІР: підгонка моделі під кадр (проти дрейфу) ---------- */
/* ДРЕЙФ — лише вимір: медіана розходження проєкції моделі зі свіжими
   детекціями. Виправляти W не треба: треки перематчуються щокадру і їхні
   світові координати підтягуються EMA, тому модель самовиправляється.
   Спроба коригувати W додавала блукання по неспостережуваній калібровці
   (W і світові координати визначені лише спільно) — виміряно, шкодить. */
const driftBuf = new Float32Array(4200);
function measureDrift(){
  let n = 0;
  for (let i = 0; i < mtN && n < 4200; i++){
    const e = MTedge[i];
    if (EConf[e] < 6) continue;
    const s2 = MTseg[i];
    const dx = EMx[e] - SEG.mx[s2], dy = EMy[e] - SEG.my[s2];
    driftBuf[n++] = Math.sqrt(dx * dx + dy * dy);
  }
  if (n < 4){ driftRes = 0; return; }
  const sub = driftBuf.subarray(0, n);
  sub.sort();
  driftRes = sub[n >> 1];
}

/* РУХОМІ ЧАСТИНИ. Світові координати статичної сцени стоять на місці,
   а EMA веде треки рухомого обʼєкта — тому центроїд його кластера має
   у світі ненульову швидкість. Це і є ознака «ця частина не статична».
   Локальні similarity-поправки на кластер виміряно як марні: до 2 px/кадр
   EMA веде обʼєкт і без них, а вище треки рвуться по гейту асоціації. */
/* ---------- застосування матчів (EMA у кадрі → назад у світ) ---------- */
function applyMatches(){
  const aF = P.inertia, aO = 0.5, sc = worldScale();
  for (let i = 0; i < mtN; i++){
    const s = MTseg[i], e = MTedge[i];
    if (!EAlive[e]) continue;
    const a = EA[e], b = EB[e];
    const d1 = (SEG.x0[s] - PX[a]) ** 2 + (SEG.y0[s] - PY[a]) ** 2
             + (SEG.x1[s] - PX[b]) ** 2 + (SEG.y1[s] - PY[b]) ** 2;
    const d2 = (SEG.x0[s] - PX[b]) ** 2 + (SEG.y0[s] - PY[b]) ** 2
             + (SEG.x1[s] - PX[a]) ** 2 + (SEG.y1[s] - PY[a]) ** 2;
    let oax, oay, obx, oby;
    if (d1 <= d2){ oax = SEG.x0[s]; oay = SEG.y0[s]; obx = SEG.x1[s]; oby = SEG.y1[s]; }
    else         { oax = SEG.x1[s]; oay = SEG.y1[s]; obx = SEG.x0[s]; oby = SEG.y0[s]; }

    const stick = 1 - 0.6 * (EConf[e] / 12);
    const fa = aF * stick, fb = aF * stick;
    const nax = PX[a] + (oax - PX[a]) * fa, nay = PY[a] + (oay - PY[a]) * fa;
    const nbx = PX[b] + (obx - PX[b]) * fb, nby = PY[b] + (oby - PY[b]) * fb;
    PX[a] = nax; PY[a] = nay; PX[b] = nbx; PY[b] = nby;
    unprojectTo(a, nax, nay); unprojectTo(b, nbx, nby);

    if (EConf[e] < 12) EConf[e]++;
    EMiss[e] = 0; EAge[e]++;
    if (VConf[a] < 12) VConf[a]++;
    if (VConf[b] < 12) VConf[b]++;
    VMiss[a] = 0; VMiss[b] = 0;
    const wL = Math.sqrt((nbx - nax) ** 2 + (nby - nay) ** 2) / sc;
    if (EAge[e] < 3) ELen[e] = wL;
    else ELen[e] += (wL - ELen[e]) * 0.05;
  }
}

/* ---------- старіння: дормантне поза кадром ---------- */
function ageEdges(){
  const memF = Math.round(P.mem);
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EHit[e]) continue;
    if (!EVis[e]) continue;                    // дормант — памʼять не тане
    const mx = EMx[e], my = EMy[e];
    if (mx < BORD || my < BORD || mx > pw - BORD || my > ph - BORD) continue;
    if (EGrace[e] > 0){ EGrace[e]--; continue; }
    EMiss[e]++;
    let lim = memF;
    if (gmeLost) lim = Math.max(2, lim >> 1);
    if (EMiss[e] > lim || EConf[e] <= 0) killEdge(e);
    else if (EMiss[e] % 3 === 0 && EConf[e] > 0) EConf[e]--;
  }
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v]) continue;
    if (VPin[v] === 0){ VCl[v] = -1; VMiss[v]++; if (VMiss[v] > 2) killVertex(v); }
  }
}

/* ---------- народження ---------- */
function births(){
  hashVerts();
  const sc = worldScale();
  let evictedThisFrame = false;
  for (let s = 0; s < SEG.cnt; s++){
    if (matchedSeg[s]) continue;
    if (eFreeN === 0 && eCnt >= MAXE){
      if (evictedThisFrame) break;
      evictBatch(); evictedThisFrame = true;
      if (eFreeN === 0) break;
    }
    const a = weldOrNew(SEG.x0[s], SEG.y0[s]);
    const b = weldOrNew(SEG.x1[s], SEG.y1[s]);
    newEdge(a, b, SEG.ln[s] / sc);
  }
}

/* ---------- витіснення: забуваємо найменш підтверджене ---------- */
function evictBatch(){
  const lim = Math.sqrt(pw * pw + ph * ph) * P.world;
  const lim2 = lim * lim;
  let freed = 0;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EVis[e]) continue;
    const dx = EMx[e] - fcx, dy = EMy[e] - fcy;
    if (dx * dx + dy * dy > lim2){ killEdge(e); freed++; }
  }
  if (freed > (MAXE >> 5)){ evicted += freed; return freed; }
  ageHist.fill(0);
  let cand = 0;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EVis[e]) continue;
    ageHist[Math.min(63, EAge[e])]++; cand++;
  }
  if (cand === 0){                      // усе видиме — рубаємо найслабше видиме
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e]) continue;
      if (EAge[e] <= 1 && EConf[e] <= 2){ killEdge(e); freed++; }
    }
    evicted += freed; return freed;
  }
  const need = Math.max(1, MAXE >> 4);
  let acc = 0, thr = 0;
  for (let a = 0; a < 64; a++){ acc += ageHist[a]; thr = a; if (acc >= need) break; }
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EVis[e]) continue;
    if (EAge[e] <= thr){ killEdge(e); freed++; }
  }
  evicted += freed;
  return freed;
}

const BORD = 24;   // біля рамки контур не дотягує до minLen — детектор там сліпий

/* ---------- жорсткість (у світових одиницях = жорсткість обʼєкта) ---------- */
function rigidity(){
  if (!P.rigid) return;
  for (let it = 0; it < 3; it++){
    for (let e = 0; e < eCnt; e++){
      if (!EAlive[e] || !EVis[e] || EConf[e] < 5) continue;
      /* Раніше жорсткість обмежувалась зоною фокусу, і та працювала як
         неявний фільтр ЯКОСТІ: у центрі ребра довгоживучі й добре
         обумовлені. Без зони критерій має бути прямим — еталонна довжина
         мусить встигнути збігтися (EMA 5%/кадр ≈ 12 кадрів), а біля рамки
         детектор сліпий і штовхати там нічого. */
      if (EAge[e] < 12) continue;
      const mx = EMx[e], my = EMy[e];
      if (mx < BORD || my < BORD || mx > pw - BORD || my > ph - BORD) continue;
      const a = EA[e], b = EB[e];
      const dx = VX[b] - VX[a], dy = VY[b] - VY[a];
      const L = Math.sqrt(dx * dx + dy * dy);
      if (L < 0.3) continue;
      const err = (L - ELen[e]) / L * 0.35;
      const cx = dx * err * 0.5, cy = dy * err * 0.5;
      VX[a] += cx; VY[a] += cy;
      VX[b] -= cx; VY[b] -= cy;
    }
  }
}

/* ---------- зварка вершин ---------- */
const weldRemap = new Int32Array(MAXV);
function weldPass(){
  hashVerts();
  const r2 = P.weld * P.weld;
  const remap = weldRemap;
  for (let i = 0; i < vCnt; i++) remap[i] = i;
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v] || remap[v] !== v) continue;
    const x = PX[v], y = PY[v];
    if (x < -VIEWM || y < -VIEWM || x > pw + VIEWM || y > ph + VIEWM) continue;
    const cx = cellX(x), cy = cellY(y);
    for (let j = -1; j <= 1; j++)
      for (let i = -1; i <= 1; i++){
        const gx = cx + i, gy = cy + j;
        if (gx < 0 || gy < 0 || gx >= hcw || gy >= hch) continue;
        for (let u = vHead[gy * hcw + gx]; u !== -1; u = vNext[u]){
          if (u === v || !VAlive[u] || remap[u] !== u) continue;
          if (VCl[u] !== VCl[v]) continue;          // різні кластери не зварюємо
          /* дві усталені вершини — це дві РІЗНІ ознаки геометрії. Зливати їх
             означає посадити результат між ними, і він почне коливатись. */
          if (VConf[u] >= 8 && VConf[v] >= 8) continue;
          const dx = PX[u] - x, dy = PY[u] - y;
          if (dx * dx + dy * dy > r2) continue;
          const wv = VConf[v] + 1, wu = VConf[u] + 1, tw = wv + wu;
          VX[v] = (VX[v] * wv + VX[u] * wu) / tw;
          VY[v] = (VY[v] * wv + VY[u] * wu) / tw;
          const dwT = VDw[v] + VDw[u];
          if (dwT > 0) VD[v] = (VD[v] * VDw[v] + VD[u] * VDw[u]) / dwT;
          VDw[v] = Math.min(40, dwT);
          VConf[v] = Math.max(VConf[v], VConf[u]);
          remap[u] = v; killVertex(u);
        }
      }
  }
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e]) continue;
    const a = remap[EA[e]], b = remap[EB[e]];
    if (a === b){ EAlive[e] = 0; if (eFreeN < MAXE) eFree[eFreeN++] = e; continue; }
    EA[e] = a; EB[e] = b;
  }
  for (let v = 0; v < vCnt; v++) VPin[v] = 0;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e]) continue;
    VPin[EA[e]]++; VPin[EB[e]]++;
  }
  for (let v = 0; v < vCnt; v++) if (VAlive[v] && VPin[v] === 0) killVertex(v);
}

/* ---------- кластери: компоненти звʼязності з успадкуванням id ---------- */
function ufFind(a){ while (uf[a] !== a){ uf[a] = uf[uf[a]]; a = uf[a]; } return a; }

const rootIdx = new Int32Array(MAXV);

/* Кластери потрібні лише для двох речей: рамки в БОКСАХ і заборона
   зварювати вершини різних компонент. Ніякого стану вони не несуть,
   тому id можуть вільно перенумеровуватись. */
function recluster(){
  for (let v = 0; v < vCnt; v++) uf[v] = v;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e] || EConf[e] < 5) continue;
    const a = ufFind(EA[e]), b = ufFind(EB[e]);
    if (a !== b) uf[a] = b;
  }
  clSize.fill(0, 0, vCnt);
  rootIdx.fill(-1, 0, vCnt);
  for (let v = 0; v < vCnt; v++)
    if (VAlive[v] && VPin[v] > 0) clSize[ufFind(v)]++;
  let nr = 0;
  for (let v = 0; v < vCnt; v++) if (clSize[v] >= 5) clRoots[nr++] = v;
  const sub = clRoots.subarray(0, nr);
  sub.sort((a, b) => clSize[b] - clSize[a]);
  const k = Math.min(MAXC, nr);
  for (let i = 0; i < k; i++) rootIdx[clRoots[i]] = i;
  for (let v = 0; v < vCnt; v++)
    VCl[v] = (VAlive[v] && VPin[v] > 0) ? rootIdx[ufFind(v)] : -1;
  clCount = k;
}

/* ============================================================
   ШАР C — ГЛИБИНА (гібрид)
   ============================================================ */
const PGW = 16, PGH = 12;
const pField = new Float32Array(PGW * PGH);
const pAcc   = new Float32Array(PGW * PGH);
const pWgt   = new Float32Array(PGW * PGH);
let depthConf = 0;

function parallaxField(){
  pAcc.fill(0); pWgt.fill(0);
  if (gmeLost || transMag < 0.25) return 0;
  const inv = 1 / Math.max(transMag, 0.5);
  const tdx = transDX / Math.max(transMag, 1e-6), tdy = transDY / Math.max(transMag, 1e-6);
  let used = 0;
  for (let i = 0; i < FLOW.cnt; i++){
    if (!FLOW.ok[i]) continue;
    const x = FLOW.x[i], y = FLOW.y[i];
    const px = M.ax * x - M.ay * y + M.bx;
    const py = M.ay * x + M.ax * y + M.by;
    const rx = (x + FLOW.u[i]) - px, ry = (y + FLOW.v[i]) - py;
    let p = (rx * tdx + ry * tdy) * inv;
    if (p < -1.5) p = -1.5; if (p > 1.5) p = 1.5;
    const cx = Math.min(PGW - 1, Math.max(0, (x / pw * PGW) | 0));
    const cy = Math.min(PGH - 1, Math.max(0, (y / ph * PGH) | 0));
    const k = cy * PGW + cx;
    pAcc[k] += 0.5 + 0.33 * p; pWgt[k] += 1; used++;
  }
  if (used < 6) return 0;
  for (let k = 0; k < PGW * PGH; k++){
    if (pWgt[k] > 0){
      const v = pAcc[k] / pWgt[k];
      pField[k] = pField[k] * 0.85 + v * 0.15;
    }
  }
  const w = Math.min(1, transMag / 3) * inlierRatio;
  return w;
}

function sampleField(x, y){
  const fx = Math.min(PGW - 1.001, Math.max(0, x / pw * PGW - 0.5));
  const fy = Math.min(PGH - 1.001, Math.max(0, y / ph * PGH - 0.5));
  const x0 = fx | 0, y0 = fy | 0;
  const tx = fx - x0, ty = fy - y0;
  const k = y0 * PGW + x0;
  const a = pField[k], b = pField[k + 1], c = pField[k + PGW], d = pField[k + PGW + 1];
  return a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty;
}

const dSort  = new Float32Array(MAXV);
const dFinal = new Float32Array(MAXV);
const lenSumB = new Float32Array(MAXV);
const lenNB   = new Float32Array(MAXV);

function depth(){
  const wFrame = parallaxField();

  /* накопичення паралаксу */
  if (wFrame > 0.01){
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v]) continue;
      const px = PX[v], py = PY[v];
      if (px < 0 || py < 0 || px > pw || py > ph) continue;   // поза кадром паралаксу нема
      const raw = sampleField(px, py);
      const dw = VDw[v];
      VD[v] = (VD[v] * dw + raw * wFrame) / (dw + wFrame);
      VDw[v] = Math.min(40, dw + wFrame);
    }
  }

  /* нормалізація паралаксної частини по перцентилях серед фокусу */
  let m = 0;
  for (let v = 0; v < vCnt; v++)
    if (VAlive[v] && VDw[v] > 0.5) dSort[m++] = VD[v];
  let lo = 0.3, hi = 0.7;
  if (m > 8){
    const sub = dSort.subarray(0, m);
    sub.sort((a, b) => a - b);
    lo = sub[(m * 0.05) | 0]; hi = sub[Math.min(m - 1, (m * 0.95) | 0)];
    if (hi - lo < 0.02){ lo -= 0.01; hi += 0.01; }
  }
  const span = hi - lo;

  /* фолбек-пріор + змішування */
  let maxLen = 1;
  for (let e = 0; e < eCnt; e++)
    if (EAlive[e]) maxLen = Math.max(maxLen, ELen[e]);

  lenSumB.fill(0, 0, vCnt); lenNB.fill(0, 0, vCnt);
  const lenSum = lenSumB, lenN = lenNB;
  for (let e = 0; e < eCnt; e++){
    if (!EAlive[e]) continue;
    lenSum[EA[e]] += ELen[e]; lenN[EA[e]]++;
    lenSum[EB[e]] += ELen[e]; lenN[EB[e]]++;
  }

  let confSum = 0, confN = 0;
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v]){ dFinal[v] = 0.5; continue; }
    const rn = Math.max(1, Math.min(pw, ph) * 0.5);        // півкадру замість зони фокусу
    const dx = (PX[v] - fcx) / rn, dy = (PY[v] - fcy) / rn;
    const rN = Math.min(1, Math.hypot(dx, dy));
    const closure = Math.min(1, Math.max(0, (VPin[v] - 1) / 3));
    const lenN2 = lenN[v] > 0 ? Math.min(1, (lenSum[v] / lenN[v]) / maxLen) : 0.3;
    const pseudo = 0.55 * (1 - rN) + 0.30 * closure + 0.15 * lenN2;
    const par = span > 1e-6 ? Math.min(1, Math.max(0, (VD[v] - lo) / span)) : 0.5;
    const mix = Math.min(1, VDw[v] / 18);
    dFinal[v] = pseudo * (1 - mix) + par * mix;
    confSum += VDw[v]; confN++;
  }
  depthConf = confN > 0 ? (confSum / confN) / 40 : 0;
}

/* ============================================================
   ШАР D — 3D: ПОЗА І ТРІАНГУЛЯЦІЯ
   ============================================================
   Споживач треків, не власник. 2D-фіксація працює як працювала;
   цей шар лише читає підтверджені спостереження і будує з них
   геометрію в метричному (або умовно-масштабованому) просторі.

   Поворот R приходить ззовні і вважається точним (гіроскоп або WebXR).
   Це перетворює дві задачі з нелінійних на лінійні:
     • напрямок зсуву:  (x2 × R·x1) · t = 0     — нуль-простір 3×3
     • резекція:        xi × (R·Xi − c) = 0     — МНК по 3 невідомих
   Масштаб монокулярно не спостережуваний: перший базис = 1 одиниця.
   ============================================================ */

/* ---------- внутрішні параметри камери (у пікселях proc) ---------- */
const CAM = { fx:0, fy:0, cx:0, cy:0 };
function updCam(){
  const hf = P.hfov * Math.PI / 180;
  CAM.fx = (pw * 0.5) / Math.tan(hf * 0.5);
  CAM.fy = CAM.fx;                 // квадратний піксель
  CAM.cx = pw * 0.5; CAM.cy = ph * 0.5;
}
/* піксель → одиничний промінь у системі камери */
function pixRay(u, v, o){
  const x = (u - CAM.cx) / CAM.fx, y = (v - CAM.cy) / CAM.fy;
  const n = 1 / Math.sqrt(x * x + y * y + 1);
  o[0] = x * n; o[1] = y * n; o[2] = n;
}

/* ---------- кватерніони ---------- */
function qMul(a, b, o){
  o[0] = a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1];
  o[1] = a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0];
  o[2] = a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3];
  o[3] = a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2];
}
function qRot(q, v, o){            // o = q · v · q*
  const x=q[0], y=q[1], z=q[2], w=q[3];
  const tx = 2*(y*v[2] - z*v[1]), ty = 2*(z*v[0] - x*v[2]), tz = 2*(x*v[1] - y*v[0]);
  o[0] = v[0] + w*tx + (y*tz - z*ty);
  o[1] = v[1] + w*ty + (z*tx - x*tz);
  o[2] = v[2] + w*tz + (x*ty - y*tx);
}
function qConj(q, o){ o[0]=-q[0]; o[1]=-q[1]; o[2]=-q[2]; o[3]=q[3]; }

/* DeviceOrientation (alpha,beta,gamma у градусах) + орієнтація екрана
   → кватерніон камери у світі. Порядок обертань ZXY, як у специфікації. */
const _qa=[0,0,0,1], _qb=[0,0,0,1], _qc=[0,0,0,1], _qs=[0,0,0,1];
function orientToQuat(alpha, beta, gamma, screenDeg, o){
  const D = Math.PI / 180;
  const z = alpha * D, x = beta * D, y = gamma * D;
  const cZ = Math.cos(z*0.5), sZ = Math.sin(z*0.5);
  const cX = Math.cos(x*0.5), sX = Math.sin(x*0.5);
  const cY = Math.cos(y*0.5), sY = Math.sin(y*0.5);
  /* q = qZ · qX · qY */
  _qa[0]=0; _qa[1]=0; _qa[2]=sZ; _qa[3]=cZ;
  _qb[0]=sX; _qb[1]=0; _qb[2]=0; _qb[3]=cX;
  _qc[0]=0; _qc[1]=sY; _qc[2]=0; _qc[3]=cY;
  qMul(_qa, _qb, _qs); qMul(_qs, _qc, o);
  /* екран повернутий відносно пристрою */
  if (screenDeg){
    const s = -screenDeg * D * 0.5;
    _qa[0]=0; _qa[1]=0; _qa[2]=Math.sin(s); _qa[3]=Math.cos(s);
    qMul(o, _qa, _qs); o[0]=_qs[0]; o[1]=_qs[1]; o[2]=_qs[2]; o[3]=_qs[3];
  }
  /* Пристрій: X вправо по екрану, Y вгору по екрану, Z з екрана на глядача.
     Тилова камера дивиться вздовж −Z, а піксельна конвенція має y ВНИЗ.
     Отже camera = diag(1,−1,−1) відносно пристрою — це поворот на 180°
     навколо X, кватерніон (1,0,0,0). Не −90°: при −90° вісь Z перестає
     бути оптичною, і крен від повороту екрана зсуває напрямок погляду. */
  _qa[0]=1; _qa[1]=0; _qa[2]=0; _qa[3]=0;
  qMul(o, _qa, _qs);
  o[0]=_qs[0]; o[1]=_qs[1]; o[2]=_qs[2]; o[3]=_qs[3];
}

/* ---------- стан пози ---------- */
const POSEN = 256;
const poseQ = new Float32Array(POSEN * 4);   // орієнтація камери у світі
const poseC = new Float32Array(POSEN * 3);   // центр камери у світі
let poseHead = -1, poseCount = 0;
let curQ = new Float32Array([0,0,0,1]);
let curC = new Float32Array(3);
let poseMode = 'none';       // 'none' | 'imu' | 'xr'
let scaleFixed = false;      // базис уже призначений
let resErr = 0, parMax = 0, pts3d = 0, poseLost = true;
const prevC1 = new Float32Array(3), prevC2 = new Float32Array(3);
let haveC1 = false, haveC2 = false;

function poseSlot(){
  poseHead = (poseHead + 1) % POSEN;
  if (poseCount < POSEN) poseCount++;
  return poseHead;
}
function pushPose(){
  const i = poseSlot(), q = i*4, c = i*3;
  poseQ[q]=curQ[0]; poseQ[q+1]=curQ[1]; poseQ[q+2]=curQ[2]; poseQ[q+3]=curQ[3];
  poseC[c]=curC[0]; poseC[c+1]=curC[1]; poseC[c+2]=curC[2];
  return i;
}
/* промінь пікселя у СВІТОВИХ координатах для пози i */
const _r=[0,0,0], _rw=[0,0,0], _q=[0,0,0,1];
function worldRay(poseIdx, u, v, o){
  pixRay(u, v, _r);
  const q = poseIdx*4;
  _q[0]=poseQ[q]; _q[1]=poseQ[q+1]; _q[2]=poseQ[q+2]; _q[3]=poseQ[q+3];
  qRot(_q, _r, o);
}

/* ---------- накопичувачі тріангуляції (на вершину) ---------- */
let TA, TB, TD0, TPar, TX, TN, TAnchor, TAu, TAv;
function alloc3d(){
  TA = new Float32Array(MAXV * 6);   // симетрична 3×3: xx xy xz yy yz zz
  TB = new Float32Array(MAXV * 3);
  TD0 = new Float32Array(MAXV * 3);  // перший промінь — для кута паралакса
  TPar = new Float32Array(MAXV);
  TX = new Float32Array(MAXV * 3);   // 3D-точка
  TN = new Uint8Array(MAXV);         // 0 нема, 1 накопичується, 2 готова
  TAnchor = new Int32Array(MAXV);
  TAu = new Float32Array(MAXV); TAv = new Float32Array(MAXV);
}
function reset3dVertex(v){
  const a = v*6, b = v*3;
  TA[a]=TA[a+1]=TA[a+2]=TA[a+3]=TA[a+4]=TA[a+5]=0;
  TB[b]=TB[b+1]=TB[b+2]=0;
  TPar[v]=0; TN[v]=0; TAnchor[v]=-1;
}
function reset3d(){
  if (!TA) alloc3d();
  for (let v = 0; v < MAXV; v++) reset3dVertex(v);
  poseHead=-1; poseCount=0; scaleFixed=false; poseLost=true;
  bootPose=-1; bootAge=0;
  curQ[0]=curQ[1]=curQ[2]=0; curQ[3]=1;
  curC[0]=curC[1]=curC[2]=0;
  resErr=0; parMax=0; pts3d=0;
  haveC1=false; haveC2=false;
  sealed = false;
}

/* Записати якір і накопичити кут паралакса. Нормальні рівняння НЕ чіпаємо,
   поки базис не призначено — до того curC це змінна одинична оцінка напрямку,
   і нею можна лише зіпсувати накопичення. */
const _d=[0,0,0];
function noteObs(v, u, vy, poseIdx){
  const k = v*3;
  if (TN[v] === 0){
    worldRay(poseIdx, u, vy, _d);
    TD0[k]=_d[0]; TD0[k+1]=_d[1]; TD0[k+2]=_d[2];
    TAnchor[v]=poseIdx; TAu[v]=u; TAv[v]=vy;
    TN[v] = 1;
    return;
  }
  worldRay(poseIdx, u, vy, _d);
  const dot = TD0[k]*_d[0] + TD0[k+1]*_d[1] + TD0[k+2]*_d[2];
  const ang = Math.acos(Math.max(-1, Math.min(1, dot)));
  if (ang > TPar[v]) TPar[v] = ang;
}

/* додати спостереження в нормальні рівняння (потрібна достовірна curC) */
function addObs(v, u, vy, poseIdx, cx, cy, cz){
  worldRay(poseIdx, u, vy, _d);
  const a = v*6, b = v*3, k = v*3;
  if (TN[v] === 0){
    TD0[k]=_d[0]; TD0[k+1]=_d[1]; TD0[k+2]=_d[2];
    TAnchor[v]=poseIdx; TAu[v]=u; TAv[v]=vy;
    TN[v] = 1;
  } else {
    const dot = TD0[k]*_d[0] + TD0[k+1]*_d[1] + TD0[k+2]*_d[2];
    const ang = Math.acos(Math.max(-1, Math.min(1, dot)));
    if (ang > TPar[v]) TPar[v] = ang;
  }
  /* A += I − d dᵀ,  b += (I − d dᵀ)·C */
  const dx=_d[0], dy=_d[1], dz=_d[2];
  const m00=1-dx*dx, m01=-dx*dy, m02=-dx*dz;
  const m11=1-dy*dy, m12=-dy*dz, m22=1-dz*dz;
  TA[a]+=m00; TA[a+1]+=m01; TA[a+2]+=m02;
  TA[a+3]+=m11; TA[a+4]+=m12; TA[a+5]+=m22;
  TB[b]  += m00*cx + m01*cy + m02*cz;
  TB[b+1]+= m01*cx + m11*cy + m12*cz;
  TB[b+2]+= m02*cx + m12*cy + m22*cz;
}

/* розвʼязати 3×3 симетричну систему */
function solve3(a0,a1,a2,a3,a4,a5, b0,b1,b2, o){
  const c00=a3*a5-a4*a4, c01=a2*a4-a1*a5, c02=a1*a4-a2*a3;
  const det = a0*c00 + a1*c01 + a2*c02;
  if (Math.abs(det) < 1e-9) return false;
  const c11=a0*a5-a2*a2, c12=a2*a1-a0*a4, c22=a0*a3-a1*a1;
  const id = 1/det;
  o[0]=(c00*b0 + c01*b1 + c02*b2)*id;
  o[1]=(c01*b0 + c11*b1 + c12*b2)*id;
  o[2]=(c02*b0 + c12*b1 + c22*b2)*id;
  return true;
}

const _x3=[0,0,0];
function triangulate(){
  pts3d = 0; parMax = 0;
  const need = P.parallax * Math.PI / 180;
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v] || TN[v] === 0) continue;
    if (VPin[v] < 2){ continue; }          // тільки стики: вільний кінець не локалізований
    if (TPar[v] > parMax) parMax = TPar[v];
    if (TPar[v] < need) continue;
    const a = v*6, b = v*3;
    if (!solve3(TA[a],TA[a+1],TA[a+2],TA[a+3],TA[a+4],TA[a+5],
                TB[b],TB[b+1],TB[b+2], _x3)) continue;
    /* точка мусить бути перед камерою */
    const dx=_x3[0]-curC[0], dy=_x3[1]-curC[1], dz=_x3[2]-curC[2];
    qConj(curQ, _q);
    _d[0]=dx; _d[1]=dy; _d[2]=dz;
    qRot(_q, _d, _r);
    if (_r[2] <= 0.02) continue;
    TX[b]=_x3[0]; TX[b+1]=_x3[1]; TX[b+2]=_x3[2];
    TN[v] = 2; pts3d++;
  }
}

/* ---------- напрямок зсуву при відомому повороті ---------- */
/* (x2 × R·x1) · t = 0 → найменший власний вектор Σ ffᵀ */
const epiA = new Float64Array(6);
const epiF = new Float64Array(400*3);
const epiR = new Float64Array(400);
function estTransDir(o){
  epiA.fill(0);
  let n = 0;
  const r1=[0,0,0], r1w=[0,0,0], r2=[0,0,0], r2w=[0,0,0], f=[0,0,0];
  for (let v = 0; v < vCnt && n < 400; v++){
    if (!VAlive[v] || TN[v] === 0 || VPin[v] < 2) continue;
    const ai = TAnchor[v];
    if (ai < 0) continue;
    worldRay(ai, TAu[v], TAv[v], r1w);           // промінь якоря у світі
    pixRay(PX[v], PY[v], r2);
    qRot(curQ, r2, r2w);                          // поточний промінь у світі
    f[0] = r2w[1]*r1w[2] - r2w[2]*r1w[1];
    f[1] = r2w[2]*r1w[0] - r2w[0]*r1w[2];
    f[2] = r2w[0]*r1w[1] - r2w[1]*r1w[0];
    const L = Math.sqrt(f[0]*f[0]+f[1]*f[1]+f[2]*f[2]);
    if (L < 1e-4) continue;
    f[0]/=L; f[1]/=L; f[2]/=L;
    epiF[n*3]=f[0]; epiF[n*3+1]=f[1]; epiF[n*3+2]=f[2];
    epiA[0]+=f[0]*f[0]; epiA[1]+=f[0]*f[1]; epiA[2]+=f[0]*f[2];
    epiA[3]+=f[1]*f[1]; epiA[4]+=f[1]*f[2]; epiA[5]+=f[2]*f[2];
    n++;
  }
  if (n < 12) return false;
  if (!smallestEigen(epiA, o)) return false;
  /* Один прохід відсіву: МНК на неоднозначних відповідностях зміщує
     нуль-простір. Викидаємо гіршу третину по |f·t| і переганяємо. */
  if (n >= 24){
    for (let i = 0; i < n; i++)
      epiR[i] = Math.abs(epiF[i*3]*o[0] + epiF[i*3+1]*o[1] + epiF[i*3+2]*o[2]);
    const srt = Array.prototype.slice.call(epiR, 0, n).sort((a,b)=>a-b);
    const cut = srt[(n*0.67)|0];
    epiA.fill(0);
    let m = 0;
    for (let i = 0; i < n; i++){
      if (epiR[i] > cut) continue;
      const a=epiF[i*3], b=epiF[i*3+1], c=epiF[i*3+2];
      epiA[0]+=a*a; epiA[1]+=a*b; epiA[2]+=a*c;
      epiA[3]+=b*b; epiA[4]+=b*c; epiA[5]+=c*c;
      m++;
    }
    if (m >= 12) smallestEigen(epiA, o);
  }
  return true;
}

/* найменший власний вектор симетричної 3×3 — оберненими ітераціями */
const _ev=[0,0,0], _tmp=[0,0,0];
function smallestEigen(A, o){
  const tr = (A[0]+A[3]+A[5]) / 3 || 1;
  const s = 1/tr;
  const a0=A[0]*s, a1=A[1]*s, a2=A[2]*s, a3=A[3]*s, a4=A[4]*s, a5=A[5]*s;
  const eps = 1e-3;
  const b0=a0+eps, b3=a3+eps, b5=a5+eps;
  let x0=0.577, x1=0.577, x2=0.577;
  for (let it = 0; it < 24; it++){
    if (!solve3(b0,a1,a2,b3,a4,b5, x0,x1,x2, _tmp)) return false;
    const L = Math.sqrt(_tmp[0]*_tmp[0]+_tmp[1]*_tmp[1]+_tmp[2]*_tmp[2]);
    if (!(L > 1e-12)) return false;
    x0=_tmp[0]/L; x1=_tmp[1]/L; x2=_tmp[2]/L;
  }
  o[0]=x0; o[1]=x1; o[2]=x2;
  return true;
}

/* ---------- резекція: центр камери при відомому R і 3D-точках ---------- */
/* xi × (Xi − C) = 0, лінійно по C */
const resA = new Float64Array(6), resB = new Float64Array(3);
function resection(){
  resA.fill(0); resB.fill(0);
  let n = 0;
  const r=[0,0,0], rw=[0,0,0];
  for (let v = 0; v < vCnt; v++){
    if (!VAlive[v] || TN[v] !== 2 || VPin[v] < 2) continue;
    pixRay(PX[v], PY[v], r);
    qRot(curQ, r, rw);
    const dx=rw[0], dy=rw[1], dz=rw[2];
    const m00=1-dx*dx, m01=-dx*dy, m02=-dx*dz;
    const m11=1-dy*dy, m12=-dy*dz, m22=1-dz*dz;
    const k=v*3, X=TX[k], Y=TX[k+1], Z=TX[k+2];
    resA[0]+=m00; resA[1]+=m01; resA[2]+=m02;
    resA[3]+=m11; resA[4]+=m12; resA[5]+=m22;
    resB[0]+= m00*X + m01*Y + m02*Z;
    resB[1]+= m01*X + m11*Y + m12*Z;
    resB[2]+= m02*X + m12*Y + m22*Z;
    n++;
  }
  if (n < 6) return false;
  /* Резекція рахує позу з самих променів, незалежно від сусідніх кадрів.
     Шум по 3D-точках б'є прямо в позицію: при глибині ~4 одиниці й базисі
     1 похибка кількох відсотків по точках дає десятки відсотків по позі.
     Виміряно: на прямому проході шлях камери виходив у 2.6 раза довшим
     за розмах — траєкторія смикалась туди-сюди.
     Камера в руці не телепортується, тому вносимо це знання в рівняння:
     прогноз від попередніх двох кадрів як пріор, з вагою від сили даних. */
  if (haveC1 && P.smooth > 0){
    const pr = [0,0,0];
    if (haveC2){
      for (let a = 0; a < 3; a++) pr[a] = prevC1[a] + (prevC1[a] - prevC2[a]) * 0.8;
    } else { pr[0]=prevC1[0]; pr[1]=prevC1[1]; pr[2]=prevC1[2]; }
    const wp = (resA[0] + resA[3] + resA[5]) / 3 * P.smooth;
    resA[0] += wp; resA[3] += wp; resA[5] += wp;
    resB[0] += wp*pr[0]; resB[1] += wp*pr[1]; resB[2] += wp*pr[2];
  }
  if (!solve3(resA[0],resA[1],resA[2],resA[3],resA[4],resA[5],
              resB[0],resB[1],resB[2], _x3)) return false;
  /* другий прохід — без точок з великою похибкою відстані до променя */
  if (n >= 16){
    const cx0=_x3[0], cy0=_x3[1], cz0=_x3[2];
    let s2 = 0, cnt2 = 0;
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || TN[v] !== 2 || VPin[v] < 2) continue;
      pixRay(PX[v], PY[v], r); qRot(curQ, r, rw);
      const k=v*3, ex=TX[k]-cx0, ey=TX[k+1]-cy0, ez=TX[k+2]-cz0;
      const pr = ex*rw[0]+ey*rw[1]+ez*rw[2];
      const px=ex-pr*rw[0], py=ey-pr*rw[1], pz=ez-pr*rw[2];
      s2 += px*px+py*py+pz*pz; cnt2++;
    }
    const thr = (s2/Math.max(1,cnt2)) * 1.4;
    resA.fill(0); resB.fill(0);
    let m = 0;
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || TN[v] !== 2 || VPin[v] < 2) continue;
      pixRay(PX[v], PY[v], r); qRot(curQ, r, rw);
      const k=v*3, ex=TX[k]-cx0, ey=TX[k+1]-cy0, ez=TX[k+2]-cz0;
      const pr = ex*rw[0]+ey*rw[1]+ez*rw[2];
      const px=ex-pr*rw[0], py=ey-pr*rw[1], pz=ez-pr*rw[2];
      if (px*px+py*py+pz*pz > thr) continue;
      const dx=rw[0], dy=rw[1], dz=rw[2];
      const m00=1-dx*dx, m01=-dx*dy, m02=-dx*dz;
      const m11=1-dy*dy, m12=-dy*dz, m22=1-dz*dz;
      const X=TX[k], Y=TX[k+1], Z=TX[k+2];
      resA[0]+=m00; resA[1]+=m01; resA[2]+=m02;
      resA[3]+=m11; resA[4]+=m12; resA[5]+=m22;
      resB[0]+= m00*X + m01*Y + m02*Z;
      resB[1]+= m01*X + m11*Y + m12*Z;
      resB[2]+= m02*X + m12*Y + m22*Z;
      m++;
    }
    if (m >= 6){
      if (haveC1 && P.smooth > 0){
        const pr = [0,0,0];
        if (haveC2){ for (let a=0;a<3;a++) pr[a] = prevC1[a] + (prevC1[a]-prevC2[a])*0.8; }
        else { pr[0]=prevC1[0]; pr[1]=prevC1[1]; pr[2]=prevC1[2]; }
        const wp = (resA[0]+resA[3]+resA[5])/3 * P.smooth;
        resA[0]+=wp; resA[3]+=wp; resA[5]+=wp;
        resB[0]+=wp*pr[0]; resB[1]+=wp*pr[1]; resB[2]+=wp*pr[2];
      }
      solve3(resA[0],resA[1],resA[2],resA[3],resA[4],resA[5],
             resB[0],resB[1],resB[2], _x3);
    }
  }
  const step = Math.sqrt((_x3[0]-curC[0])**2 + (_x3[1]-curC[1])**2 + (_x3[2]-curC[2])**2);
  if (!isFinite(step) || step > 2.0) return false;      // стрибок = розбіжність
  curC[0]=_x3[0]; curC[1]=_x3[1]; curC[2]=_x3[2];
  prevC2[0]=prevC1[0]; prevC2[1]=prevC1[1]; prevC2[2]=prevC1[2];
  haveC2 = haveC1;
  prevC1[0]=curC[0]; prevC1[1]=curC[1]; prevC1[2]=curC[2];
  haveC1 = true;
  resErr = step;
  return true;
}

/* ---------- головна стадія ---------- */
let sealed = false;
let bootPose = -1, bootAge = 0;
const _t=[0,0,0];

function pose3dStage(){
  if (poseMode === 'none'){ poseLost = true; return; }
  updCam();
  poseLost = false;

  if (!scaleFixed){
    /* --- ЗАВАНТАЖЕННЯ: класична двокадрова схема ---
       Опорний кадр A не може бути найпершим: вершині треба ~6 кадрів,
       щоб набрати довіру. Тому A — це перший кадр, де впевнених вершин
       уже достатньо, і саме він стає початком координат. */
    curC[0]=0; curC[1]=0; curC[2]=0;
    if (bootPose < 0){
      let n = 0;
      for (let v = 0; v < vCnt; v++) if (VAlive[v] && EnoughObs(v)) n++;
      if (n < 20){ pts3d = 0; parMax = 0; return; }
      bootPose = pushPose(); bootAge = 0;
      for (let v = 0; v < vCnt; v++){
        if (!VAlive[v] || !EnoughObs(v)) continue;
        reset3dVertex(v);
        noteObs(v, PX[v], PY[v], bootPose);
      }
      pts3d = 0; parMax = 0; return;
    }
    bootAge++;
    if (bootAge > POSEN - 8){ bootPose = -1; pts3d = 0; return; }  // кільце поз обернулось
    const pi = pushPose();
    parMax = 0;
    for (let v = 0; v < vCnt; v++){
      if (!VAlive[v] || TAnchor[v] !== bootPose || !EnoughObs(v)) continue;
      noteObs(v, PX[v], PY[v], pi);
      if (VPin[v] >= 2 && TPar[v] > parMax) parMax = TPar[v];
    }
    if (parMax < P.parallax * Math.PI / 180){ pts3d = 0; return; }
    if (!estTransDir(_t)){ pts3d = 0; return; }
    /* Епіполярна умова однорідна — знак базису з неї не випливає.
       Розвʼязує хіральність: правильний знак дає точки ПЕРЕД камерою.
       Скалярний добуток напрямку на точку з базисом тут не працює: при
       боковому проході базис перпендикулярний погляду, добуток ≈ 0. */
    let bestN = -1, bestSg = 1;
    for (let pass = 0; pass < 3; pass++){
      const sg = pass === 0 ? 1 : (pass === 1 ? -1 : bestSg);
      curC[0]=_t[0]*sg; curC[1]=_t[1]*sg; curC[2]=_t[2]*sg;   // |базис| := 1
      const pj = pushPose();
      for (let v = 0; v < vCnt; v++){
        if (!VAlive[v] || TN[v] === 0 || TAnchor[v] !== bootPose || !EnoughObs(v)) continue;
        const a=v*6, b=v*3;
        TA[a]=TA[a+1]=TA[a+2]=TA[a+3]=TA[a+4]=TA[a+5]=0;
        TB[b]=TB[b+1]=TB[b+2]=0;
        addObs(v, TAu[v], TAv[v], bootPose, 0, 0, 0);
        addObs(v, PX[v], PY[v], pj, curC[0], curC[1], curC[2]);
      }
      triangulate();
