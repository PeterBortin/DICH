<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B08">
<title>DICH //TRACK</title>
<style>
:root{--accent:#6AD582;--hot:#DAFFC7;--amber:#FFC13C;--red:#DF2F2E;--bg:#050B08;--ink:#8FA99A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--accent);
  font-family:var(--mono);-webkit-user-select:none;user-select:none}
button{font-family:var(--mono);border:0;background:0 0;color:inherit}
#view{position:fixed;inset:0}
#view video,#view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#cam{z-index:1} #ov{z-index:2}
#bar{position:fixed;z-index:4;top:env(safe-area-inset-top);left:0;right:0;
  display:flex;gap:6px;align-items:center;padding:11px 13px;flex-wrap:wrap}
.tag{font-size:14px;font-weight:800;letter-spacing:.13em;color:var(--hot)}
.tag s{text-decoration:none;color:var(--accent);font-weight:400;font-size:10px;letter-spacing:.2em}
.chip{background:rgba(4,14,9,.8);border:1px solid rgba(106,213,130,.2);border-radius:99px;
  padding:4px 10px;font-size:9.5px;letter-spacing:.09em;color:var(--ink);white-space:nowrap}
.chip b{color:var(--hot)} .chip.g{border-color:rgba(106,213,130,.6)} .chip.g b{color:var(--accent)}
.chip.w{border-color:rgba(255,193,60,.5)} .chip.w b{color:var(--amber)}
.chip.e{border-color:rgba(223,47,46,.55)} .chip.e b{color:var(--red)}
#bar .r{margin-left:auto}
#log{position:fixed;z-index:4;left:13px;right:13px;top:calc(env(safe-area-inset-top) + 46px);
  font-size:11px;line-height:1.7;color:var(--ink);text-shadow:0 0 10px #000;max-height:52%;overflow-y:auto}
#log b{color:var(--hot)} #log .ok{color:var(--accent)} #log .no{color:var(--red)} #log .wt{color:var(--amber)}
#dock{position:fixed;z-index:4;left:0;right:0;bottom:0;
  padding:0 13px calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:9px}
#go{flex:1;height:54px;border-radius:99px;background:var(--accent);color:#03150c;
  font-size:12.5px;font-weight:700;letter-spacing:.13em}
#go:disabled{opacity:.45}
.mini{width:54px;height:54px;border-radius:99px;background:rgba(4,14,9,.8);
  border:1px solid rgba(106,213,130,.22);font-size:14px;color:var(--ink)}
#boot{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center}
#boot h1{margin:0;font-size:25px;font-weight:800;letter-spacing:.14em;color:var(--hot)}
#boot h1 s{text-decoration:none;color:var(--accent);font-weight:400;font-size:15px;letter-spacing:.22em}
#boot p{margin:0;max-width:330px;font-size:11px;line-height:1.85;color:var(--ink)}
#stamp{font-size:9px;letter-spacing:.18em;color:var(--amber)}
#start{background:var(--accent);color:#03150c;border-radius:99px;padding:14px 40px;
  font-size:12.5px;font-weight:700;letter-spacing:.14em}
#boot.hide{display:none}
#err{color:var(--red);font-size:10.5px;max-width:310px;line-height:1.6}
</style>
</head>
<body>
<div id="view">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
</div>
<div id="bar">
  <div class="tag">DICH <s>//TRACK</s></div>
  <div class="chip r" id="pSt"><b id="cSt">—</b></div>
  <div class="chip"><b id="cPts">0</b>ОЗНАК</div>
  <div class="chip"><b id="cFps">0</b>Гц</div>
  <div class="chip" id="pPath"><b id="cPath">0.00</b>ШЛЯХ</div>
</div>
<div id="log"></div>
<div id="dock">
  <button class="mini" id="bClr">↺</button>
  <button id="go">СТАРТ ТРЕКІНГУ</button>
</div>
<div id="boot">
  <h1>DICH <s>//TRACK</s></h1>
  <div id="stamp"></div>
  <p>Проба трекінгу. Перевіряє, чи AlvaAR тримає позу камери на цьому
     телефоні — до того, як на ньому щось будувати.</p>
  <button id="start">ПУСК</button>
  <div id="err"></div>
</div>

<script type="module">
const BUILD = 'T1 · проба AlvaAR';
document.getElementById('stamp').textContent = 'ЗБІРКА ' + BUILD;

const L = [];
function log(t, cls){
  L.push('<span class="' + (cls||'') + '">' + t + '</span>');
  if (L.length > 40) L.shift();
  const el = document.getElementById('log');
  el.innerHTML = L.join('<br>');
  el.scrollTop = el.scrollHeight;
}

/* Точних імен файлів у dist перевірити не вдалось — CDN був недоступний.
   Тому перебираємо кандидатів і показуємо, який спрацював. Мовчазної
   відмови бути не може: кожна спроба друкується. */
const SOURCES = [
  'https://cdn.jsdelivr.net/gh/alanross/AlvaAR@main/dist/alva_ar.js',
  'https://alanross.github.io/AlvaAR/dist/alva_ar.js',
  'https://cdn.jsdelivr.net/gh/alanross/AlvaAR@main/examples/public/assets/alva_ar.js',
  'https://alanross.github.io/AlvaAR/examples/public/assets/alva_ar.js',
  'https://cdn.jsdelivr.net/gh/alanross/AlvaAR@main/examples/public/alva_ar.js'
];

const vid = document.getElementById('cam');
const ov  = document.getElementById('ov');
const octx = ov.getContext('2d');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently:true });

let stream=null, alva=null, running=false, W=0, H=0;
let frames=0, tHz=0, lastT=0, tracked=0, lost=0;
let path=0, lastPos=null, curPos=[0,0,0], everTracked=false;

function cover(vw,vh,cw,ch){
  const cr=cw/ch; let sw,sh;
  if (vw/vh>cr){ sh=vh; sw=vh*cr; } else { sw=vw; sh=vw/cr; }
  return { sx:(vw-sw)/2, sy:(vh-sh)/2, sw, sh };
}
function viewSize(){ const v=document.getElementById('view');
  return { w:Math.max(1,v.clientWidth), h:Math.max(1,v.clientHeight) }; }

async function startCam(){
  stream = await navigator.mediaDevices.getUserMedia({ audio:false,
    video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} } });
  vid.srcObject = stream;
  await vid.play().catch(()=>{});
  await new Promise(r => vid.videoWidth ? r() : (vid.onloadedmetadata=()=>r()));
}

async function loadAlva(){
  log('Шукаю AlvaAR…');
  let mod = null, used = null;
  for (const url of SOURCES){
    try {
      log('  пробую ' + url.replace('https://',''));
      mod = await import(/* @vite-ignore */ url);
      if (mod && (mod.AlvaAR || mod.default)){ used = url; break; }
      log('  модуль без AlvaAR', 'wt');
      mod = null;
    } catch(e){
      log('  ✕ ' + (e && e.message ? e.message.slice(0,90) : e), 'wt');
    }
  }
  if (!mod) throw new Error('жодне джерело не завантажилось');
  log('✓ узято: ' + used.replace('https://',''), 'ok');
  return mod.AlvaAR || mod.default;
}

async function begin(){
  const go = document.getElementById('go');
  go.disabled = true;
  try {
    const AlvaAR = await loadAlva();
    /* Роздільність трекінгу нижча за камеру: SLAM рахує кожен кадр,
       і зайві пікселі тут коштують кадрів у секунду, а не якості. */
    const A = viewSize();
    W = 480; H = Math.max(1, Math.round(W * A.h / A.w));
    work.width = W; work.height = H;
    log(`Ініціалізую SLAM ${W}×${H}…`);
    alva = await AlvaAR.Initialize(W, H);
    log('✓ SLAM готовий', 'ok');
    log('Веди камерою повільно вбік. Трекінг стартує, коли набереться паралакс.', 'wt');
    running = true;
    go.textContent = 'ІДЕ';
    lastT = performance.now();
    loop();
  } catch(e){
    log('✕ ' + (e && e.message ? e.message : e), 'no');
    log('Якщо це CORS або 404 — файли треба покласти поруч із цією сторінкою ' +
        'і замінити список джерел на локальний шлях.', 'wt');
    go.disabled = false;
  }
}

function loop(){
  if (!running) return;
  requestAnimationFrame(loop);
  if (!vid.videoWidth) return;

  const c = cover(vid.videoWidth, vid.videoHeight, W, H);
  wctx.drawImage(vid, c.sx, c.sy, c.sw, c.sh, 0, 0, W, H);
  const frame = wctx.getImageData(0, 0, W, H);

  let pose = null;
  try { pose = alva.findCameraPose(frame); }
  catch(e){ log('findCameraPose впав: ' + (e.message||e), 'no'); running = false; return; }

  let pts = [];
  try { pts = alva.getFramePoints() || []; } catch(e){}

  const st = document.getElementById('cSt'), stp = document.getElementById('pSt');
  if (pose && pose.length >= 16){
    tracked++;
    if (!everTracked){ everTracked = true; log('✓ ТРЕКІНГ ПІШОВ', 'ok'); }
    /* поза — матриця 4×4 у стовпцевому порядку, зсув у 12..14 */
    curPos = [pose[12], pose[13], pose[14]];
    if (lastPos){
      const d = Math.hypot(curPos[0]-lastPos[0], curPos[1]-lastPos[1], curPos[2]-lastPos[2]);
      if (d < 0.5) path += d;                 // стрибок = зрив, у шлях не рахуємо
    }
    lastPos = curPos.slice();
    st.textContent = 'ТРЕКІНГ'; stp.className = 'chip r g';
  } else {
    lost++;
    lastPos = null;
    st.textContent = everTracked ? 'ЗАГУБИВ' : 'ЧЕКАЮ';
    stp.className = 'chip r ' + (everTracked ? 'e' : 'w');
  }

  /* точки, які SLAM реально бачить — це найпряміший доказ, що воно живе */
  const A = viewSize();
  if (ov.width !== A.w || ov.height !== A.h){ ov.width = A.w; ov.height = A.h; }
  octx.clearRect(0, 0, A.w, A.h);
  const sx = A.w / W, sy = A.h / H;
  octx.fillStyle = pose ? 'rgba(106,213,130,.9)' : 'rgba(255,193,60,.75)';
  for (const p of pts) octx.fillRect(p.x*sx - 1.5, p.y*sy - 1.5, 3, 3);

  document.getElementById('cPts').textContent = pts.length;
  document.getElementById('cPath').textContent = path.toFixed(2);
  const pp = document.getElementById('pPath');
  pp.className = 'chip ' + (path > 0.6 ? 'g' : path > 0.2 ? 'w' : '');

  frames++;
  const now = performance.now();
  if (now - lastT > 500){
    tHz = frames * 1000 / (now - lastT);
    document.getElementById('cFps').textContent = tHz.toFixed(1);
    frames = 0; lastT = now;
    if (everTracked && tracked + lost > 0){
      const keep = Math.round(100 * tracked / (tracked + lost));
      if (keep < 60) log(`утримання ${keep}% — трекінг рветься`, 'wt');
    }
  }
}

document.getElementById('go').addEventListener('click', begin);
document.getElementById('bClr').addEventListener('click', () => {
  path = 0; lastPos = null; tracked = 0; lost = 0; L.length = 0;
  document.getElementById('log').innerHTML = '';
  log('лічильники скинуто');
});
document.getElementById('start').addEventListener('click', async () => {
  const err = document.getElementById('err');
  err.textContent = 'Камеру шукаю…';
  try {
    if (!isSecureContext) throw new Error('потрібен HTTPS');
    await startCam();
    document.getElementById('boot').classList.add('hide');
    log('Камера: ' + vid.videoWidth + '×' + vid.videoHeight, 'ok');
    log('Тисни СТАРТ ТРЕКІНГУ.');
  } catch(e){ err.textContent = 'Не пішло: ' + (e.message||e); }
});
</script>
</body>
</html>
